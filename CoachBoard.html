          (local ? mt.pen.b : mt.pen.a) + ' <span>en penaltis</span></div>'
        : "") +
      '<div class="clock num ' + claseReloj(mt) + '" id="mClock">' +
        (mt ? (enDescanso() ? textoDescanso() : U.mmss(relojSeg())) : "00:00") + '</div>' +
      '<div class="per">' + (mt && (mt.run || enDescanso()) ? '<span class="live"></span>' : "") +
        (mt ? U.esc(estadoPeriodo(mt)) : "sin convocatoria") + '</div>' +
      '<div class="scoreadj">' +
        '<button onclick="CB.match.corregir(-1,0)" aria-label="Quitar gol nuestro">−</button>' +
        '<span class="eyebrow">corregir</span>' +
        '<button onclick="CB.match.corregir(0,-1)" aria-label="Quitar gol rival">−</button>' +
      '</div>' +
      (mt ? '<button class="durlink" onclick="CB.match.duracion()">' +
        U.esc(M.durTexto(dur())) + ' · cambiar</button>' : "") +
      '</div>';

    if (!mt) {
      h += '<div class="grid-2 mt2">' +
        '<button class="btn pri lg" onclick="CB.match.convocar()">' + U.svg("users2") + 'Convocar</button>' +
        (hayActa ? '<button class="btn lg" onclick="CB.match.recuperarActa()">' + U.svg("undo") + 'Reanudar acta</button>'
                 : '<button class="btn lg" onclick="CB.agenda.editar(\'' + e.id + '\')">' + U.svg("pencil") + 'Editar partido</button>') +
        '</div>';
      h += '<div class="empty mt3"><b>Prepara la convocatoria</b>' +
        'Elige a los citados y después coloca el once inicial. El cronómetro cuenta los minutos de cada jugador.</div>';
      U.set("matchBody", h);
      return;
    }

    /* --- control del reloj (en la tanda no hay reloj que llevar) --- */
    if (enPenaltis()) {
      h += '<button class="btn pri lg wide mt2" onclick="CB.match.penaltis()">' +
        U.svg("ball") + 'Tanda de penaltis</button>';
    } else if (enDescanso()) {
      h += '<button class="btn pri lg wide mt2" onclick="CB.match.empezarParte()">' +
        U.svg("play") + 'Empezar ' + conArticulo(mt.per) + '</button>';
    } else {
      h += '<button class="btn ' + (mt.run ? "warn" : "pri") + ' lg wide mt2" onclick="CB.match.reloj()">' +
        U.svg(mt.run ? "pause" : "play") + (mt.run ? "Pausar" : mt.started ? "Reanudar" : "Iniciar partido") + '</button>';
    }

    /* --- acciones rápidas --- */
    h += '<div class="grid-4 mt2">' +
      accion("ball", "Gol", "CB.match.gol()", "pri") +
      accion("swap", "Cambio", "CB.match.cambio()", "info") +
      accion("card", "Amarilla", "CB.match.tarjeta('y')", "warn") +
      accion("card", "Roja", "CB.match.tarjeta('r')", "danger") +
      '</div>';

    h += '<div class="grid-4 mt1">' +
      accion("ball", "Gol rival", "CB.match.golRival()", "") +
      accion("t_player", "Asist.", "CB.match.asistencia()", "") +
      accion("whistle", "Falta", "CB.match.falta()", "") +
      accion("note", "Nota", "CB.match.nota()", "") +
      '</div>';

    h += '<div class="seg mt2">' +
      '<button class="' + (panelActivo === "directo" ? "on" : "") + '" onclick="CB.match.pestana(\'directo\')">En directo</button>' +
      '<button class="' + (panelActivo === "plantilla" ? "on" : "") + '" onclick="CB.match.pestana(\'plantilla\')">Plantilla y minutos</button>' +
      '</div>';

    h += '<div id="mPanel" class="mt2"></div>';

    h += '<div class="grid-2 mt3">' +
      '<button class="btn sm" onclick="CB.match.periodo()">' + U.svg("clock") +
        '<span class="lbl">' + etiquetaFinParte() + '</span></button>' +
      '<button class="btn sm" onclick="CB.match.alineacion()">' + U.svg("users2") + 'Alineación</button>' +
      '</div>';
    h += '<div class="grid-2 mt1">' +
      '<button class="btn sm ghost" onclick="CB.match.convocar()">Convocatoria</button>' +
      '<button class="btn sm ghost" onclick="CB.match.finalizar()">' + U.svg("flag") + 'Finalizar acta</button>' +
      '</div>';
    if (hayActa) {
      h += '<button class="btn sm wide mt1" onclick="CB.match.actaPdf()">' + U.svg("pdf") + 'Acta en PDF</button>';
    }

    U.set("matchBody", h);
    pintarPanel();
  }

  function claseReloj(mt) {
    if (!mt) return "stop";
    if (enDescanso()) return "des";
    return mt.run ? "" : "stop";
  }
  function estadoPeriodo(mt) {
    if (enDescanso()) return "Descanso · ahora " + etiquetaPeriodo(mt.per);
    return etiquetaPeriodo(mt.per) + " · " +
      (mt.run ? "en juego" : mt.started ? "pausado" : "detenido");
  }

  function accion(icon, label, fn, cls) {
    return '<button class="btn stack ' + (cls || "") + '" onclick="' + fn + '">' +
      U.svg(icon) + '<span class="lbl">' + label + '</span></button>';
  }

  function pestana(p) { panelActivo = p; render(); }

  function pintarPanel() {
    if (panelActivo === "plantilla") pintarPlantilla();
    else pintarDirecto();
  }

  function pintarDirecto() {
    var mt = m();
    if (!mt || !mt.log.length) {
      U.set("mPanel", '<div class="empty">' +
        (mt ? '<b>Aquí verás el partido</b>Goles, tarjetas y cambios se apilan con su minuto en cuanto los anotes.'
            : "Convoca a los jugadores para empezar.") + '</div>');
      return;
    }
    var html = '<div class="tl">' + mt.log.map(function (l) {
      if (l.k === "periodo") {
        return '<div class="per-sep"><span>' + U.esc(l.t) + '</span></div>';
      }
      var caja = '<div class="box">' + icono(l.k) + '<div class="tx"><b>' + U.esc(l.t) + '</b>' +
        (l.sub ? '<small>' + U.esc(l.sub) + '</small>' : "") + '</div></div>';
      return '<div class="ev ' + (l.s === "b" ? "b" : "") + '">' +
        '<div class="side">' + caja + '</div>' +
        '<div class="min">' + l.m + "'" + '</div>' +
        '<div class="pad"></div></div>';
    }).join("") + '</div>';
    U.set("mPanel", html);
  }

  function pintarPlantilla() {
    var mt = m();
    if (!mt) return;
    var html = '<div class="section" style="margin-top:0"><span class="eyebrow">En el campo</span>' +
      '<span class="link">' + mt.campo.length + '/11</span></div>';
    html += mt.campo.length
      ? '<div class="plist">' + mt.campo.map(filaJugador).join("") + '</div>'
      : '<div class="empty">Coloca el once con el botón Alineación.</div>';
    html += '<div class="section"><span class="eyebrow">Banquillo</span>' +
      '<span class="link">' + mt.banq.length + '</span></div>';
    html += mt.banq.length
      ? '<div class="plist">' + mt.banq.map(filaJugador).join("") + '</div>'
      : '<div class="empty">Banquillo vacío.</div>';

    var fuera = mt.conv.filter(function (id) {
      return mt.campo.indexOf(id) < 0 && mt.banq.indexOf(id) < 0;
    });
    if (fuera.length) {
      html += '<div class="section"><span class="eyebrow">Fuera del campo</span></div>' +
        '<div class="plist">' + fuera.map(filaJugador).join("") + '</div>';
    }
    U.set("mPanel", html);
  }

  function filaJugador(id) {
    var mt = m(), j = S.jug(id);
    if (!j) return "";
    var marcas = "";
    for (var i = 0; i < (mt.ta[id] || 0); i++) marcas += '<span class="mk y"></span>';
    if (mt.tr[id]) marcas += '<span class="mk r"></span>';
    if (mt.gol[id]) marcas += '<span class="mk txt g">' + mt.gol[id] + 'G</span>';
    if (mt.asi && mt.asi[id]) marcas += '<span class="mk txt a">' + mt.asi[id] + 'A</span>';
    if (mt.fal && mt.fal[id]) marcas += '<span class="mk txt f">' + mt.fal[id] + 'F</span>';
    return '<div class="prow ' + (mt.st[id] === "Expulsado" ? "muted" : "") + '">' +
      '<span class="num-badge sm">' + (j.dorsal || "–") + '</span>' +
      '<div class="pmain"><div class="nm">' + U.esc(j.nombre) + '</div>' +
      '<div class="sub">' + U.esc(mt.st[id] || "") + '</div></div>' +
      '<div class="marks">' + marcas + '</div>' +
      '<div class="pend"><div class="big">' + Math.floor((mt.t[id] || 0) / 60) + "'" + '</div></div></div>';
  }

  /* ---------------------------------------------------------
     Convocatoria y alineación
     --------------------------------------------------------- */
  function convocar() {
    if (!evId) { U.toast("Programa antes un partido"); return; }
    if (!window.DB.jugadores.length) { U.toast("No hay plantilla"); return; }
    /* Por defecto se marca solo a los disponibles. Antes venía toda la
       plantilla marcada, lesionados incluidos: bastaba con pulsar
       Convocar sin mirar para que luego las listas de falta, tarjeta o
       asistencia enseñaran al equipo entero. */
    var previos = (m() && m().ev === evId)
      ? m().conv
      : window.DB.jugadores
          .filter(function (j) { return j.estado === "Disponible"; })
          .map(function (j) { return j.id; });
    var arr = window.DB.jugadores.slice().sort(function (a, b) { return (a.dorsal || 99) - (b.dorsal || 99); });

    var body = '<div class="chiprow mb2">' +
      '<button class="chip" onclick="CB.match.marcar(\'todos\')">Todos</button>' +
      '<button class="chip" onclick="CB.match.marcar(\'ninguno\')">Ninguno</button>' +
      '<button class="chip" onclick="CB.match.marcar(\'disponibles\')">Solo disponibles</button>' +
      '<span class="chip fin" id="convN"></span></div>';

    body += arr.map(function (j) {
      return '<label class="pick"><input type="checkbox" value="' + j.id + '" ' +
        (previos.indexOf(j.id) >= 0 ? "checked" : "") + ' onchange="CB.match.contar()">' +
        '<span class="num-badge sm">' + (j.dorsal || "–") + '</span>' +
        '<span class="pmain"><span class="nm">' + U.esc(j.nombre) + '</span>' +
        '<span class="sub">' + U.esc(j.pos) + (j.estado !== "Disponible" ? " · " + U.esc(j.estado) : "") + '</span></span></label>';
    }).join("");

    window.CB.shell.openSheet("Convocatoria", body, [
      { text: "Cancelar", cls: "ghost", fn: window.CB.shell.closeSheet },
      {
        text: "Convocar", cls: "pri", fn: function () {
          var ids = [].slice.call(document.querySelectorAll("#sheetBody input:checked"))
            .map(function (i) { return i.value; });
          if (!ids.length) { U.toast("No has marcado a nadie"); return; }
          nuevoPartido(evId, ids);
          window.CB.shell.closeSheet();
        }
      }
    ]);
    contarConvocados();
  }

  function casillas() {
    return [].slice.call(document.querySelectorAll('#sheetBody input[type="checkbox"]'));
  }
  function marcarConvocatoria(que) {
    casillas().forEach(function (c) {
      var j = S.jug(c.value) || {};
      c.checked = que === "todos" ? true
        : que === "ninguno" ? false
          : j.estado === "Disponible";
    });
    contarConvocados();
  }
  function contarConvocados() {
    var n = casillas().filter(function (c) { return c.checked; }).length;
    U.txt("convN", n + (n === 1 ? " convocado" : " convocados"));
  }

  function nuevoPartido(id, ids) {
    var e = S.ev(id);
    var mt = {
      ev: id, conv: ids, campo: [], banq: ids.slice(),
      per: 0, seg: 0, run: false, started: false,
      /* Copia, no referencia: si luego se edita el calendario, el
         partido que se está dirigiendo no cambia de duración solo. */
      dur: M.normDur(e && e.dur),
      br: null,
      gf: 0, gc: 0, log: [], goles: [], titulares: [],
      t: {}, st: {}, ta: {}, tr: {}, gol: {}, asi: {}, fal: {}
    };
    ids.forEach(function (i) {
      mt.t[i] = 0; mt.st[i] = "Banquillo"; mt.ta[i] = 0;
      mt.tr[i] = 0; mt.gol[i] = 0; mt.asi[i] = 0; mt.fal[i] = 0;
    });
    window.DB.match = mt;
    parar();
    S.save();
    render();
    U.toast(ids.length + " convocados");
    setTimeout(alineacion, 250);
  }

  function alineacion() {
    var mt = m();
    if (!mt) { U.toast("Convoca primero"); return; }
    var body = '<p class="hint">Marca a los once que salen de inicio. El resto queda en el banquillo.</p>' +
      mt.conv.map(function (id) {
        var j = S.jug(id);
        if (!j) return "";
        return '<label class="pick"><input type="checkbox" value="' + id + '" ' +
          (mt.campo.indexOf(id) >= 0 ? "checked" : "") + '>' +
          '<span class="num-badge sm">' + (j.dorsal || "–") + '</span>' +
          '<span class="pmain"><span class="nm">' + U.esc(j.nombre) + '</span>' +
          '<span class="sub">' + U.esc(j.pos) + '</span></span></label>';
      }).join("");

    window.CB.shell.openSheet("Once inicial", body, [
      { text: "Cancelar", cls: "ghost", fn: window.CB.shell.closeSheet },
      {
        text: "Confirmar", cls: "pri", fn: function () {
          var ids = [].slice.call(document.querySelectorAll("#sheetBody input:checked"))
            .map(function (i) { return i.value; });
          if (ids.length > 11) { U.toast("Como mucho once jugadores"); return; }
          mt.campo = ids;
          mt.banq = mt.conv.filter(function (x) {
            return ids.indexOf(x) < 0 && mt.st[x] !== "Expulsado";
          });
          mt.conv.forEach(function (x) {
            if (mt.st[x] === "Expulsado") return;
            mt.st[x] = ids.indexOf(x) >= 0 ? "En el campo" : "Banquillo";
          });
          if (!mt.started) mt.titulares = ids.slice();
          S.save();
          window.CB.shell.closeSheet();
          render();
        }
      }
    ]);
  }

  /* ---------------------------------------------------------
     Selector de jugador reutilizable
     --------------------------------------------------------- */
  function elegirJugador(titulo, ids, subtitulo, onPick, extra) {
    if (!ids.length) { U.toast("No hay jugadores disponibles"); return; }
    var body = (subtitulo ? '<p class="hint">' + U.esc(subtitulo) + '</p>' : "") +
      '<div class="plist">' + ids.map(function (id) {
        var j = S.jug(id);
        if (!j) return "";
        var mt = m();
        var extraTxt = mt ? Math.floor((mt.t[id] || 0) / 60) + "'" : "";
        return '<div class="prow tap" onclick="CB.match._pick(\'' + id + '\')">' +
          '<span class="num-badge sm">' + (j.dorsal || "–") + '</span>' +
          '<div class="pmain"><div class="nm">' + U.esc(j.nombre) + '</div>' +
          '<div class="sub">' + U.esc(j.pos) + '</div></div>' +
          '<div class="pend"><div class="big">' + extraTxt + '</div></div></div>';
      }).join("") + '</div>';

    pickHandler = onPick;
    var botones = [{ text: "Cancelar", cls: "ghost", fn: function () { pickHandler = null; window.CB.shell.closeSheet(); } }];
    if (extra) botones.unshift({ text: extra.text, cls: "ghost", fn: extra.fn });
    window.CB.shell.openSheet(titulo, body, botones);
  }
  var pickHandler = null;
  function _pick(id) {
    var fn = pickHandler;
    pickHandler = null;
    window.CB.shell.closeSheet();
    if (fn) fn(id);
  }

  function elegirOpcion(titulo, subtitulo, opciones, onPick) {
    var body = (subtitulo ? '<p class="hint">' + U.esc(subtitulo) + '</p>' : "") +
      opciones.map(function (o, i) {
        return '<button class="btn wide ' + (i === 0 ? "" : "mt1") +
          '" onclick="CB.match._opt(' + i + ')">' + U.esc(o) + '</button>';
      }).join("");
    optHandler = { fn: onPick, ops: opciones };
    window.CB.shell.openSheet(titulo, body, [
      { text: "Cancelar", cls: "ghost", fn: function () { optHandler = null; window.CB.shell.closeSheet(); } }
    ]);
  }
  var optHandler = null;
  function _opt(i) {
    var h = optHandler;
    optHandler = null;
    window.CB.shell.closeSheet();
    if (h && h.fn) h.fn(h.ops[i]);
  }

  /* ---------------------------------------------------------
     Acciones
     --------------------------------------------------------- */
  function gol() {
    var mt = m();
    if (!mt) { U.toast("Convoca primero"); return; }
    /* En la tanda los goles no cuentan en el marcador: se anotan aparte. */
    if (enPenaltis()) { penaltis(); return; }
    var enCampo = mt.campo.slice();
    elegirJugador("Gol · ¿quién marcó?", enCampo, "", function (id) {
      preguntarTipoGol(id);
    }, { text: "Sin goleador", fn: function () { window.CB.shell.closeSheet(); preguntarTipoGol(null); } });
  }

  function preguntarTipoGol(id) {
    golPendiente = id;
    elegirOpcion("¿Cómo fue el gol?", id ? nombre(id) : "Gol a favor", M.TIPOS_GOL, function (tipo) {
      registrarGol(tipo);
    });
  }

  function registrarGol(tipo) {
    var mt = m();
    if (!mt) return;
    var autor = tipo === "En propia del rival" ? null : golPendiente;
    if (autor) mt.gol[autor] = (mt.gol[autor] || 0) + 1;
    mt.gf++;
    mt.goles.push({ min: minuto(), eq: "A", j: autor, a: null, tipo: tipo });
    log(autor ? nombre(autor) : "Gol a favor", "gol", "a", "Gol de " + tipo.toLowerCase());
    S.save();
    render();
    if (autor && (tipo === "Jugada" || tipo === "Corner")) {
      var cand = mt.campo.filter(function (i) { return i !== autor; });
      if (cand.length) {
        setTimeout(function () {
          elegirJugador("¿Quién dio la asistencia?", cand, "", function (aid) {
            anotarAsistencia(aid, true);
          }, { text: "Sin asistencia", fn: function () { golPendiente = null; window.CB.shell.closeSheet(); } });
        }, 220);
        return;
      }
    }
    golPendiente = null;
  }

  function anotarAsistencia(id, ligadaAlGol) {
    var mt = m();
    if (!mt) return;
    mt.asi[id] = (mt.asi[id] || 0) + 1;
    if (ligadaAlGol) {
      for (var i = mt.goles.length - 1; i >= 0; i--) {
        if (mt.goles[i].eq === "A" && mt.goles[i].j === golPendiente && !mt.goles[i].a) {
          mt.goles[i].a = id;
          break;
        }
      }
      var g = mt.log.filter(function (l) { return l.k === "gol"; })[0];
      if (g) g.sub = (g.sub ? g.sub + " · " : "") + "asist. " + nombre(id);
    } else {
      log(nombre(id), "asis", "a", "Asistencia");
    }
    golPendiente = null;
    S.save();
    render();
  }

  function asistencia() {
    var mt = m();
    if (!mt) return;
    elegirJugador("Asistencia", mt.campo.concat(mt.banq), "Suma un pase de gol", function (id) {
      anotarAsistencia(id, false);
    });
  }

  function golRival() {
    var mt = m();
    if (!mt) { U.toast("Convoca primero"); return; }
    if (enPenaltis()) { penaltis(); return; }
    elegirOpcion("Gol del rival", "¿Cómo encajamos?", M.TIPOS_GOL_RIVAL, function (tipo) {
      mt.gc++;
      mt.goles.push({ min: minuto(), eq: "B", j: null, a: null, tipo: tipo });
      log("Gol del rival", "golcon", "b", "De " + tipo.toLowerCase());
      S.save();
      render();
    });
  }

  function corregir(f, c) {
    var mt = m();
    if (!mt) return;
    var eq = f < 0 ? "A" : "B";
    if (eq === "A") { if (mt.gf <= 0) return; mt.gf--; }
    else { if (mt.gc <= 0) return; mt.gc--; }
    for (var i = mt.goles.length - 1; i >= 0; i--) {
      if (mt.goles[i].eq === eq) {
        var g = mt.goles[i];
        if (g.j && mt.gol[g.j]) mt.gol[g.j]--;
        if (g.a && mt.asi[g.a]) mt.asi[g.a]--;
        mt.goles.splice(i, 1);
        break;
      }
    }
    log("Corrección del marcador", "nota");
    S.save();
    render();
  }

  function cambio() {
    var mt = m();
    if (!mt) { U.toast("Convoca primero"); return; }
    if (!mt.started && mt.campo.length < 11 && mt.banq.length) {
      /* Antes del pitido inicial, el "cambio" es simplemente subir al once. */
      elegirJugador("Sube al once", mt.banq, "El partido aún no ha empezado", function (id) {
        mt.banq = mt.banq.filter(function (x) { return x !== id; });
        mt.campo.push(id);
        mt.st[id] = "En el campo";
        S.save();
        render();
      });
      return;
    }
    if (!mt.campo.length) { U.toast("No hay nadie en el campo"); return; }
    if (!mt.banq.length) { U.toast("El banquillo está vacío"); return; }
    elegirJugador("Cambio · ¿quién sale?", mt.campo, "", function (sale) {
      setTimeout(function () {
        elegirJugador("¿Quién entra?", mt.banq, "Sale " + nombre(sale), function (entra) {
          mt.campo = mt.campo.filter(function (x) { return x !== sale; });
          mt.banq = mt.banq.filter(function (x) { return x !== entra; });
          mt.campo.push(entra);
          mt.banq.push(sale);
          mt.st[sale] = "Sustituido";
          mt.st[entra] = "En el campo";
          log(nombre(entra), "cambio", "a", "por " + nombre(sale));
          S.save();
          render();
        });
      }, 200);
    });
  }

  function tarjeta(tipo) {
    var mt = m();
    if (!mt) { U.toast("Convoca primero"); return; }
    var ids = mt.campo.concat(mt.banq);
    elegirJugador(tipo === "y" ? "Tarjeta amarilla" : "Tarjeta roja", ids, "¿A qué jugador?", function (id) {
      if (tipo === "y") {
        mt.ta[id] = (mt.ta[id] || 0) + 1;
        log(nombre(id), mt.ta[id] >= 2 ? "doble" : "amarilla", "a",
            mt.ta[id] >= 2 ? "Segunda amarilla" : "Amonestación");
        S.save();
        render();
        if (mt.ta[id] >= 2 && !mt.tr[id] &&
            window.CB.shell.confirmar(nombre(id) + " acumula dos amarillas. ¿Registrar la expulsión?")) {
          expulsar(id);
        }
      } else {
        expulsar(id);
      }
    });
  }

  function expulsar(id) {
    var mt = m();
    mt.tr[id] = 1;
    mt.st[id] = "Expulsado";
    mt.campo = mt.campo.filter(function (x) { return x !== id; });
    mt.banq = mt.banq.filter(function (x) { return x !== id; });
    log(nombre(id), "roja", "a", "Expulsado · quedamos " + mt.campo.length);
    S.save();
    render();
  }

  function falta() {
    var mt = m();
    if (!mt) { U.toast("Convoca primero"); return; }
    elegirJugador("Falta cometida", mt.campo.concat(mt.banq), "¿Quién la hizo?", function (id) {
      mt.fal[id] = (mt.fal[id] || 0) + 1;
      log(nombre(id), "falta", "a", "Falta · " + mt.fal[id] + " en el partido");
      S.save();
      render();
    });
  }

  function nota() {
    var mt = m();
    if (!mt) return;
    var t = window.prompt("Incidencia (lesión, ocasión, ajuste táctico...)");
    if (t && t.trim()) {
      log(t.trim(), "nota");
      S.save();
      render();
    }
  }

  /* ---------------------------------------------------------
     Tanda de penaltis

     Va aparte del marcador: una tanda no cambia el resultado del
     partido (2-2 sigue siendo 2-2) ni suma goles a las estadísticas
     de nadie. Solo decide quién pasa.
     --------------------------------------------------------- */
  function tanda() {
    var mt = m();
    if (!mt) return null;
    if (!mt.pen) mt.pen = { a: 0, b: 0, tiros: [] };
    return mt.pen;
  }

  function irAPenaltis() {
    var mt = m();
    if (!mt) return;
    parar();
    if (!enPenaltis()) {
      log(finDe(mt.per) + " (" + U.mmss(relojSeg()) + ")", "periodo");
      mt.br = null;
      mt.per = M.penIndex(dur());
      mt.seg = 0;
      tanda();
      log("Comienza la tanda de penaltis", "periodo");
    }
    S.save();
    render();
    penaltis();
  }

  function penaltis() {
    var mt = m();
    if (!mt) { U.toast("Convoca primero"); return; }
    if (!enPenaltis()) {
      if (!window.CB.shell.confirmar("¿Empezar ya la tanda de penaltis?")) return;
      irAPenaltis();
      return;
    }

    var p = tanda();
    var lista = p.tiros.length
      ? '<div class="plist mt2">' + p.tiros.map(function (t, i) {
          var quien = t.eq === "a" ? (t.j ? nombre(t.j) : S.club()) : rivalNombre();
          return '<div class="prow"><span class="num-badge sm">' + (i + 1) + '</span>' +
            '<div class="pmain"><div class="nm">' + U.esc(quien) + '</div>' +
            '<div class="sub">' + (t.eq === "a" ? "Nosotros" : "Rival") + '</div></div>' +
            '<div class="pend"><div class="big">' + (t.ok ? "✓" : "✕") + '</div></div></div>';
        }).join("") + '</div>'
      : '<p class="hint mt2">Todavía no ha lanzado nadie.</p>';

    window.CB.shell.openSheet("Tanda de penaltis",
      '<div class="kpi accent"><div class="v">' + p.a + " – " + p.b + '</div>' +
        '<div class="k">' + U.esc(S.club()) + " · " + U.esc(rivalNombre()) + '</div></div>' +
      '<div class="grid-2 mt2">' +
        '<button class="btn pri" onclick="CB.match.penTiro(\'a\',1)">Marcamos</button>' +
        '<button class="btn" onclick="CB.match.penTiro(\'a\',0)">Fallamos</button>' +
      '</div>' +
      '<div class="grid-2 mt1">' +
        '<button class="btn" onclick="CB.match.penTiro(\'b\',1)">Marca el rival</button>' +
        '<button class="btn" onclick="CB.match.penTiro(\'b\',0)">Falla el rival</button>' +
      '</div>' +
      (p.tiros.length
        ? '<button class="btn sm ghost wide mt2" onclick="CB.match.penDeshacer()">Deshacer el último lanzamiento</button>'
        : "") +
      lista,
      [
        { text: "Finalizar el partido", cls: "pri", fn: function () { window.CB.shell.closeSheet(); finalizar(true); } },
        { text: "Cerrar", cls: "ghost", fn: window.CB.shell.closeSheet }
      ]);
  }

  function penTiro(eq, ok) {
    var mt = m();
    if (!mt) return;
    ok = String(ok) === "1";
    if (eq !== "a") { registrarTiro("b", null, ok); return; }
    var ids = mt.campo.concat(mt.banq);
    if (!ids.length) { registrarTiro("a", null, ok); return; }
    elegirJugador(ok ? "¿Quién marcó?" : "¿Quién falló?", ids, "Lanzamiento de la tanda",
      function (id) { registrarTiro("a", id, ok); },
      { text: "Sin anotar quién", fn: function () {
          pickHandler = null;
          window.CB.shell.closeSheet();
          registrarTiro("a", null, ok);
        } });
  }

  function registrarTiro(eq, id, ok) {
    var p = tanda();
    if (!p) return;
    p.tiros.push({ eq: eq, j: id || null, ok: ok });
    if (ok) { if (eq === "a") p.a++; else p.b++; }
    var quien = eq === "a" ? (id ? nombre(id) : S.club()) : rivalNombre();
    log(quien, ok ? "pengol" : "penfallo", eq,
      (ok ? "Penalti marcado" : "Penalti fallado") + " · tanda " + p.a + "–" + p.b);
    S.save();
    render();
    penaltis();
  }

  function penDeshacer() {
    var mt = m();
    var p = tanda();
    if (!p || !p.tiros.length) return;
    var t = p.tiros.pop();
    if (t.ok) {
      if (t.eq === "a") p.a = Math.max(0, p.a - 1);
      else p.b = Math.max(0, p.b - 1);
    }
    /* Su línea de la crónica es la más reciente de la tanda. */
    for (var i = 0; i < mt.log.length; i++) {
      if (mt.log[i].k === "pengol" || mt.log[i].k === "penfallo") { mt.log.splice(i, 1); break; }
    }
    S.save();
    render();
    penaltis();
  }

  /* ---------------------------------------------------------
     Cierre del acta
     --------------------------------------------------------- */
  function finalizar(sinPreguntar) {
    var mt = m();
    if (!mt) return;
    if (!sinPreguntar && !window.CB.shell.confirmar("¿Cerrar el acta y guardarla?")) return;
    mt.br = null;   // si se cierra durante el descanso, no queda corriendo
    parar();
    log("Final del partido", "periodo");
    var e = S.ev(mt.ev) || { fecha: "", rival: "" };
    var acta = {
      id: U.uid(), ev: mt.ev, fecha: e.fecha, rival: e.rival,
      gf: mt.gf, gc: mt.gc, log: mt.log,
      goles: mt.goles || [], titulares: mt.titulares || [],
      pen: (mt.pen && mt.pen.tiros.length) ? mt.pen : null,
      dur: M.normDur(mt.dur),
      jug: mt.conv.map(function (id) {
        var j = S.jug(id) || {};
        return {
          j: id, dorsal: j.dorsal, nombre: j.nombre, pos: j.pos,
          seg: mt.t[id], min: Math.floor((mt.t[id] || 0) / 60), st: mt.st[id],
          gol: mt.gol[id] || 0, asi: (mt.asi && mt.asi[id]) || 0,
          fal: (mt.fal && mt.fal[id]) || 0, ta: mt.ta[id] || 0, tr: mt.tr[id] || 0
        };
      })
    };
    window.DB.partidos = window.DB.partidos.filter(function (p) { return p.ev !== mt.ev; });
    window.DB.partidos.push(acta);
    S.save();
    render();

    window.CB.shell.openSheet("Acta cerrada",
      '<p class="hint">' + acta.gf + " – " + acta.gc + " frente a " + U.esc(acta.rival || "el rival") +
      '. Ya está guardada en el dispositivo.</p>' +
      '<button class="btn pri wide" onclick="CB.reports.actaPdfPorId(\'' + acta.id + '\')">' +
        U.svg("pdf") + 'Acta en PDF</button>' +
      '<button class="btn wide mt1" onclick="CB.reports.actaTxtPorId(\'' + acta.id + '\')">' +
        U.svg("download") + 'Descargar en texto</button>',
      [{ text: "Cerrar", cls: "ghost", fn: window.CB.shell.closeSheet }]);
  }

  function actaPdf() {
    var a = window.DB.partidos.filter(function (p) { return p.ev === evId; })[0];
    if (!a) { U.toast("Este partido aún no tiene acta"); return; }
    window.CB.reports.actaPdf(a);
  }

  function recuperarActa() {
    var a = window.DB.partidos.filter(function (p) { return p.ev === evId; })[0];
    if (!a) { U.toast("Este partido no tiene acta"); return; }
    var mt = {
      ev: evId, conv: a.jug.map(function (f) { return f.j; }),
      campo: [], banq: [], per: 0, seg: 0, run: false, started: true,
      gf: a.gf, gc: a.gc, log: a.log, goles: a.goles || [], titulares: a.titulares || [],
      pen: a.pen || null, dur: M.normDur(a.dur), br: null,
      t: {}, st: {}, ta: {}, tr: {}, gol: {}, asi: {}, fal: {}
    };
    a.jug.forEach(function (f) {
      mt.t[f.j] = f.seg; mt.st[f.j] = f.st; mt.ta[f.j] = f.ta; mt.tr[f.j] = f.tr;
      mt.gol[f.j] = f.gol; mt.asi[f.j] = f.asi || 0; mt.fal[f.j] = f.fal || 0;
      if (f.st === "En el campo") mt.campo.push(f.j);
      else if (f.st !== "Expulsado") mt.banq.push(f.j);
    });
    window.DB.match = mt;
    parar();
    S.save();
    render();
    U.toast("Acta recuperada");
  }

  function cambiar(id) {
    if (m() && m().ev !== id) {
      if (!window.CB.shell.confirmar("Hay un partido en curso. ¿Cambiar de partido y descartarlo?")) {
        var s = U.$("mSel");
        if (s) s.value = m().ev;
        return;
      }
      parar();
      window.DB.match = null;
      S.save();
    }
    evId = id;
    render();
  }

  window.CB.match = {
    render: render, seleccionar: seleccionar, cambiar: cambiar,
    reloj: alternarReloj, periodo: siguientePeriodo,
    empezarParte: empezarParte, duracion: cambiarDuracion,
    convocar: convocar, alineacion: alineacion,
    marcar: marcarConvocatoria, contar: contarConvocados,
    gol: gol, golRival: golRival, asistencia: asistencia, cambio: cambio,
    tarjeta: tarjeta, falta: falta, nota: nota, corregir: corregir,
    penaltis: penaltis, penTiro: penTiro, penDeshacer: penDeshacer,
    finalizar: finalizar, actaPdf: actaPdf, recuperarActa: recuperarActa,
    pestana: pestana, detener: parar,
    _pick: _pick, _opt: _opt
  };
})();

</script>
<script>
/* ===== js/features/drills.js ===== */
/* =============================================================
   CoachBoard · features/drills.js
   Diseñador de entrenamientos: una pizarra táctica de bolsillo.
   ============================================================= */
(function () {
  "use strict";
  var U = window.CB.util;
  var S = window.CB.store;
  var M = window.CB.models;

  var sc = null;                 // instancia del motor de escena
  var ejercicioId = null;
  var meta = { nombre: "Ejercicio sin título", categoria: "", min: "15", jugadores: "", desc: "" };

  function init() {
    if (sc) return;
    sc = window.CB.scene.create({
      canvas: U.$("cDrill"),
      stage: U.$("drillStage"),
      ctxbar: U.$("drillCtx"),
      pill: U.$("drillPill"),
      onEditText: editarTexto,
      onChange: function () { pintarBarraEstado(); }
    });
    construirHerramientas();
    conectarBarraContextual();
    sc.fit();
  }

  /* ---------------------------------------------------------
     Paleta de herramientas
     --------------------------------------------------------- */
  function construirHerramientas() {
    U.set("drillTools", M.TOOLS.map(function (t) {
      return '<button class="tool ' + (t.id === "Mover" ? "on" : "") + '" data-t="' + t.id + '">' +
        U.svg(t.icon) + '<span>' + t.label + '</span></button>';
    }).join(""));

    document.querySelectorAll("#drillTools .tool").forEach(function (b) {
      b.onclick = function () {
        sc.setTool(b.dataset.t);
        document.querySelectorAll("#drillTools .tool").forEach(function (x) {
          x.classList.toggle("on", x === b);
        });
      };
    });

    U.set("drillColors", Object.keys(M.COLS).map(function (c) {
      return '<button class="sw ' + (c === "Azul" ? "on" : "") + '" data-c="' + c +
        '" style="background:' + M.COLS[c] + '" aria-label="' + c + '"></button>';
    }).join(""));

    document.querySelectorAll("#drillColors .sw").forEach(function (b) {
      b.onclick = function () {
        sc.setColor(b.dataset.c);
        document.querySelectorAll("#drillColors .sw").forEach(function (x) {
          x.classList.toggle("on", x === b);
        });
      };
    });

    U.set("drillModes", M.MODOS_CAMPO.map(function (mo) {
      return '<button data-v="' + mo.id + '" class="' + (mo.id === "Completo" ? "on" : "") + '">' +
        mo.label + '</button>';
    }).join(""));

    document.querySelectorAll("#drillModes button").forEach(function (b) {
      b.onclick = function () {
        sc.setMode(b.dataset.v);
        document.querySelectorAll("#drillModes button").forEach(function (x) {
          x.classList.toggle("on", x === b);
        });
      };
    });
  }

  /* Barra flotante sobre la pieza seleccionada. */
  function conectarBarraContextual() {
    U.$("ctxRotL").onclick = function () { sc.rotar(-15); };
    U.$("ctxRotR").onclick = function () { sc.rotar(15); };
    U.$("ctxDup").onclick = function () { sc.duplicar(); };
    U.$("ctxDel").onclick = function () { sc.borrar(); };
  }

  function pintarBarraEstado() {
    var b = U.$("drillUndo");
    if (b) b.disabled = !sc.puedeDeshacer();
  }

  /* ---------------------------------------------------------
     Texto sobre la pizarra
     --------------------------------------------------------- */
  function editarTexto(it) {
    window.CB.shell.openSheet("Texto en la pizarra",
      '<label class="f">Texto</label><input id="drillTxt" value="' + U.esc(it.txt || "") + '" placeholder="Zona de presión">',
      [
        {
          text: "Quitar", cls: "ghost", fn: function () {
            window.CB.shell.closeSheet();
            sc.borrar();
          }
        },
        {
          text: "Aceptar", cls: "pri", fn: function () {
            var t = U.val("drillTxt").trim();
            it.txt = t || "Texto";
            window.CB.shell.closeSheet();
            sc.repaintSel();
          }
        }
      ]);
  }

  /* ---------------------------------------------------------
     Guardar y cargar ejercicios
     --------------------------------------------------------- */
  function guardar() {
    var body =
      '<label class="f">Nombre</label><input id="dNom" value="' + U.esc(meta.nombre) + '" placeholder="Salida de balón 4-3-3">' +
      '<label class="f">Categoría</label><select id="dCat">' +
        '<option value="">Sin categoría</option>' +
        M.CATEGORIAS.map(function (c) {
          return '<option ' + (c === meta.categoria ? "selected" : "") + '>' + c + '</option>';
        }).join("") + '</select>' +
      '<div class="grid-2">' +
        '<div><label class="f">Duración (min)</label><input id="dMin" inputmode="numeric" value="' + U.esc(meta.min) + '"></div>' +
        '<div><label class="f">Jugadores</label><input id="dJug" inputmode="numeric" value="' + U.esc(meta.jugadores) + '"></div>' +
      '</div>' +
      '<label class="f">Descripción</label><textarea id="dDesc" placeholder="Objetivo, reglas y variantes">' +
        U.esc(meta.desc) + '</textarea>';

    window.CB.shell.openSheet("Guardar ejercicio", body, [
      { text: "Cancelar", cls: "ghost", fn: window.CB.shell.closeSheet },
      {
        text: "Guardar", cls: "pri", fn: function () {
          var nombre = U.val("dNom").trim();
          if (!nombre) { U.toast("Ponle un nombre"); return; }
          meta = {
            nombre: nombre,
            categoria: U.val("dCat"),
            min: U.val("dMin"),
            jugadores: U.val("dJug"),
            desc: U.val("dDesc")
          };
          var o = {
            id: ejercicioId || U.uid(),
            nombre: meta.nombre, categoria: meta.categoria,
            min: meta.min, jugadores: meta.jugadores, desc: meta.desc,
            modo: sc.getMode(),
            items: JSON.parse(JSON.stringify(sc.getItems()))
          };
          window.DB.ejercicios = window.DB.ejercicios.filter(function (x) { return x.id !== o.id; });
          window.DB.ejercicios.push(o);
          ejercicioId = o.id;
          S.save();
          window.CB.shell.closeSheet();
          render();
          U.toast("Ejercicio guardado");
        }
      }
    ]);
  }

  function nuevo() {
    sc.cargar([], sc.getMode());
    ejercicioId = null;
    meta = { nombre: "Ejercicio sin título", categoria: "", min: "15", jugadores: "", desc: "" };
    render();
    U.toast("Pizarra vacía");
  }

  function cargar(id) {
    var e = window.DB.ejercicios.filter(function (x) { return x.id === id; })[0];
    if (!e) return;
    ejercicioId = e.id;
    meta = {
      nombre: e.nombre, categoria: e.categoria || "",
      min: e.min || "", jugadores: e.jugadores || "", desc: e.desc || ""
    };
    sc.cargar(e.items, e.modo || "Completo");
    document.querySelectorAll("#drillModes button").forEach(function (x) {
      x.classList.toggle("on", x.dataset.v === (e.modo || "Completo"));
    });
    render();
    window.scrollTo(0, 0);
    U.toast("Ejercicio cargado");
  }

  function borrar(id) {
    if (!window.CB.shell.confirmar("¿Eliminar este ejercicio?")) return;
    window.DB.ejercicios = window.DB.ejercicios.filter(function (x) { return x.id !== id; });
    if (ejercicioId === id) ejercicioId = null;
    S.save();
    render();
  }

  function vaciar() {
    if (!sc.getItems().length) return;
    if (!window.CB.shell.confirmar("¿Quitar todas las piezas del campo?")) return;
    sc.vaciar();
  }

  /* ---------------------------------------------------------
     Pintado de la pantalla
     --------------------------------------------------------- */
  function render() {
    var lista = window.DB.ejercicios;
    var h = '<div class="card flat" style="padding:10px 12px">' +
      '<div class="row-x"><div class="pmain">' +
      '<div class="nm">' + U.esc(meta.nombre) + '</div>' +
      '<div class="sub">' +
        (meta.categoria ? U.esc(meta.categoria) + " · " : "") +
        (meta.min ? U.esc(meta.min) + " min" : "sin duración") +
        (meta.jugadores ? " · " + U.esc(meta.jugadores) + " jugadores" : "") +
      '</div></div>' +
      '<button class="btn sm pri" onclick="CB.drills.guardar()">' + U.svg("save") + 'Guardar</button>' +
      '</div></div>';

    h += '<div class="grid-4r mt2">' +
      '<button class="btn sm" id="drillUndo" onclick="CB.drills.undo()">' + U.svg("undo") + 'Deshacer</button>' +
      '<button class="btn sm" onclick="CB.drills.vaciar()">' + U.svg("eraser") + 'Limpiar</button>' +
      '<button class="btn sm" onclick="CB.drills.nuevo()">' + U.svg("plus") + 'Nuevo</button>' +
      '<button class="btn sm" onclick="CB.drills.png()">' + U.svg("download") + 'PNG</button>' +
      '</div>';

    h += '<div class="section"><span class="eyebrow">Mis ejercicios</span>' +
      '<span class="link">' + lista.length + '</span></div>';

    h += lista.length
      ? '<div class="plist">' + lista.slice().reverse().map(function (e) {
          return '<div class="prow">' +
            '<span class="num-badge sm">' + U.svg("drills") + '</span>' +
            '<div class="pmain" onclick="CB.drills.cargar(\'' + e.id + '\')">' +
              '<div class="nm">' + U.esc(e.nombre) + '</div>' +
              '<div class="sub">' +
                (e.categoria ? U.esc(e.categoria) + " · " : "") +
                (e.min ? U.esc(e.min) + " min" : "") +
                (e.jugadores ? " · " + U.esc(e.jugadores) + " jug." : "") +
              '</div></div>' +
            '<button class="btn sm ghost" onclick="CB.drills.borrar(\'' + e.id + '\')">' + U.svg("trash") + '</button>' +
            '</div>';
        }).join("") + '</div>'
      : '<div class="empty">Dibuja un ejercicio y guárdalo: quedará aquí para el resto de la temporada.</div>';

    U.set("drillBody", h);
    pintarBarraEstado();
  }

  function png() {
    var W = 1600, H = 1040;
    var c = document.createElement("canvas");
    c.width = W; c.height = H;
    window.CB.pitch.drawScene(c.getContext("2d"), W, H, sc.getMode(), sc.getItems(), null);
    var nombre = (meta.nombre || "pizarra").replace(/[^\w\s-]/g, "").trim() || "pizarra";
    c.toBlob(function (b) { window.download(nombre + ".png", b); }, "image/png");
    U.toast("Imagen descargada");
  }

  function onEnter() {
    init();
    requestAnimationFrame(function () { sc.fit(); });
    render();
  }

  window.CB.drills = {
    init: init, render: render, onEnter: onEnter,
    guardar: guardar, nuevo: nuevo, cargar: cargar, borrar: borrar,
    vaciar: vaciar, png: png,
    undo: function () { sc.undo(); },
    zoom: function (f) { sc.zoom(f); },
    fit: function () { if (sc) sc.fit(); },
    /* Acceso al motor de escena: lo usan las pruebas y cualquier
       función futura que necesite manipular la pizarra. */
    escena: function () { return sc; }
  };
})();

</script>
<script>
/* ===== js/features/tactics.js ===== */
/* =============================================================
   CoachBoard · features/tactics.js
   Pizarra táctica: once contra once sobre el campo completo.
   ============================================================= */
(function () {
  "use strict";
  var U = window.CB.util;
  var S = window.CB.store;
  var M = window.CB.models;
  var P = window.CB.pitch;

  var canvas = null, g = null;
  var fichas = [];
  var sel = null;
  var arrastre = null;
  var verRival = true;
  var ultimoToque = 0;
  var iniciado = false;

  function dpr() { return Math.min(window.devicePixelRatio || 1, 2); }
  function W() { return canvas.width / dpr(); }
  function H() { return canvas.height / dpr(); }
  function radio() { return Math.max(12, Math.min(22, W() / 32)); }

  function init() {
    if (iniciado) return;
    iniciado = true;
    canvas = U.$("cTac");
    g = canvas.getContext("2d");

    if (window.DB.tac && window.DB.tac.length) {
      fichas = window.DB.tac;
      asegurarBalon();          // las pizarras de antes no lo traían
      guardarEstado();
    } else {
      reiniciar();
      guardarEstado();          // deja el estado inicial ya persistido
    }
    verRival = fichas.some(function (f) { return f.eq === "B" && f.vis; });

    canvas.addEventListener("pointerdown", onDown);
    canvas.addEventListener("pointermove", onMove);
    canvas.addEventListener("pointerup", onUp);
    canvas.addEventListener("pointercancel", onUp);
    canvas.addEventListener("contextmenu", function (e) { e.preventDefault(); });

    construirSelectores();
    fit();
  }

  function reiniciar() {
    fichas = [];
    M.FORMS["4-4-2"].forEach(function (c, i) {
      fichas.push({ id: U.uid(), eq: "A", x: c[0], y: c[1], d: String(i + 1), n: "", vis: true });
    });
    M.FORMS["4-3-3"].forEach(function (c, i) {
      fichas.push({ id: U.uid(), eq: "B", x: 1 - c[0], y: c[1], d: String(i + 1), n: "", vis: true });
    });
    asegurarBalon();
  }

  /* El balón es una ficha más, pero de un equipo que no existe: así
     las formaciones, los nombres del once y el botón de ocultar al
     rival (que filtran por "A" y "B") no lo tocan nunca. */
  function esBalon(f) { return f.eq === "BAL"; }
  function asegurarBalon() {
    if (fichas.some(esBalon)) return;
    fichas.push({ id: U.uid(), eq: "BAL", x: 0.5, y: 0.5, d: "", n: "", vis: true });
  }

  function construirSelectores() {
    var ops = Object.keys(M.FORMS);
    U.set("tacForm1", ops.map(function (f) {
      return '<option ' + (f === "4-4-2" ? "selected" : "") + '>' + f + '</option>';
    }).join(""));
    U.set("tacForm2", ops.map(function (f) {
      return '<option ' + (f === "4-3-3" ? "selected" : "") + '>' + f + '</option>';
    }).join(""));
  }

  function fit() {
    if (!canvas) return;
    var w = canvas.parentElement.clientWidth;
    if (!w) return;
    var apaisado = window.innerWidth > window.innerHeight;
    var h = Math.round(apaisado
      ? Math.min(w * 0.62, Math.max(220, window.innerHeight - 180))
      : w * 0.66);
    var d = dpr();
    canvas.width = w * d;
    canvas.height = h * d;
    canvas.style.height = h + "px";
    g.setTransform(d, 0, 0, d, 0, 0);
    paint();
  }

  function paint() {
    if (!canvas) return;
    var w = W(), h = H(), r = radio();
    g.setTransform(dpr(), 0, 0, dpr(), 0, 0);
    P.drawPitch(g, w, h, "Completo");
    /* El balón se pinta el último para que quede por encima de las
       fichas: si queda debajo parece que ha desaparecido. */
    fichas.forEach(function (f) {
      if (!f.vis || esBalon(f)) return;
      var col = f.eq === "A"
        ? (f.d === "1" ? M.COLS.Amarillo : M.COLS.Azul)
        : (f.d === "1" ? M.COLS.Amarillo : M.COLS.Rojo);
      P.token(g, f.x * w, f.y * h, r, col, f.d, f.n || "", sel === f.id);
    });
    fichas.forEach(function (f) {
      if (!f.vis || !esBalon(f)) return;
      P.ball(g, f.x * w, f.y * h, r * 0.62, sel === f.id);
    });
  }

  function pos(e) {
    var r = canvas.getBoundingClientRect();
    return { x: e.clientX - r.left, y: e.clientY - r.top, W: r.width, H: r.height };
  }

  function onDown(e) {
    canvas.setPointerCapture(e.pointerId);
    var p = pos(e), r = radio();
    var hit = null;
    /* El balón se busca primero: se pinta encima, así que también
       tiene que cogerse antes aunque esté sobre una ficha. */
    for (var b = fichas.length - 1; b >= 0 && !hit; b--) {
      var fb = fichas[b];
      if (esBalon(fb) && fb.vis &&
          Math.hypot(p.x - fb.x * p.W, p.y - fb.y * p.H) < r * 1.3) hit = fb;
    }
    for (var i = fichas.length - 1; i >= 0 && !hit; i--) {
      var f = fichas[i];
      if (f.vis && !esBalon(f) &&
          Math.hypot(p.x - f.x * p.W, p.y - f.y * p.H) < r * 1.6) hit = f;
    }
    var ahora = Date.now();
    if (hit && !esBalon(hit) && ahora - ultimoToque < 330 && sel === hit.id) {
      ultimoToque = 0;
      editarFicha(hit);
      return;
    }
    ultimoToque = ahora;
    sel = hit ? hit.id : null;
    arrastre = hit;
    paint();
  }

  function onMove(e) {
    if (!arrastre) return;
    var p = pos(e);
    arrastre.x = U.clamp(p.x / p.W, .02, .98);
    arrastre.y = U.clamp(p.y / p.H, .03, .97);
    paint();
  }

  function onUp() {
    if (arrastre) {
      arrastre = null;
      guardarEstado();
    }
  }

  function guardarEstado() {
    window.DB.tac = fichas;
    S.save();
  }

  function editarFicha(f) {
    window.CB.shell.openSheet("Ficha",
      '<div class="grid-2">' +
      '<div><label class="f">Dorsal</label><input id="tfD" value="' + U.esc(f.d) + '" inputmode="numeric"></div>' +
      '<div><label class="f">Nombre corto</label><input id="tfN" value="' + U.esc(f.n || "") + '"></div>' +
      '</div>',
      [
        { text: "Cancelar", cls: "ghost", fn: window.CB.shell.closeSheet },
        {
          text: "Aceptar", cls: "pri", fn: function () {
            var d = U.val("tfD").trim();
            if (d) f.d = d;
            f.n = U.val("tfN").trim();
            guardarEstado();
            window.CB.shell.closeSheet();
            paint();
          }
        }
      ]);
  }

  /* ---------------------------------------------------------
     Formaciones
     --------------------------------------------------------- */
  function aplicar(eq) {
    var nombre = U.val(eq === "A" ? "tacForm1" : "tacForm2");
    var c = M.FORMS[nombre] || M.FORMS["4-4-2"];
    fichas.filter(function (f) { return f.eq === eq; }).forEach(function (f, i) {
      if (!c[i]) return;
      f.x = eq === "A" ? c[i][0] : 1 - c[i][0];
      f.y = c[i][1];
    });
    guardarEstado();
    paint();
    U.toast(nombre + " aplicado");
  }

  function nombresPlantilla() {
    var once = [];
    if (window.DB.match && window.DB.match.campo.length) once = window.DB.match.campo;
    else once = window.DB.jugadores.slice()
      .sort(function (a, b) { return (a.dorsal || 99) - (b.dorsal || 99); })
      .slice(0, 11).map(function (j) { return j.id; });
    if (!once.length) { U.toast("No hay plantilla"); return; }
    fichas.filter(function (f) { return f.eq === "A"; }).forEach(function (f, i) {
      var j = S.jug(once[i]);
      if (j) { f.d = String(j.dorsal); f.n = String(j.nombre).split(" ")[0]; }
    });
    guardarEstado();
    paint();
    U.toast("Nombres del once cargados");
  }

  function alternarRival() {
    verRival = !verRival;
    fichas.filter(function (f) { return f.eq === "B"; }).forEach(function (f) { f.vis = verRival; });
    guardarEstado();
    paint();
    render();
  }

  /* ---------------------------------------------------------
     Pizarras guardadas
     --------------------------------------------------------- */
  function guardar() {
    window.CB.shell.openSheet("Guardar pizarra",
      '<label class="f">Nombre</label><input id="tacNom" placeholder="Plan de partido" value="">',
      [
        { text: "Cancelar", cls: "ghost", fn: window.CB.shell.closeSheet },
        {
          text: "Guardar", cls: "pri", fn: function () {
            var nombre = U.val("tacNom").trim();
            if (!nombre) { U.toast("Ponle un nombre"); return; }
            window.DB.tacticas = window.DB.tacticas.filter(function (t) { return t.nombre !== nombre; });
            window.DB.tacticas.push({
              id: U.uid(), nombre: nombre,
              form1: U.val("tacForm1"), form2: U.val("tacForm2"),
              fichas: JSON.parse(JSON.stringify(fichas))
            });
            S.save();
            window.CB.shell.closeSheet();
            render();
            U.toast("Pizarra guardada");
          }
        }
      ]);
  }

  function cargar(id) {
    var t = window.DB.tacticas.filter(function (x) { return x.id === id; })[0];
    if (!t) return;
    fichas = JSON.parse(JSON.stringify(t.fichas));
    asegurarBalon();            // pizarras guardadas antes del balón
    sel = null;
    verRival = fichas.some(function (f) { return f.eq === "B" && f.vis; });
    if (t.form1) U.$("tacForm1").value = t.form1;
    if (t.form2) U.$("tacForm2").value = t.form2;
    guardarEstado();
    paint();
    render();
    window.scrollTo(0, 0);
    U.toast("Pizarra cargada");
  }

  function borrar(id) {
    if (!window.CB.shell.confirmar("¿Eliminar esta pizarra?")) return;
    window.DB.tacticas = window.DB.tacticas.filter(function (x) { return x.id !== id; });
    S.save();
    render();
  }

  function png() {
    var W2 = 1600, H2 = 1040;
    var c = document.createElement("canvas");
    c.width = W2; c.height = H2;
    var gg = c.getContext("2d");
    P.drawPitch(gg, W2, H2, "Completo");
    fichas.forEach(function (f) {
      if (!f.vis) return;
      var col = f.eq === "A"
        ? (f.d === "1" ? M.COLS.Amarillo : M.COLS.Azul)
        : (f.d === "1" ? M.COLS.Amarillo : M.COLS.Rojo);
      P.token(gg, f.x * W2, f.y * H2, 28, col, f.d, f.n || "", false);
    });
    c.toBlob(function (b) { window.download("tactica.png", b); }, "image/png");
    U.toast("Imagen descargada");
  }

  function render() {
    var h = '<div class="grid-3">' +
      '<button class="btn sm" onclick="CB.tactics.nombres()">' + U.svg("squad") + 'Nombres</button>' +
      '<button class="btn sm" onclick="CB.tactics.rival()">' + U.svg(verRival ? "x" : "check") +
        (verRival ? "Sin rival" : "Con rival") + '</button>' +
      '<button class="btn sm" onclick="CB.tactics.png()">' + U.svg("download") + 'PNG</button>' +
      '</div>';

    h += '<button class="btn sm pri wide mt1" onclick="CB.tactics.guardar()">' +
      U.svg("save") + 'Guardar pizarra</button>';

    h += '<div class="section"><span class="eyebrow">Pizarras guardadas</span>' +
      '<span class="link">' + window.DB.tacticas.length + '</span></div>';

    h += window.DB.tacticas.length
      ? '<div class="plist">' + window.DB.tacticas.slice().reverse().map(function (t) {
          return '<div class="prow">' +
            '<span class="num-badge sm">' + U.svg("tactics") + '</span>' +
            '<div class="pmain" onclick="CB.tactics.cargar(\'' + t.id + '\')">' +
            '<div class="nm">' + U.esc(t.nombre) + '</div>' +
            '<div class="sub">' + U.esc(t.form1 || "") + (t.form2 ? " vs " + U.esc(t.form2) : "") + '</div></div>' +
            '<button class="btn sm ghost" onclick="CB.tactics.borrar(\'' + t.id + '\')">' + U.svg("trash") + '</button>' +
            '</div>';
        }).join("") + '</div>'
      : '<div class="empty">Coloca a los tuyos y guarda el plan para el próximo rival.</div>';

    U.set("tacBody", h);
  }

  function onEnter() {
    init();
    requestAnimationFrame(fit);
    render();
  }

  window.CB.tactics = {
    init: init, onEnter: onEnter, render: render, fit: fit,
    aplicar: aplicar, nombres: nombresPlantilla, rival: alternarRival,
    guardar: guardar, cargar: cargar, borrar: borrar, png: png
  };
})();

</script>
<script>
/* ===== js/features/reports.js ===== */
/* =============================================================
   CoachBoard · features/reports.js
   Documentos imprimibles: acta del partido y ficha del jugador.
   La maqueta es A4; el sistema los convierte en PDF.
   ============================================================= */
(function () {
  "use strict";
  var U = window.CB.util;
  var S = window.CB.store;
  var M = window.CB.models;

  function nombreEnActa(a, id) {
    var f = (a.jug || []).filter(function (x) { return x.j === id; })[0];
    if (f) return f.dorsal + " " + f.nombre;
    var j = S.jug(id);
    return j ? (j.dorsal + " " + j.nombre) : "-";
  }

  /* ---------------------------------------------------------
     Acta del partido
     --------------------------------------------------------- */
  /* La tanda no altera el resultado: se escribe al lado, entre paréntesis. */
  function penTexto(a, local) {
    if (!a.pen || !a.pen.tiros || !a.pen.tiros.length) return "";
    var pi = local ? a.pen.a : a.pen.b;
    var pd = local ? a.pen.b : a.pen.a;
    return ' <span style="font-size:11pt;font-weight:600">(' + pi + " &ndash; " + pd +
      " en penaltis)</span>";
  }

  function tandaHtml(a, club, rival) {
    if (!a.pen || !a.pen.tiros || !a.pen.tiros.length) return "";
    var filas = a.pen.tiros.map(function (t, i) {
      return '<tr><td class="n">' + (i + 1) + "</td>" +
        "<td>" + (t.eq === "a" ? U.esc(club) : U.esc(rival)) + "</td>" +
        "<td>" + (t.eq === "a" && t.j ? U.esc(nombreEnActa(a, t.j)) : "&mdash;") + "</td>" +
        "<td>" + (t.ok ? "Marcado" : "Fallado") + "</td></tr>";
    }).join("");
    return "<h4>Tanda de penaltis &middot; " + a.pen.a + " &ndash; " + a.pen.b + "</h4>" +
      '<table><thead><tr><th class="n">Nº</th><th>Equipo</th><th>Lanzador</th>' +
      "<th>Resultado</th></tr></thead><tbody>" + filas + "</tbody></table>";
  }

  function actaHtml(a) {
    var e = S.ev(a.ev) || {};
    var club = S.club();
    var rival = a.rival || "Rival";
    var local = e.cond !== "Visitante";
    var izq = local ? club : rival, der = local ? rival : club;
    var mIzq = local ? a.gf : a.gc, mDer = local ? a.gc : a.gf;

    var cab = [e.comp || e.tipo || "Partido", a.fecha ? U.fmtDate(a.fecha) : "", e.hora || "", e.lugar || "",
               e.cond ? "condición: " + e.cond.toLowerCase() : "",
               a.dur ? M.durTexto(a.dur) : ""]
      .filter(Boolean).join(" &middot; ");

    var goles = (a.goles || []).slice().sort(function (x, y) { return x.min - y.min; });
    var filasGol = goles.length
      ? goles.map(function (g) {
          return '<tr><td class="n">' + g.min + "'</td>" +
            "<td>" + (g.eq === "A" ? U.esc(club) : U.esc(rival)) + "</td>" +
            "<td>" + (g.j ? U.esc(nombreEnActa(a, g.j)) : "&mdash;") + "</td>" +
            "<td>" + U.esc(g.tipo || "Jugada") + "</td>" +
            "<td>" + (g.a ? U.esc(nombreEnActa(a, g.a)) : "&mdash;") + "</td></tr>";
        }).join("")
      : '<tr><td colspan="5">Sin goles anotados con detalle. Resultado: ' + a.gf + " - " + a.gc + '.</td></tr>';

    var penaltis = function (id) {
      return goles.filter(function (g) { return g.j === id && g.tipo === "Penalti"; }).length;
    };
    var tit = a.titulares || [];
    var jj = a.jug.slice().sort(function (x, y) {
      return (tit.indexOf(y.j) >= 0 ? 1 : 0) - (tit.indexOf(x.j) >= 0 ? 1 : 0) || y.min - x.min;
    });
    var filasJug = jj.map(function (f) {
      var p = penaltis(f.j);
      return '<tr class="' + (tit.indexOf(f.j) >= 0 ? "start" : "") + '">' +
        '<td class="n">' + (f.dorsal || "") + "</td>" +
        "<td>" + U.esc(f.nombre || "") + "</td>" +
        "<td>" + U.esc(f.pos || (S.jug(f.j) || {}).pos || "") + "</td>" +
        "<td>" + (tit.indexOf(f.j) >= 0 ? "Titular" : "Suplente") + "</td>" +
        '<td class="n">' + f.min + "'</td>" +
        '<td class="n">' + (f.gol || 0) + (p ? " (" + p + " p.)" : "") + "</td>" +
        '<td class="n">' + (f.asi || 0) + "</td>" +
        '<td class="n">' + (f.fal || 0) + "</td>" +
        '<td class="n">' + (f.ta || 0) + "</td>" +
        '<td class="n">' + (f.tr ? "Sí" : "") + "</td>" +
        "<td>" + U.esc(f.st || "") + "</td></tr>";
    }).join("");

    var disc = a.jug.filter(function (f) { return f.ta || f.tr; });
    var filasDisc = disc.length
      ? disc.map(function (f) {
          return '<tr><td class="n">' + (f.dorsal || "") + "</td><td>" + U.esc(f.nombre) + "</td>" +
            "<td>" + (f.ta ? f.ta + " amarilla" + (f.ta > 1 ? "s" : "") : "&mdash;") + "</td>" +
            "<td>" + (f.tr ? "Expulsado" : "&mdash;") + "</td></tr>";
        }).join("")
      : '<tr><td colspan="4">Sin amonestaciones.</td></tr>';

    var totMin = a.jug.reduce(function (s, f) { return s + (f.min || 0); }, 0);
    var cron = a.log.slice().reverse().map(function (l) {
      return "<div><b>" + l.m + "'</b> &nbsp;" + U.esc(l.t) +
        (l.sub ? " &mdash; " + U.esc(l.sub) : "") + "</div>";
    }).join("");

    return '<div class="acta">' +
      '<div class="ah"><div class="ah-t">ACTA DE PARTIDO</div><div class="ah-s">' + cab + "</div></div>" +
      '<div class="ares"><div class="tm r">' + U.esc(izq) + "</div>" +
        '<div class="sc">' + mIzq + " &ndash; " + mDer + penTexto(a, local) + "</div>" +
        '<div class="tm">' + U.esc(der) + "</div></div>" +

      "<h4>Goles</h4>" +
      '<table><thead><tr><th class="n">Min</th><th>Equipo</th><th>Goleador</th><th>Tipo</th>' +
      "<th>Asistencia</th></tr></thead><tbody>" + filasGol + "</tbody></table>" +

      tandaHtml(a, club, rival) +

      "<h4>Participación</h4>" +
      '<table><thead><tr><th class="n">Dor</th><th>Jugador</th><th>Pos</th><th>Rol</th>' +
      '<th class="n">Min</th><th class="n">G</th><th class="n">A</th><th class="n">F</th>' +
      '<th class="n">TA</th><th class="n">TR</th><th>Situación final</th></tr></thead>' +
      "<tbody>" + filasJug + "</tbody></table>" +
      '<p style="font-size:8pt;color:#555;margin:5px 0 0">Convocados: ' + a.jug.length +
        " &middot; titulares: " + tit.length + " &middot; minutos repartidos: " + totMin +
        " &middot; los penaltis se indican entre paréntesis en la columna de goles.</p>" +

      "<h4>Disciplina</h4>" +
      '<table><thead><tr><th class="n">Dor</th><th>Jugador</th><th>Amonestaciones</th>' +
      "<th>Expulsión</th></tr></thead><tbody>" + filasDisc + "</tbody></table>" +

      "<h4>Crónica</h4>" +
      '<div class="chron">' + (cron || "<div>Sin incidencias registradas.</div>") + "</div>" +

      '<div class="sig"><div>Firma del entrenador</div><div>Firma del delegado</div></div>' +
      '<div class="foot"><span>' + U.esc(club) + " &middot; acta generada el " +
        new Date().toLocaleDateString("es-ES") + "</span><span>CoachBoard</span></div></div>";
  }

  function actaPdf(a) {
    if (!a) { U.toast("No hay acta"); return; }
    window.CB.shell.closeSheet();
    U.printDoc("Acta " + (a.fecha || "") + " " + (a.rival || ""), actaHtml(a));
  }
  function actaPdfPorId(id) {
    actaPdf(window.DB.partidos.filter(function (p) { return p.id === id; })[0]);
  }

  function actaTxt(a) {
    if (!a) return;
    var club = S.club();
    var txt = "ACTA DEL PARTIDO\r\nFecha: " + a.fecha + "   Rival: " + a.rival +
      "\r\nResultado: " + a.gf + " - " + a.gc +
      (a.pen && a.pen.tiros && a.pen.tiros.length
        ? "  (" + a.pen.a + " - " + a.pen.b + " en la tanda de penaltis)" : "") +
      "\r\n\r\nGOLES\r\n";
    (a.goles || []).forEach(function (g) {
      txt += String(g.min).padStart(3) + "'  " +
        (g.eq === "A" ? club : "rival") + "  " +
        (g.j ? nombreEnActa(a, g.j) : "-") + "  (" + g.tipo + ")" +
        (g.a ? "  asist. " + nombreEnActa(a, g.a) : "") + "\r\n";
    });
    if (a.pen && a.pen.tiros && a.pen.tiros.length) {
      txt += "\r\nTANDA DE PENALTIS  " + a.pen.a + " - " + a.pen.b + "\r\n";
      a.pen.tiros.forEach(function (t, i) {
        txt += String(i + 1).padStart(3) + "  " +
          (t.eq === "a" ? club : "rival").padEnd(20) +
          (t.eq === "a" && t.j ? nombreEnActa(a, t.j) : "-").padEnd(24) +
          (t.ok ? "marcado" : "fallado") + "\r\n";
      });
    }
    txt += "\r\nMINUTOS POR JUGADOR\r\n";
    a.jug.slice().sort(function (x, y) { return y.min - x.min; }).forEach(function (f) {
      txt += String(f.dorsal).padStart(3) + "  " + String(f.nombre).padEnd(24) +
        String(f.min + "'").padStart(5) + "   goles:" + f.gol + "  asist:" + f.asi +
        "  faltas:" + (f.fal || 0) + "  TA:" + f.ta + "  TR:" + f.tr + "   " + f.st + "\r\n";
    });
    txt += "\r\nCRONICA\r\n";
    a.log.slice().reverse().forEach(function (l) {
      txt += String(l.m).padStart(3) + "'  " + l.t + (l.sub ? " - " + l.sub : "") + "\r\n";
    });
    window.download("acta_" + a.fecha + "_" + String(a.rival || "partido").replace(/[^\w-]/g, "_") + ".txt",
      new Blob([txt], { type: "text/plain;charset=utf-8" }));
    U.toast("Acta en texto descargada");
    window.CB.shell.closeSheet();
  }
  function actaTxtPorId(id) {
    actaTxt(window.DB.partidos.filter(function (p) { return p.id === id; })[0]);
  }

  /* ---------------------------------------------------------
     Ficha del jugador
     --------------------------------------------------------- */
  function fichaHtml(id) {
    var s = window.CB.stats.player(id), j = s.j;
    var club = S.club();
    var edad = (function () {
      if (!j.fechaNac) return "";
      var d = new Date(j.fechaNac);
      return isNaN(d) ? "" : Math.floor((Date.now() - d) / 31557600000) + " años";
    })();
    var cab = [U.esc(M.POS_LARGO[j.pos] || j.pos || ""), U.esc(j.pie || ""), edad, U.esc(j.estado || "")]
      .filter(Boolean).join(" &middot; ");

    var fila = function (l, v) { return "<tr><td>" + l + '</td><td class="n">' + v + "</td></tr>"; };

    var tipos = window.CB.stats.tiposOrdenados(s.tipos).map(function (t) {
      return "<tr><td>" + U.esc(t) + '</td><td class="n">' + s.tipos[t] + "</td>" +
        '<td class="n">' + Math.round(100 * s.tipos[t] / s.g) + "%</td></tr>";
    }).join("") || '<tr><td colspan="3">Sin goles registrados.</td></tr>';

    var part = s.partidos.map(function (p) {
      return "<tr><td>" + (p.fecha || "") + "</td><td>" + U.esc(p.rival || "") + "</td>" +
        "<td>" + p.res + "</td><td>" + p.rol + "</td>" +
        '<td class="n">' + p.min + "'</td><td class=\"n\">" + p.gol + "</td>" +
        '<td class="n">' + p.asi + '</td><td class="n">' + p.fal + "</td>" +
        '<td class="n">' + p.ta + '</td><td class="n">' + (p.tr ? "Sí" : "") + "</td></tr>";
    }).join("") || '<tr><td colspan="10">Sin partidos con acta cerrada.</td></tr>';

    return '<div class="acta">' +
      '<div class="ah"><div class="ah-t">FICHA DE JUGADOR</div>' +
      '<div class="ah-s">' + U.esc(club) + " &middot; temporada en curso &middot; " +
        new Date().toLocaleDateString("es-ES") + "</div></div>" +
      '<div class="ares"><div class="tm r">' + U.esc(j.nombre) + "</div>" +
        '<div class="sc">' + (j.dorsal || "-") + "</div>" +
        '<div class="tm">' + cab + "</div></div>" +

      "<h4>Resumen de la temporada</h4><table><tbody>" +
        fila("Convocatorias", s.conv) +
        fila("Partidos jugados", s.pj) +
        fila("Como titular", s.tit) +
        fila("Minutos totales", s.min + "'") +
        fila("Media por partido", s.media + "'") +
        fila("Goles", s.g) +
        fila("Asistencias", s.a) +
        fila("Marca un gol cada", s.minGol ? s.minGol + " minutos" : "&mdash;") +
        fila("Da una asistencia cada", s.minAsi ? s.minAsi + " minutos" : "&mdash;") +
        fila("Participa en gol cada", s.minPart ? s.minPart + " minutos" : "&mdash;") +
        fila("Faltas cometidas", s.fal + " (" + s.falPart + " por partido)") +
        fila("Comete una falta cada", s.minFal ? s.minFal + " minutos" : "&mdash;") +
        fila("Tarjetas amarillas", s.ta) +
        fila("Expulsiones", s.tr) +
        fila("Asistencia a entrenamientos",
          s.att ? s.att.pct + "% (" + s.att.p + " de " + s.att.t + ")" : "&mdash;") +
      "</tbody></table>" +

      "<h4>De dónde vienen sus goles</h4>" +
      '<table><thead><tr><th>Origen</th><th class="n">Goles</th><th class="n">Peso</th></tr></thead>' +
      "<tbody>" + tipos + "</tbody></table>" +
      (s.favorito ? '<p style="font-size:8pt;color:#555;margin:5px 0 0">La mayoría de sus goles llegan de esta forma: ' +
        U.esc(s.favorito.toLowerCase()) + ".</p>" : "") +

      "<h4>Partido a partido</h4>" +
      '<table><thead><tr><th>Fecha</th><th>Rival</th><th>Res.</th><th>Rol</th>' +
      '<th class="n">Min</th><th class="n">G</th><th class="n">A</th><th class="n">Faltas</th>' +
      '<th class="n">TA</th><th class="n">TR</th></tr></thead><tbody>' + part + "</tbody></table>" +

      '<div class="foot"><span>' + U.esc(club) + " &middot; ficha generada el " +
        new Date().toLocaleDateString("es-ES") + "</span><span>CoachBoard</span></div></div>";
  }

  function fichaPdf(id) {
    window.CB.shell.closeSheet();
    var j = S.jug(id) || {};
    U.printDoc("Ficha " + (j.nombre || "jugador"), fichaHtml(id));
  }

  window.CB.reports = {
    actaHtml: actaHtml, actaPdf: actaPdf, actaPdfPorId: actaPdfPorId,
    actaTxt: actaTxt, actaTxtPorId: actaTxtPorId,
    fichaHtml: fichaHtml, fichaPdf: fichaPdf
  };
})();

</script>
<script>
/* ===== js/features/settings.js ===== */
/* =============================================================
   CoachBoard · features/settings.js
   Ajustes del equipo, copias de seguridad y ayuda.
   ============================================================= */
(function () {
  "use strict";
  var U = window.CB.util;
  var S = window.CB.store;

  function open() {
    var body =
      '<label class="f">Nombre del equipo</label>' +
      '<input id="cfgClub" value="' + U.esc(window.DB.club || "") + '" placeholder="UD Ejemplo">' +
      '<p class="hint">Aparece en la cabecera, en el marcador y en los documentos PDF.</p>' +
      '<button class="btn pri wide mt1" onclick="CB.settings.guardarClub()">Guardar nombre</button>' +

      '<div class="section"><span class="eyebrow">Datos</span></div>' +
      '<p class="hint">Todo se guarda en este dispositivo. Descarga una copia de vez en cuando y guárdala donde quieras.</p>' +
      '<button class="btn wide" onclick="CB.store.backup()">' + U.svg("download") + 'Descargar copia de seguridad</button>' +
      '<button class="btn wide mt1" onclick="document.getElementById(\'cfgImp\').click()">' +
        U.svg("upload") + 'Restaurar copia</button>' +
      '<input type="file" id="cfgImp" accept=".json,application/json" hidden onchange="CB.store.restore(this)">' +
      '<button class="btn wide mt1" onclick="CB.settings.ejemplo()">' + U.svg("users2") + 'Cargar plantilla de ejemplo</button>' +

      '<div class="section"><span class="eyebrow">Ayuda</span></div>' +
      '<button class="btn wide" onclick="CB.settings.guia()">' + U.svg("note") + 'Guía rápida</button>';

    window.CB.shell.openSheet("Ajustes", body, [
      { text: "Cerrar", cls: "ghost", fn: window.CB.shell.closeSheet }
    ]);
  }

  function guardarClub() {
    window.DB.club = U.val("cfgClub").trim();
    S.save();
    U.txt("topSub", S.club());
    window.CB.app.renderAll();
    U.toast("Equipo guardado");
  }

  function ejemplo() {
    window.CB.shell.closeSheet();
    window.CB.squad.demo();
  }

  function guia() {
    var body =
      '<div class="dl"><span>Inicio</span><b>Qué viene ahora</b></div>' +
      '<p class="hint">Próximo partido, asistencia media y la siguiente sesión. Desde aquí se prepara el partido de un toque.</p>' +

      '<div class="dl"><span>Partido</span><b>Acción y jugador</b></div>' +
      '<p class="hint">Convoca, coloca el once y arranca el reloj: los minutos de los que están en el campo suben solos. ' +
      'Pulsa primero la acción (gol, cambio, tarjeta) y después elige al jugador. En el gol te pregunta el tipo ' +
      'y, si fue de jugada o de córner, quién dio la asistencia.</p>' +

      '<div class="dl"><span>Asistencia</span><b>Un toque por jugador</b></div>' +
      '<p class="hint">Cada toque recorre presente, ausente, justificado y pendiente. Se guarda al instante.</p>' +

      '<div class="dl"><span>Pizarra</span><b>Colocar y girar</b></div>' +
      '<p class="hint">Elige una pieza en la barra y toca el campo. Con <b>Mover</b> seleccionas: aparece una barra ' +
      'flotante para girar 15°, duplicar o borrar, y un tirador amarillo encima de la pieza para girarla libremente. ' +
      'Girar nunca desplaza la pieza. Con dos dedos se acerca y se desplaza el campo.</p>' +

      '<div class="dl"><span>Tácticas</span><b>22 fichas</b></div>' +
      '<p class="hint">Arrastra a los jugadores y aplica formaciones a cada equipo. Doble toque en una ficha para ' +
      'cambiar dorsal y nombre.</p>' +

      '<div class="dl"><span>Documentos</span><b>Acta y ficha en PDF</b></div>' +
      '<p class="hint">Al cerrar un acta puedes generarla en PDF, y cada jugador tiene su ficha con estadísticas. ' +
      'Elige "Guardar como PDF" en el diálogo de impresión.</p>';

    window.CB.shell.openSheet("Guía rápida", body, [
      { text: "Entendido", cls: "pri", fn: window.CB.shell.closeSheet }
    ]);
  }

  window.CB.settings = { open: open, guardarClub: guardarClub, ejemplo: ejemplo, guia: guia };
})();

</script>
<script>
/* ===== js/app.js ===== */
/* =============================================================
   CoachBoard · app.js
   Arranque y conexión entre pantallas.
   ============================================================= */
(function () {
  "use strict";
  var U = window.CB.util;
  var S = window.CB.store;

  function renderAll() {
    window.CB.dashboard.render();
    window.CB.squad.render();
    window.CB.agenda.render();
    window.CB.attendance.render();
    window.CB.match.render();
    window.CB.drills.render();
    window.CB.tactics.render();
  }

  function ajustarLienzos() {
    if (window.CB.drills.fit) window.CB.drills.fit();
    if (window.CB.tactics.fit) window.CB.tactics.fit();
  }

  function boot() {
    S.load();

    window.CB.shell.init();
    U.txt("topSub", S.club());

    /* Cada pantalla se refresca al entrar: así nunca se ve
       información vieja aunque se haya editado en otro sitio. */
    window.CB.shell.onEnter("home", function () { window.CB.dashboard.render(); });
    window.CB.shell.onEnter("squad", function () { window.CB.squad.render(); });
    window.CB.shell.onEnter("agenda", function () { window.CB.agenda.render(); });
    window.CB.shell.onEnter("att", function () { window.CB.attendance.render(); });
    window.CB.shell.onEnter("match", function () { window.CB.match.render(); });
    window.CB.shell.onEnter("board", function () { window.CB.drills.onEnter(); });
    window.CB.shell.onEnter("tac", function () { window.CB.tactics.onEnter(); });

    window.CB.drills.init();
    window.CB.tactics.init();
    renderAll();
    ajustarLienzos();

    /* El reloj nunca se reanuda solo: el entrenador decide. */
    if (window.DB.match) window.DB.match.run = false;
  }

  window.addEventListener("resize", function () {
    clearTimeout(window._cbrz);
    window._cbrz = setTimeout(ajustarLienzos, 150);
  });
  window.addEventListener("orientationchange", function () {
    setTimeout(ajustarLienzos, 320);
  });
  document.addEventListener("visibilitychange", function () {
    if (document.hidden) S.save();
  });
  window.addEventListener("beforeunload", function () { S.save(); });

  window.CB.app = { boot: boot, renderAll: renderAll, ajustarLienzos: ajustarLienzos };

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", boot);
  } else {
    boot();
  }
})();

</script>
</body>
</html>
