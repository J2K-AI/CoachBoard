<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0F1115">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>CoachBoard</title>
<!-- Archivo único generado desde el proyecto Android.
     Para que se guarden los datos, ábrelo con CoachBoard.ps1
     (Chrome y Edge no permiten almacenamiento en file://). -->

<style>
/* ===== css/tokens.css ===== */
/* =============================================================
   CoachBoard · tokens
   Un único sitio donde vive la identidad visual.
   ============================================================= */
:root{
  /* --- superficies --- */
  --bg:#0F1115;
  --surface:#171A21;
  --surface-2:#1E222B;
  --surface-3:#262B36;
  --line:#272C36;
  --line-soft:#20242D;

  /* --- texto --- */
  --text:#F5F7FA;
  --text-dim:#9299A6;
  --text-faint:#6B727F;

  /* --- identidad --- */
  --accent:#32D583;
  --accent-ink:#06301C;
  --accent-soft:rgba(50,213,131,.12);
  --accent-line:rgba(50,213,131,.28);

  --warn:#F5B942;
  --warn-soft:rgba(245,185,66,.14);
  --danger:#EF4444;
  --danger-soft:rgba(239,68,68,.14);
  --info:#4C8DFF;
  --info-soft:rgba(76,141,255,.14);

  /* --- césped (solo dentro del campo) --- */
  --turf:#17452C;
  --turf-2:#1A4F32;
  --chalk:#E8F0EA;

  /* --- tipografía --- */
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,"Roboto Mono",monospace;

  /* --- espaciado (8 · 12 · 16 · 24) --- */
  --s1:8px;
  --s2:12px;
  --s3:16px;
  --s4:24px;
  --s5:32px;

  /* --- radios --- */
  --r-card:14px;
  --r-btn:12px;
  --r-sm:10px;
  --r-pill:999px;

  /* --- elevación --- */
  --shadow-1:0 1px 2px rgba(0,0,0,.28);
  --shadow-2:0 6px 20px rgba(0,0,0,.34);
  --shadow-3:0 16px 44px rgba(0,0,0,.46);

  /* --- movimiento --- */
  --t-fast:120ms;
  --t-med:200ms;
  --t-slow:320ms;
  --ease:cubic-bezier(.32,.72,0,1);

  /* --- zonas seguras --- */
  --safe-t:env(safe-area-inset-top,0px);
  --safe-b:env(safe-area-inset-bottom,0px);
  --nav-h:60px;
}

@media (prefers-reduced-motion: reduce){
  :root{ --t-fast:1ms; --t-med:1ms; --t-slow:1ms; }
  *,*::before,*::after{ animation-duration:1ms !important; transition-duration:1ms !important; }
}

/* ===== css/base.css ===== */
/* =============================================================
   CoachBoard · base
   Reset, tipografía y armazón de la aplicación.
   ============================================================= */
*{ box-sizing:border-box; -webkit-tap-highlight-color:transparent; }

html,body{ height:100%; margin:0; padding:0; }

body{
  background:var(--bg);
  color:var(--text);
  font-family:var(--sans);
  font-size:15px;
  line-height:1.45;
  -webkit-font-smoothing:antialiased;
  overscroll-behavior-y:none;
}

button,input,select,textarea{ font-family:inherit; font-size:inherit; color:inherit; }
button{ cursor:pointer; border:0; background:none; padding:0; }

/* Números siempre tabulares: es una herramienta de datos, no un blog. */
.num,.stat,.clock,.score{ font-family:var(--mono); font-variant-numeric:tabular-nums; }

/* Micro-etiqueta con tracking: la firma tipográfica de CoachBoard. */
.eyebrow{
  font-size:10.5px;
  font-weight:700;
  letter-spacing:.16em;
  text-transform:uppercase;
  color:var(--text-dim);
}

h1,h2,h3,h4{ margin:0; font-weight:650; }
p{ margin:0 0 var(--s2); }

/* ------------------------------------------------------------
   Armazón
   ------------------------------------------------------------ */
/* Contenedor en bloque a propósito: dentro de un flex, el `margin:0 auto`
   de <main> lo dimensionaría por su contenido y la página se ensancharía. */
#app{ min-height:100%; }

#topbar{
  position:sticky; top:0; z-index:40;
  display:flex; align-items:center; gap:var(--s2);
  padding:calc(var(--safe-t) + 12px) var(--s3) 12px;
  background:rgba(15,17,21,.86);
  backdrop-filter:blur(14px);
  -webkit-backdrop-filter:blur(14px);
  border-bottom:1px solid var(--line-soft);
}
#topbar .brandmark{
  width:26px; height:26px; flex:none; border-radius:8px;
  background:var(--accent-soft);
  border:1px solid var(--accent-line);
  display:grid; place-items:center;
}
#topbar .brandmark svg{ width:15px; height:15px; stroke:var(--accent); fill:none; stroke-width:1.9; }
#topbar .titles{ min-width:0; flex:1; }
#topbar .t1{
  display:block;
  font-size:15px; font-weight:700; letter-spacing:.01em; line-height:1.2;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
#topbar .t2{
  display:block;
  font-size:11.5px; color:var(--text-dim); line-height:1.2; margin-top:1px;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
#topbar .act{
  width:38px; height:38px; flex:none; border-radius:var(--r-sm);
  display:grid; place-items:center; color:var(--text-dim);
  transition:background var(--t-fast) var(--ease), color var(--t-fast) var(--ease);
}
#topbar .act svg{ width:19px; height:19px; stroke:currentColor; fill:none; stroke-width:1.8;
  stroke-linecap:round; stroke-linejoin:round; }
#topbar .act:active{ background:var(--surface-2); color:var(--text); }

main{
  display:block;
  min-width:0;                /* nunca se ensancha por su contenido */
  max-width:860px;
  margin:0 auto;
  padding:var(--s3) var(--s3) calc(var(--nav-h) + var(--safe-b) + var(--s4));
  overflow-x:hidden;          /* ningún hijo puede ensanchar la página */
}

.view{ display:none; }
/* Solo opacidad: un `transform` aquí convertiría la sección en bloque
   contenedor y el botón flotante dejaría de anclarse a la pantalla. */
.view.on{ display:block; animation:viewIn var(--t-med) var(--ease) both; }
@keyframes viewIn{
  from{ opacity:0; }
  to{ opacity:1; }
}

/* Las cards entran escalonadas, muy poco: solo da sensación de orden. */
.stagger > *{ animation:cardIn var(--t-med) var(--ease) both; }
.stagger > *:nth-child(1){ animation-delay:0ms; }
.stagger > *:nth-child(2){ animation-delay:26ms; }
.stagger > *:nth-child(3){ animation-delay:52ms; }
.stagger > *:nth-child(4){ animation-delay:78ms; }
.stagger > *:nth-child(5){ animation-delay:104ms; }
.stagger > *:nth-child(n+6){ animation-delay:130ms; }
@keyframes cardIn{
  from{ opacity:0; transform:translateY(8px); }
  to{ opacity:1; transform:none; }
}

/* ------------------------------------------------------------
   Secciones
   ------------------------------------------------------------ */
.section{ margin:var(--s4) 0 var(--s2); display:flex; align-items:baseline; gap:var(--s2); }
.section:first-child{ margin-top:0; }
.section .eyebrow{ flex:1; }
.section .link{ font-size:12.5px; font-weight:650; color:var(--accent); }

.hint{ font-size:12.5px; color:var(--text-dim); margin:var(--s1) 0; }

.empty{
  border:1px dashed var(--line);
  border-radius:var(--r-card);
  padding:var(--s4) var(--s3);
  text-align:center;
  color:var(--text-dim);
  font-size:13.5px;
}
.empty b{ display:block; color:var(--text); font-size:14.5px; margin-bottom:4px; }

/* ------------------------------------------------------------
   Utilidades de disposición
   ------------------------------------------------------------ */
.row-x{ display:flex; align-items:center; gap:var(--s1); }
.grid-2{ display:grid; grid-template-columns:1fr 1fr; gap:var(--s1); }
.grid-3{ display:grid; grid-template-columns:repeat(3,1fr); gap:var(--s1); }
.grid-4{ display:grid; grid-template-columns:repeat(4,1fr); gap:var(--s1); }
/* En el teléfono cuatro columnas aprietan demasiado: se parten en dos filas. */
.grid-4r{ display:grid; grid-template-columns:repeat(2,1fr); gap:var(--s1); }
@media (min-width:560px){ .grid-4r{ grid-template-columns:repeat(4,1fr); } }
/* Las celdas pueden encogerse: si no, empujan el ancho de la página. */
.grid-2 > *, .grid-3 > *, .grid-4 > *, .grid-4r > *{ min-width:0; }
.spacer{ flex:1; }
.mt1{ margin-top:var(--s1); } .mt2{ margin-top:var(--s2); }
.mt3{ margin-top:var(--s3); } .mt4{ margin-top:var(--s4); }
.mb2{ margin-bottom:var(--s2); }

/* ------------------------------------------------------------
   Tablet y horizontal: barra lateral en vez de inferior
   ------------------------------------------------------------ */
@media (min-width:820px){
  :root{ --nav-h:0px; }
  #topbar{
    position:fixed; left:88px; right:0; top:0;
    padding-left:var(--s4); padding-right:var(--s4);
  }
  main{
    margin-left:88px;
    margin-right:0;
    padding-top:calc(var(--safe-t) + 74px);
    padding-bottom:var(--s5);
    max-width:none;
    padding-left:var(--s4); padding-right:var(--s4);
  }
  main > .viewwrap{ max-width:1080px; margin:0 auto; }
}

/* ===== css/components.css ===== */
/* =============================================================
   CoachBoard · componentes reutilizables
   ============================================================= */

/* ------------------------------------------------------------
   Card
   ------------------------------------------------------------ */
.card{
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:var(--r-card);
  padding:var(--s3);
}
.card + .card{ margin-top:var(--s1); }
.card.flat{ background:var(--surface-2); border-color:transparent; }
.card.tap{ transition:transform var(--t-fast) var(--ease), background var(--t-fast) var(--ease); }
.card.tap:active{ transform:scale(.985); background:var(--surface-2); }

/* Card destacada: una hairline de acento a la izquierda, nada más. */
.card.lead{ position:relative; overflow:hidden; }
.card.lead::before{
  content:""; position:absolute; left:0; top:0; bottom:0; width:3px;
  background:var(--accent);
}

/* ------------------------------------------------------------
   Botones
   ------------------------------------------------------------ */
.btn{
  display:inline-flex; align-items:center; justify-content:center; gap:var(--s1);
  min-height:44px; padding:0 var(--s3);
  border-radius:var(--r-btn);
  background:var(--surface-2);
  color:var(--text);
  font-size:14.5px; font-weight:650; letter-spacing:.01em;
  transition:transform var(--t-fast) var(--ease), background var(--t-fast) var(--ease),
             opacity var(--t-fast) var(--ease);
}
.btn:active{ transform:scale(.97); }
.btn{ min-width:0; overflow:hidden; white-space:nowrap; text-overflow:ellipsis; }
.btn .lbl{ max-width:100%; overflow:hidden; text-overflow:ellipsis; }
.btn svg{ width:18px; height:18px; stroke:currentColor; fill:none; stroke-width:1.9;
  stroke-linecap:round; stroke-linejoin:round; }

.btn.pri{ background:var(--accent); color:var(--accent-ink); }
.btn.warn{ background:var(--warn); color:#2A1D02; }
.btn.danger{ background:var(--danger); color:#fff; }
.btn.info{ background:var(--info); color:#fff; }
.btn.ghost{ background:transparent; color:var(--text-dim); }
.btn.outline{ background:transparent; box-shadow:inset 0 0 0 1px var(--line); }
.btn.sm{ min-height:36px; padding:0 var(--s2); font-size:13px; border-radius:var(--r-sm); }
.btn.lg{ min-height:54px; font-size:15.5px; }
.btn.wide{ width:100%; }
.btn[disabled]{ opacity:.4; pointer-events:none; }

/* Acción grande del partido: icono arriba, etiqueta debajo. */
.btn.stack{ flex-direction:column; gap:3px; min-height:62px; padding:var(--s1) 4px; }
.btn.stack .lbl{ font-size:11px; font-weight:700; letter-spacing:.04em; }
.btn.stack svg{ width:21px; height:21px; }

/* ------------------------------------------------------------
   Chips y segmentos
   ------------------------------------------------------------ */
/* Envuelve en vez de desplazarse: en un móvil estrecho el último chip
   quedaba medio fuera de pantalla y parecía roto. */
.chiprow{
  display:flex; flex-wrap:wrap; gap:6px; padding:2px 0;
}
.chiprow .chip.fin{ margin-left:auto; }
.chip{
  flex:none; display:inline-flex; align-items:center; justify-content:center; gap:6px;
  padding:8px 14px; border-radius:var(--r-pill);
  background:var(--surface-2); color:var(--text-dim);
  font-size:13px; font-weight:650; white-space:nowrap;
  transition:background var(--t-fast) var(--ease), color var(--t-fast) var(--ease);
}
/* Sin esta regla el <svg> no tiene tamaño propio, ocupa el de por defecto
   (300x150 en la mayoría de navegadores) y empuja el texto fuera de la
   píldora: era el fallo del chip "Dorsal". */
.chip svg{ width:15px; height:15px; flex:none; stroke:currentColor; fill:none;
  stroke-width:1.9; stroke-linecap:round; stroke-linejoin:round; }
.chip.on{ background:var(--accent); color:var(--accent-ink); }

.seg{
  display:flex; gap:3px; padding:3px;
  background:var(--surface-2); border-radius:var(--r-btn);
}
.seg button{
  flex:1; min-height:36px; border-radius:var(--r-sm);
  color:var(--text-dim); font-size:12.5px; font-weight:650;
  transition:background var(--t-fast) var(--ease), color var(--t-fast) var(--ease);
}
.seg button.on{ background:var(--surface-3); color:var(--text); }

/* ------------------------------------------------------------
   Formularios
   ------------------------------------------------------------ */
label.f{
  display:block; margin:var(--s2) 0 6px;
  font-size:10.5px; font-weight:700; letter-spacing:.14em;
  text-transform:uppercase; color:var(--text-dim);
}
input,select,textarea{
  width:100%;
  min-height:46px;
  padding:11px var(--s2);
  background:var(--surface-2);
  border:1px solid var(--line);
  border-radius:var(--r-btn);
  color:var(--text);
  font-size:16px;              /* 16px evita el zoom automático en móvil */
  transition:border-color var(--t-fast) var(--ease);
}
input:focus,select:focus,textarea:focus{ outline:none; border-color:var(--accent-line); }
textarea{ min-height:86px; resize:vertical; line-height:1.5; }
select{ appearance:none; -webkit-appearance:none;
  background-image:linear-gradient(45deg,transparent 50%,var(--text-dim) 50%),
                   linear-gradient(135deg,var(--text-dim) 50%,transparent 50%);
  background-position:calc(100% - 17px) 21px, calc(100% - 12px) 21px;
  background-size:5px 5px,5px 5px; background-repeat:no-repeat;
  padding-right:34px;
}

/* ------------------------------------------------------------
   Fila de jugador / lista
   ------------------------------------------------------------ */
.plist{ display:flex; flex-direction:column; gap:6px; }

.prow{
  display:flex; align-items:center; gap:var(--s2);
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:var(--r-card);
  padding:10px var(--s2);
  transition:transform var(--t-fast) var(--ease), border-color var(--t-fast) var(--ease),
             background var(--t-fast) var(--ease);
}
.prow:active{ transform:scale(.99); }
.prow.sel{ border-color:var(--accent); background:var(--accent-soft); }
.prow.muted{ opacity:.45; }

.num-badge{
  flex:none; width:36px; height:36px; border-radius:10px;
  background:var(--surface-2); border:1px solid var(--line);
  display:grid; place-items:center;
  font-family:var(--mono); font-variant-numeric:tabular-nums;
  font-size:13.5px; font-weight:700;
}
.prow.sel .num-badge{ background:var(--accent); color:var(--accent-ink); border-color:transparent; }
.num-badge.sm{ width:30px; height:30px; font-size:12px; border-radius:9px; }

.pmain{ flex:1; min-width:0; }
.pmain .nm{
  font-size:14.5px; font-weight:650; line-height:1.25;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.pmain .sub{ font-size:11.5px; color:var(--text-dim); margin-top:1px;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

.pend{ flex:none; text-align:right; }
.pend .big{ font-family:var(--mono); font-variant-numeric:tabular-nums;
  font-size:14px; font-weight:700; }
.pend .small{ font-size:10.5px; color:var(--text-dim); }

/* ------------------------------------------------------------
   Insignias
   ------------------------------------------------------------ */
.badge{
  display:inline-flex; align-items:center; gap:4px;
  padding:3px 8px; border-radius:var(--r-pill);
  font-size:10.5px; font-weight:700; letter-spacing:.04em;
  background:var(--surface-2); color:var(--text-dim);
}
.badge.ok{ background:var(--accent-soft); color:var(--accent); }
.badge.warn{ background:var(--warn-soft); color:var(--warn); }
.badge.bad{ background:var(--danger-soft); color:var(--danger); }
.badge.info{ background:var(--info-soft); color:var(--info); }

.dot{ width:6px; height:6px; border-radius:50%; background:currentColor; flex:none; }

/* Marcas pequeñas de tarjetas y estadística en fila */
.marks{ display:flex; align-items:center; gap:3px; flex:none; }
.mk{ width:9px; height:12px; border-radius:2px; }
.mk.y{ background:var(--warn); }
.mk.r{ background:var(--danger); }
.mk.txt{ width:auto; height:auto; padding:2px 5px; border-radius:5px;
  font-size:10px; font-weight:800; line-height:1.25; }
.mk.g{ background:var(--accent-soft); color:var(--accent); }
.mk.a{ background:var(--info-soft); color:var(--info); }
.mk.f{ background:var(--surface-2); color:var(--text-dim); }

/* ------------------------------------------------------------
   Tiles de estadística
   ------------------------------------------------------------ */
.kpi{
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:var(--r-card);
  padding:var(--s2) var(--s2) 10px;
}
.kpi .v{
  font-family:var(--mono); font-variant-numeric:tabular-nums;
  font-size:24px; font-weight:700; line-height:1.1; letter-spacing:-.01em;
}
.kpi .k{
  font-size:10.5px; font-weight:700; letter-spacing:.08em; text-transform:uppercase;
  color:var(--text-dim); margin-top:4px;
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
}
.kpi.accent .v{ color:var(--accent); }
.kpi.warnv .v{ color:var(--warn); }

/* Línea de dato clave/valor */
.dl{
  display:flex; align-items:center; justify-content:space-between; gap:var(--s2);
  padding:9px 0; border-bottom:1px solid var(--line-soft); font-size:13.5px;
}
.dl:last-child{ border-bottom:0; }
.dl span{ color:var(--text-dim); }
.dl b{ font-family:var(--mono); font-variant-numeric:tabular-nums; font-weight:700; white-space:nowrap; }

/* Barra de proporción */
.bar{ height:6px; border-radius:3px; background:var(--surface-3); overflow:hidden; margin-top:5px; }
.bar > i{ display:block; height:100%; background:var(--accent); border-radius:3px;
  transition:width var(--t-slow) var(--ease); }

/* ------------------------------------------------------------
   Navegación inferior (teléfono)
   ------------------------------------------------------------ */
#nav{
  position:fixed; left:0; right:0; bottom:0; z-index:40;
  display:flex;
  background:rgba(15,17,21,.94);
  backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px);
  border-top:1px solid var(--line-soft);
  padding-bottom:var(--safe-b);
}
#nav button{
  flex:1; display:flex; flex-direction:column; align-items:center; gap:3px;
  padding:9px 2px 8px;
  color:var(--text-faint);
  font-size:10px; font-weight:650; letter-spacing:.02em;
  transition:color var(--t-fast) var(--ease);
}
#nav button svg{ width:21px; height:21px; stroke:currentColor; fill:none; stroke-width:1.75;
  stroke-linecap:round; stroke-linejoin:round;
  transition:transform var(--t-med) var(--ease); }
#nav button.on{ color:var(--accent); }
#nav button.on svg{ transform:translateY(-1px); }
#nav button .pip{
  width:4px; height:4px; border-radius:50%; background:transparent; margin-top:-1px;
}
#nav button.on .pip{ background:var(--accent); }

/* ------------------------------------------------------------
   Rail lateral (tablet / horizontal amplio)
   ------------------------------------------------------------ */
#rail{ display:none; }
@media (min-width:820px){
  #nav{ display:none; }
  #rail{
    display:flex; flex-direction:column; align-items:center; gap:4px;
    position:fixed; left:0; top:0; bottom:0; width:88px; z-index:45;
    padding:calc(var(--safe-t) + var(--s3)) 0 var(--s3);
    background:var(--surface);
    border-right:1px solid var(--line-soft);
  }
  #rail .logo{
    width:38px; height:38px; border-radius:11px; margin-bottom:var(--s2);
    background:var(--accent-soft); border:1px solid var(--accent-line);
    display:grid; place-items:center;
  }
  #rail .logo svg{ width:20px; height:20px; stroke:var(--accent); fill:none; stroke-width:1.9; }
  #rail button{
    width:68px; padding:10px 2px; border-radius:var(--r-btn);
    display:flex; flex-direction:column; align-items:center; gap:4px;
    color:var(--text-faint); font-size:10px; font-weight:650;
    transition:background var(--t-fast) var(--ease), color var(--t-fast) var(--ease);
  }
  #rail button svg{ width:21px; height:21px; stroke:currentColor; fill:none; stroke-width:1.75;
    stroke-linecap:round; stroke-linejoin:round; }
  #rail button.on{ background:var(--accent-soft); color:var(--accent); }
}

/* ------------------------------------------------------------
   Botón flotante
   ------------------------------------------------------------ */
.fab{
  position:fixed; right:var(--s3);
  bottom:calc(var(--nav-h) + var(--safe-b) + var(--s3));
  z-index:35;
  display:inline-flex; align-items:center; gap:var(--s1);
  height:52px; padding:0 20px; border-radius:var(--r-pill);
  background:var(--accent); color:var(--accent-ink);
  font-size:14.5px; font-weight:700;
  box-shadow:var(--shadow-2);
  transition:transform var(--t-fast) var(--ease);
}
.fab:active{ transform:scale(.95); }
.fab svg{ width:19px; height:19px; stroke:currentColor; fill:none; stroke-width:2.3; stroke-linecap:round; }
@media (min-width:820px){ .fab{ right:var(--s4); bottom:var(--s4); } }

/* ------------------------------------------------------------
   Hoja modal
   ------------------------------------------------------------ */
#sheet{
  position:fixed; inset:0; z-index:70;
  display:flex; align-items:flex-end; justify-content:center;
  background:rgba(6,8,11,.62);
  animation:fadeIn var(--t-med) var(--ease);
}
#sheet.hidden{ display:none; }
@keyframes fadeIn{ from{ opacity:0; } to{ opacity:1; } }

.sheetbox{
  width:100%; max-width:640px;
  max-height:90vh; overflow-y:auto;
  background:var(--surface);
  border:1px solid var(--line);
  border-bottom:0;
  border-radius:20px 20px 0 0;
  padding:var(--s2) var(--s3) calc(var(--s3) + var(--safe-b));
  animation:sheetUp var(--t-slow) var(--ease);
}
@keyframes sheetUp{ from{ transform:translateY(22px); } to{ transform:none; } }
.sheetbox .grip{
  width:36px; height:4px; border-radius:2px; background:var(--surface-3);
  margin:0 auto var(--s2);
}
.sheetbox h3{
  font-size:10.5px; font-weight:700; letter-spacing:.16em; text-transform:uppercase;
  color:var(--accent); margin-bottom:var(--s2);
}
.sheetfoot{ display:flex; gap:var(--s1); margin-top:var(--s3); }
.sheetfoot .btn{ flex:1; }

@media (min-width:820px){
  #sheet{ align-items:center; }
  .sheetbox{ border-radius:18px; border-bottom:1px solid var(--line); max-height:84vh; }
  @keyframes sheetUp{ from{ transform:scale(.97); opacity:0; } to{ transform:none; opacity:1; } }
}

/* Lista seleccionable dentro de una hoja */
.pick{
  display:flex; align-items:center; gap:var(--s2);
  padding:10px 4px; border-bottom:1px solid var(--line-soft);
}
.pick:last-of-type{ border-bottom:0; }
/* El nombre y la posición van en <span>, que es en línea: sin esto
   salían pegados ("Álvaro RuizPOR"). */
.pick .pmain{ min-width:0; }
.pick .nm, .pick .sub{ display:block; }
.pick input[type=checkbox]{
  width:22px; height:22px; min-height:0; flex:none; padding:0;
  accent-color:var(--accent);
}

/* ------------------------------------------------------------
   Aviso y toast
   ------------------------------------------------------------ */
#banner{
  background:var(--warn); color:#2A1D02;
  font-size:12.5px; font-weight:650;
  padding:9px var(--s3);
}
#toast{
  position:fixed; left:50%; z-index:90;
  bottom:calc(var(--nav-h) + var(--safe-b) + 18px);
  transform:translateX(-50%) translateY(8px);
  background:var(--text); color:var(--bg);
  padding:11px 18px; border-radius:var(--r-btn);
  font-size:13.5px; font-weight:650;
  box-shadow:var(--shadow-2);
  opacity:0; pointer-events:none; max-width:88%;
  transition:opacity var(--t-med) var(--ease), transform var(--t-med) var(--ease);
}
#toast.on{ opacity:1; transform:translateX(-50%) translateY(0); }

/* ------------------------------------------------------------
   Ruedas de selección (duración del partido)

   El desplazamiento y el encaje los hace el navegador con
   `scroll-snap`; aquí solo se define la ventana y la banda del
   centro. Por eso se arrastra con la misma inercia que una lista
   nativa y no hace falta capturar el dedo.
   ------------------------------------------------------------ */
.wrow{ display:flex; gap:var(--s1); }
.wcol{ flex:1; min-width:0; }
.wlab{
  font-size:10px; font-weight:700; letter-spacing:.1em; text-transform:uppercase;
  color:var(--text-dim); text-align:center; margin-bottom:6px;
}
.wbox{
  position:relative; border-radius:var(--r-btn);
  background:var(--surface-2); overflow:hidden;
}
.wsel{
  position:absolute; left:6px; right:6px; top:76px; height:38px;
  border-radius:var(--r-sm); background:var(--surface-3); pointer-events:none;
}
.wheel{
  position:relative; height:190px; overflow-y:auto;
  scroll-snap-type:y mandatory; -webkit-overflow-scrolling:touch;
  scrollbar-width:none;
}
.wheel::-webkit-scrollbar{ display:none; }
.wop{
  height:38px; scroll-snap-align:center;
  display:flex; align-items:baseline; justify-content:center; gap:3px;
  font-family:var(--mono); font-variant-numeric:tabular-nums;
  font-size:19px; font-weight:600; color:var(--text-faint);
  transition:color var(--t-fast) var(--ease), transform var(--t-fast) var(--ease);
}
.wop small{ font-family:var(--sans); font-size:10px; font-weight:650; }
.wop.on{ color:var(--text); transform:scale(1.06); }
.wpad{ pointer-events:none; }

@media (prefers-reduced-motion:reduce){
  .wop{ transition:none; }
}

/* ===== css/screens.css ===== */
/* =============================================================
   CoachBoard · pantallas
   ============================================================= */

/* ------------------------------------------------------------
   INICIO · próximo partido
   ------------------------------------------------------------ */
.hero{
  position:relative; overflow:hidden;
  background:linear-gradient(160deg,#1C212B 0%,#171A21 62%);
  border:1px solid var(--line);
  border-radius:var(--r-card);
  padding:var(--s3);
}
.hero::after{                       /* línea de campo, apenas visible */
  content:""; position:absolute; right:-40px; top:-40px;
  width:180px; height:180px; border-radius:50%;
  border:1px solid rgba(50,213,131,.10);
}
.hero .when{ display:flex; align-items:center; gap:var(--s1); margin-bottom:var(--s3); }
.hero .versus{
  display:grid; grid-template-columns:1fr auto 1fr; align-items:center; gap:var(--s2);
}
.hero .team{ font-size:16px; font-weight:700; line-height:1.2; }
.hero .team.a{ text-align:right; }
.hero .vs{
  font-size:10.5px; font-weight:700; letter-spacing:.14em;
  color:var(--text-faint); padding:0 2px;
}
.hero .meta{
  margin-top:var(--s3); padding-top:var(--s2);
  border-top:1px solid var(--line-soft);
  display:flex; gap:var(--s3); flex-wrap:wrap;
}
.hero .meta div{ font-size:12.5px; color:var(--text-dim); }
.hero .meta b{ display:block; color:var(--text); font-weight:650; font-size:13.5px; margin-top:1px; }

/* ------------------------------------------------------------
   PARTIDO · marcador
   ------------------------------------------------------------ */
.board{
  background:linear-gradient(180deg,#1B2029,#161920);
  border:1px solid var(--line);
  border-radius:var(--r-card);
  padding:var(--s3);
  text-align:center;
}
.board .teams{
  display:grid; grid-template-columns:1fr auto 1fr; align-items:center; gap:var(--s2);
  margin-bottom:var(--s1);
}
.board .tn{
  font-size:11px; font-weight:700; letter-spacing:.1em; text-transform:uppercase;
  color:var(--text-dim); line-height:1.3;
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
}
.board .score{
  font-size:40px; font-weight:700; letter-spacing:.02em; line-height:1;
  display:flex; align-items:center; justify-content:center; gap:var(--s2);
}
.board .score .sep{ color:var(--text-faint); font-size:26px; }
/* La tanda no toca el marcador: se enseña debajo y más pequeña. */
.board .penline{
  margin-top:4px; font-size:15px; font-weight:700; color:var(--info);
}
.board .penline span{
  font-family:var(--sans); font-size:10px; font-weight:700;
  letter-spacing:.1em; text-transform:uppercase; color:var(--text-dim);
}
.board .clock{
  font-size:46px; font-weight:700; line-height:1.05; letter-spacing:.01em;
  color:var(--accent); margin-top:var(--s2);
}
.board .clock.stop{ color:var(--text-dim); }
/* Descanso: se ve de un vistazo que no es el reloj del partido. */
.board .clock.des{ color:var(--warn); }
.durlink{
  margin-top:6px; padding:4px 10px; border-radius:var(--r-pill);
  background:var(--surface-2); color:var(--text-dim);
  font-size:11px; font-weight:650;
}
.board .per{
  display:inline-flex; align-items:center; gap:6px; margin-top:6px;
  font-size:10.5px; font-weight:700; letter-spacing:.12em; text-transform:uppercase;
  color:var(--text-dim);
}
.board .per .live{
  width:7px; height:7px; border-radius:50%; background:var(--accent);
  animation:pulse 1.6s ease-in-out infinite;
}
@keyframes pulse{ 0%,100%{ opacity:1; } 50%{ opacity:.25; } }

.scoreadj{ display:flex; align-items:center; justify-content:center; gap:var(--s1); margin-top:var(--s2); }
.scoreadj button{
  width:34px; height:34px; border-radius:var(--r-sm);
  background:var(--surface-2); color:var(--text-dim); font-size:17px; line-height:1;
}
.scoreadj button:active{ background:var(--surface-3); }

/* ------------------------------------------------------------
   PARTIDO · línea de tiempo
   ------------------------------------------------------------ */
.tl{ position:relative; padding:4px 0; }
.tl::before{
  content:""; position:absolute; left:50%; top:0; bottom:0;
  width:1px; margin-left:-.5px; background:var(--line);
}
.tl .ev{ position:relative; display:flex; align-items:center; margin-bottom:8px; min-height:46px; }
.tl .ev.b{ flex-direction:row-reverse; }
.tl .ev .side{ width:calc(50% - 24px); display:flex; justify-content:flex-end; }
.tl .ev.b .side{ justify-content:flex-start; }
.tl .ev .min{
  width:48px; flex:none; text-align:center; z-index:1;
  font-family:var(--mono); font-variant-numeric:tabular-nums;
  font-size:12px; font-weight:700; color:var(--text-dim);
  background:var(--bg); padding:4px 0;
}
.tl .ev .pad{ width:calc(50% - 24px); }
.tl .box{
  display:flex; align-items:center; gap:var(--s1);
  background:var(--surface); border:1px solid var(--line);
  border-radius:var(--r-sm); padding:8px 11px; max-width:100%;
  animation:cardIn var(--t-med) var(--ease) both;
}
.tl .ev:not(.b) .box{ flex-direction:row-reverse; text-align:right; }
.tl .box .tx{ min-width:0; }
.tl .box b{ display:block; font-size:13.5px; font-weight:650; line-height:1.25; }
.tl .box small{ display:block; font-size:11px; color:var(--text-dim); }
.tl .ic{ flex:none; width:22px; height:22px; display:grid; place-items:center; }
.tl .per-sep{ text-align:center; margin:10px 0; position:relative; z-index:1; }
.tl .per-sep span{
  display:inline-block; background:var(--surface-2); border:1px solid var(--line);
  color:var(--text-dim); border-radius:var(--r-pill); padding:5px 14px;
  font-size:11px; font-weight:700; letter-spacing:.06em;
}

/* iconos de la línea de tiempo */
.i-ball{ width:16px; height:16px; border-radius:50%; background:#fff;
  box-shadow:inset -3px -3px 0 -1px #10141A, 0 0 0 2px var(--accent); }
.i-ball.con{ box-shadow:inset -3px -3px 0 -1px #10141A, 0 0 0 2px var(--danger); }
.i-ball.pen{ box-shadow:inset -3px -3px 0 -1px #10141A, 0 0 0 2px var(--info); }
.i-ball.fallo{ background:var(--text-faint);
  box-shadow:inset -3px -3px 0 -1px #10141A, 0 0 0 2px var(--danger); }
.i-card{ width:12px; height:17px; border-radius:2px; }
.i-card.y{ background:var(--warn); }
.i-card.r{ background:var(--danger); }
.i-card.yr{ background:var(--warn); box-shadow:4px 3px 0 -1px var(--danger); }
.i-swap{ font-family:var(--mono); font-size:15px; font-weight:700; line-height:1; color:var(--accent); }
.i-swap span{ color:var(--danger); }
.i-as{ width:20px; height:20px; border-radius:50%; background:var(--info); color:#fff;
  display:grid; place-items:center; font-size:11px; font-weight:800; }
.i-foul{ width:15px; height:15px; border-radius:50%;
  border:2.5px solid var(--text-dim); box-shadow:inset 0 0 0 2px var(--bg); }
.i-note{ width:14px; height:16px; border:2px solid var(--text-faint); border-radius:3px; }

/* ------------------------------------------------------------
   ASISTENCIA
   ------------------------------------------------------------ */
.attsum{ display:flex; gap:6px; margin:var(--s2) 0; }
.attsum .s{
  flex:1; text-align:center; padding:9px 4px;
  background:var(--surface); border:1px solid var(--line); border-radius:var(--r-sm);
}
.attsum .s .v{ font-family:var(--mono); font-size:18px; font-weight:700; line-height:1.1; }
.attsum .s .k{ font-size:9.5px; font-weight:700; letter-spacing:.08em;
  text-transform:uppercase; color:var(--text-dim); margin-top:2px; }
.attsum .s.ok .v{ color:var(--accent); }
.attsum .s.bad .v{ color:var(--danger); }
.attsum .s.warn .v{ color:var(--warn); }
.attsum .s.info .v{ color:var(--info); }

/* Estado de asistencia: un círculo que cambia al tocar la fila. */
.attmark{
  flex:none; width:34px; height:34px; border-radius:50%;
  display:grid; place-items:center;
  font-size:15px; font-weight:800; line-height:1;
  background:var(--surface-2); color:var(--text-faint);
  transition:background var(--t-fast) var(--ease), color var(--t-fast) var(--ease),
             transform var(--t-fast) var(--ease);
}
.attmark.pop{ transform:scale(1.14); }
.attmark.Presente{ background:var(--accent-soft); color:var(--accent); }
.attmark.Ausente{ background:var(--danger-soft); color:var(--danger); }
.attmark.Justificado{ background:var(--info-soft); color:var(--info); }
.attmark.Pendiente{ background:var(--surface-2); color:var(--text-faint); }

/* ------------------------------------------------------------
   CAMPO / PIZARRA
   ------------------------------------------------------------ */
.stage{
  position:relative;
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:var(--r-card);
  overflow:hidden;
  touch-action:none;
}
.stage{ min-width:0; }
/* El lienzo tiene tamaño intrínseco propio: hay que dejarle encoger
   o empuja el ancho de toda la página. */
.stage canvas{ display:block; width:100%; max-width:100%; min-width:0; touch-action:none; }

/* Barra contextual flotante sobre el elemento seleccionado */
.ctxbar{
  position:absolute; z-index:6;
  display:flex; align-items:center; gap:2px;
  padding:4px;
  background:rgba(23,26,33,.97);
  border:1px solid var(--line);
  border-radius:var(--r-pill);
  box-shadow:var(--shadow-2);
  transform:translate(-50%,-50%);
  animation:ctxIn 140ms var(--ease);
}
.ctxbar.hidden{ display:none; }
@keyframes ctxIn{ from{ opacity:0; transform:translate(-50%,-44%) scale(.94); }
                  to{ opacity:1; transform:translate(-50%,-50%) scale(1); } }
.ctxbar button{
  width:38px; height:38px; border-radius:50%;
  display:grid; place-items:center; color:var(--text);
  transition:background var(--t-fast) var(--ease);
}
.ctxbar button:active{ background:var(--surface-3); }
.ctxbar button.danger{ color:var(--danger); }
.ctxbar button svg{ width:18px; height:18px; stroke:currentColor; fill:none;
  stroke-width:1.9; stroke-linecap:round; stroke-linejoin:round; }
.ctxbar .sep{ width:1px; height:20px; background:var(--line); margin:0 2px; }

/* Indicador de ángulo mientras se gira */
.anglepill{
  position:absolute; z-index:7; transform:translate(-50%,-50%);
  background:var(--warn); color:#2A1D02;
  font-family:var(--mono); font-size:12px; font-weight:700;
  padding:4px 9px; border-radius:var(--r-pill);
  pointer-events:none;
}
.anglepill.hidden{ display:none; }

/* Paleta de herramientas */
.toolbar{
  display:flex; gap:6px; overflow-x:auto; padding:var(--s1) 0 2px;
  -webkit-overflow-scrolling:touch; scrollbar-width:none;
}
.toolbar::-webkit-scrollbar{ display:none; }
.tool{
  flex:none; width:64px; padding:8px 2px;
  display:flex; flex-direction:column; align-items:center; gap:4px;
  background:var(--surface-2); border:1px solid transparent;
  border-radius:var(--r-sm);
  color:var(--text-dim); font-size:10px; font-weight:650;
  transition:background var(--t-fast) var(--ease), color var(--t-fast) var(--ease),
             border-color var(--t-fast) var(--ease);
}
.tool svg{ width:20px; height:20px; stroke:currentColor; fill:none; stroke-width:1.7;
  stroke-linecap:round; stroke-linejoin:round; }
.tool.on{ background:var(--accent-soft); border-color:var(--accent-line); color:var(--accent); }

/* Muestras de color */
.swatches{ display:flex; gap:7px; }
.sw{
  width:26px; height:26px; border-radius:50%; flex:none;
  border:2px solid transparent;
  box-shadow:inset 0 0 0 1px rgba(255,255,255,.16);
  transition:transform var(--t-fast) var(--ease);
}
.sw.on{ border-color:var(--text); transform:scale(1.1); }

/* ------------------------------------------------------------
   TÁCTICAS
   ------------------------------------------------------------ */
.formbar{ display:flex; align-items:center; gap:var(--s1); }
.formbar select{ flex:1; }

/* ------------------------------------------------------------
   Horizontal: el campo manda
   ------------------------------------------------------------ */
/* En horizontal el campo crece (lo calcula scene.fit) y la cabecera se
   estrecha, pero no se esconde ningún control: lo demás queda debajo. */
@media (orientation:landscape) and (max-width:819px){
  main{ padding-top:var(--s1); }
  #topbar{ padding-top:calc(var(--safe-t) + 6px); padding-bottom:6px; }
  .board .clock{ font-size:36px; }
  .board .score{ font-size:32px; }
}

/* ===== css/print.css ===== */
/* =============================================================
   CoachBoard · documentos imprimibles (acta y ficha)
   Se mantiene la maqueta A4 ya validada: al imprimir se oculta
   la aplicación y solo queda #printArea.
   ============================================================= */
#printArea{ display:none; }

@media print{
  html,body{ background:#fff !important; height:auto; }
  body > *{ display:none !important; }
  #printArea{ display:block !important; }
  @page{ size:A4; margin:15mm 14mm; }
}

#printArea .acta{
  color:#111; font-family:Georgia,"Times New Roman",serif;
  font-size:10.5pt; line-height:1.45;
}
#printArea .ah{ border-bottom:2.5px solid #111; padding-bottom:6px; margin-bottom:2px; }
#printArea .ah-t{
  font-size:19pt; letter-spacing:.16em; font-weight:700;
  font-family:system-ui,sans-serif;
}
#printArea .ah-s{
  font-size:8.5pt; letter-spacing:.1em; text-transform:uppercase; color:#444;
  font-family:system-ui,sans-serif; margin-top:3px;
}
#printArea .ares{
  display:flex; align-items:center; justify-content:center; gap:22px; margin:16px 0 20px;
}
#printArea .ares .tm{ font-size:13pt; font-weight:700; width:38%; font-family:system-ui,sans-serif; }
#printArea .ares .tm.r{ text-align:right; }
#printArea .ares .sc{
  font-size:30pt; font-weight:700; font-variant-numeric:tabular-nums;
  letter-spacing:.06em; font-family:system-ui,sans-serif;
}
#printArea h4{
  font-size:8.5pt; letter-spacing:.19em; text-transform:uppercase;
  font-family:system-ui,sans-serif;
  border-bottom:1px solid #111; padding-bottom:3px; margin:18px 0 7px; font-weight:700;
}
#printArea table{ width:100%; border-collapse:collapse; font-size:9.5pt; }
#printArea th{
  text-align:left; font-family:system-ui,sans-serif; font-size:7.5pt; letter-spacing:.12em;
  text-transform:uppercase; color:#333; border-bottom:1px solid #999; padding:3px 5px;
}
#printArea td{ padding:3px 5px; border-bottom:1px solid #DDD; vertical-align:top; }
#printArea td.n,#printArea th.n{
  text-align:right; font-variant-numeric:tabular-nums; white-space:nowrap;
}
#printArea tr.start td{ background:#F2F2F2; }
#printArea .chron{ column-count:2; column-gap:18px; font-size:9pt; }
#printArea .chron div{ break-inside:avoid; padding:1.5px 0; }
#printArea .chron b{ font-variant-numeric:tabular-nums; }
#printArea .foot{
  margin-top:22px; border-top:1px solid #BBB; padding-top:6px; font-size:7.5pt;
  color:#555; font-family:system-ui,sans-serif; letter-spacing:.06em;
  display:flex; justify-content:space-between;
}
#printArea .sig{ margin-top:26px; display:flex; gap:40px; }
#printArea .sig div{
  flex:1; border-top:1px solid #111; padding-top:4px; font-size:8pt;
  font-family:system-ui,sans-serif; color:#444;
}

</style>

<body>

<div id="banner" hidden></div>

<!-- Barra lateral: solo aparece en tablet y pantallas anchas -->
<nav id="rail"></nav>

<div id="app">

  <header id="topbar">
    <span class="brandmark">
      <svg viewBox="0 0 24 24"><rect x="3" y="4.5" width="18" height="15" rx="2"/><path d="M12 4.5v15"/><circle cx="12" cy="12" r="2.4"/></svg>
    </span>
    <span class="titles">
      <span class="t1" id="topTitle">CoachBoard</span>
      <span class="t2" id="topSub">Mi equipo</span>

  }
  function fmtDate(s) {
    if (!s) return "";

    a.download = name;

    setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 1500);

<script>
/* ===== js/core/store.js ===== */
/* =============================================================
   CoachBoard · core/store.js
   Persistencia y acceso a los datos. Nadie más toca localStorage.
   ============================================================= */
(function () {
  "use strict";

  var KEY = "coachboard.v1";
  var LEGACY = "entrenadorpro.v1";     // datos de versiones anteriores
  var U = window.CB.util;

  /* Función, no constante: si fuera un objeto literal compartido, todas
     las bases de datos "vacías" apuntarían a los mismos arrays y unas
     escribirían sobre otras. */
  function vacio() {
    return {
      club: "",
      jugadores: [],
      eventos: [],
      asistencia: [],
      ejercicios: [],
      tacticas: [],
      partidos: [],
      match: null,
      tac: null,
      durDef: null        // última duración usada al programar un partido
    };
  }

  var storageOk = true;

  /* Rellena lo que falte para que datos antiguos sigan valiendo. */
  function normalize(db) {
    var d = Object.assign(vacio(), db || {});
    ["jugadores", "eventos", "asistencia", "ejercicios", "tacticas", "partidos"].forEach(function (k) {
      if (!Array.isArray(d[k])) d[k] = [];
    });

    d.jugadores.forEach(function (j) {
      if (j.rot === undefined) j.rot = 0;
      if (!j.estado) j.estado = "Disponible";
      if (j.fechaNac === undefined) j.fechaNac = "";
      if (j.notas === undefined) j.notas = "";
      if (j.tel === undefined) j.tel = "";
    });

    /* Estados de asistencia: se unifican los nombres antiguos. */
    d.asistencia.forEach(function (a) {
      if (!Array.isArray(a.regs)) a.regs = [];
      a.regs.forEach(function (r) {
        if (r.e === "Justif.") r.e = "Justificado";
        else if (r.e === "Lesion." || r.e === "Lesionado") r.e = "Justificado";
        else if (r.e === "Tarde") r.e = "Presente";
        if (["Presente", "Ausente", "Justificado", "Pendiente"].indexOf(r.e) < 0) r.e = "Pendiente";
      });
    });

    /* Las piezas de la pizarra necesitan rotación y escala. */
    d.ejercicios.forEach(function (e) {
      if (!Array.isArray(e.items)) e.items = [];
      e.items.forEach(fixItem);
      if (e.categoria === undefined) e.categoria = "";
      if (e.desc === undefined) e.desc = "";
      if (e.jugadores === undefined) e.jugadores = "";
      if (e.min === undefined) e.min = "";
      if (e.modo === undefined) e.modo = "Completo";
    });

    d.tacticas.forEach(function (t) {
      if (!Array.isArray(t.fichas)) t.fichas = [];
    });

    /* Los partidos de antes de que la duración fuera elegible son
       todos de 2 x 45: el valor por defecto ya los deja igual. */
    var Mo = window.CB.models;
    d.durDef = d.durDef ? Mo.normDur(d.durDef) : null;
    d.eventos.forEach(function (e) {
      if (isMatch(e)) e.dur = Mo.normDur(e.dur);
      /* Antes el lugar era solo texto; ahora puede traer ubicación. */
      if (e.lugar === undefined) e.lugar = "";
      if (e.dir === undefined) e.dir = "";
      if (e.lat === undefined) e.lat = "";
      if (e.lon === undefined) e.lon = "";
    });

    if (d.match && !d.match.fal) d.match.fal = {};
    if (d.match && !d.match.goles) d.match.goles = [];
    if (d.match && !d.match.titulares) d.match.titulares = [];
    if (d.match) d.match.dur = Mo.normDur(d.match.dur);
    if (d.match) d.match.run = false;     // nunca se reanuda solo al abrir
    /* Un descanso a medias no sigue corriendo solo: se queda quieto y
       el botón "Empezar la parte" lo cierra. */
    if (d.match && d.match.br) d.match.br.run = false;

    d.partidos.forEach(function (p) {
      if (!Array.isArray(p.goles)) p.goles = [];
      if (!Array.isArray(p.titulares)) p.titulares = [];
      if (!Array.isArray(p.log)) p.log = [];
      if (!Array.isArray(p.jug)) p.jug = [];
    });

    return d;
  }

  function fixItem(it) {
    if (it.rot === undefined) it.rot = 0;
    if (it.scale === undefined) it.scale = 1;
    if (it.x2 === undefined) it.x2 = it.x;
    if (it.y2 === undefined) it.y2 = it.y;
    if (it.txt === undefined) it.txt = "";
    if (it.estilo === undefined) it.estilo = "";
    if (!it.id) it.id = U.uid();
    return it;
  }

  function read(key) {
    try {
      var raw = localStorage.getItem(key);
      return raw ? JSON.parse(raw) : null;
    } catch (e) { return null; }
  }

  function load() {
    var data = null;
    try {
      data = read(KEY);
      if (!data) {
        data = read(LEGACY);          // primera apertura tras actualizar
        if (data) { window.DB = normalize(data); save(); return; }
      }
    } catch (e) {
      storageOk = false;
      banner();
    }
    window.DB = normalize(data);
  }

  function save() {
    try {
      localStorage.setItem(KEY, JSON.stringify(window.DB));
    } catch (e) {
      if (storageOk) { storageOk = false; banner(); }
    }
  }

  function banner() {
    var b = U.$("banner");
    if (!b) return;
    b.hidden = false;
    b.textContent = "Este visor no puede guardar datos. Instala la aplicación para conservar la plantilla.";
  }

  /* --- accesos frecuentes ----------------------------------- */
  function jug(id) {
    return window.DB.jugadores.filter(function (j) { return j.id === id; })[0] || null;
  }
  function ev(id) {
    return window.DB.eventos.filter(function (e) { return e.id === id; })[0] || null;
  }
  function club() { return window.DB.club || "Mi equipo"; }

  function evDate(e) { return new Date(e.fecha + "T" + (e.hora || "00:00")); }
  function evSorted() {
    return window.DB.eventos.slice().sort(function (a, b) { return evDate(a) - evDate(b); });
  }
  function evTitle(e) { return e.rival ? e.tipo + " vs " + e.rival : e.tipo; }
  function isMatch(e) { return e.tipo !== "Entrenamiento" && e.tipo !== "Reunion"; }

  function nextEvents(filterFn) {
    var now = new Date(); now.setHours(0, 0, 0, 0);
    return evSorted().filter(function (e) {
      return evDate(e) >= now && (!filterFn || filterFn(e));
    });
  }

  /* Porcentaje de asistencia. Los "Pendiente" no cuentan: son
     jugadores sobre los que todavía no se ha decidido nada. */
  function attPct(id) {
    var t = 0, p = 0;
    window.DB.asistencia.forEach(function (a) {
      a.regs.forEach(function (r) {
        if (r.j !== id || r.e === "Pendiente") return;
        t++;
        if (r.e === "Presente") p++;
      });
    });
    return t ? { pct: Math.round(100 * p / t), t: t, p: p } : null;
  }

  function squadAttendance() {
    var tot = 0, n = 0;
    window.DB.jugadores.forEach(function (j) {
      var a = attPct(j.id);
      if (a) { tot += a.pct; n++; }
    });
    return n ? Math.round(tot / n) : null;
  }

  /* --- copia de seguridad ------------------------------------ */
  function backup() {
    window.download(
      "coachboard_" + new Date().toISOString().slice(0, 10) + ".json",
      new Blob([JSON.stringify(window.DB)], { type: "application/json" })
    );
    U.toast("Copia descargada");
  }

  function restore(input) {
    var f = input.files && input.files[0];
    if (!f) return;
    var r = new FileReader();
    r.onload = function () {
      try {
        window.DB = normalize(JSON.parse(r.result));
        save();
        window.CB.shell.closeSheet();
        window.CB.app.renderAll();
        U.toast("Copia restaurada");
      } catch (e) {
        U.toast("El archivo no es válido");
      }
    };
    r.readAsText(f);
  }

  window.CB.store = {
    load: load, save: save, normalize: normalize, fixItem: fixItem,
    jug: jug, ev: ev, club: club,
    evDate: evDate, evSorted: evSorted, evTitle: evTitle, isMatch: isMatch,
    nextEvents: nextEvents, attPct: attPct, squadAttendance: squadAttendance,
    backup: backup, restore: restore
  };

  /* Atajos globales usados por todas las pantallas. */
  window.save = save;
  window.jug = jug;
  window.ev = ev;
  window.attPct = attPct;
})();

</script>
<script>

/* =============================================================

(function () {
  "use strict";
  var U = window.CB.util;

  /* --- plantilla -------------------------------------------- */
  var POS = ["POR", "DFC", "LTD", "LTI", "MCD", "MC", "MCO", "ED", "EI", "SD", "DC"];
  var POS_LARGO = {
    POR: "Portero", DFC: "Defensa central", LTD: "Lateral derecho", LTI: "Lateral izquierdo",
    MCD: "Mediocentro defensivo", MC: "Mediocentro", MCO: "Mediapunta",
    ED: "Extremo derecho", EI: "Extremo izquierdo", SD: "Segundo delantero", DC: "Delantero centro"
  };
  var PIES = ["Diestro", "Zurdo", "Ambidiestro"];
  var ESTADOS = ["Disponible", "Lesionado", "Sancionado", "Baja"];

  /* --- asistencia ------------------------------------------- */
  var ATT_STATES = ["Presente", "Ausente", "Justificado", "Pendiente"];
  var ATT_GLYPH = { Presente: "✓", Ausente: "✕", Justificado: "!", Pendiente: "?" };

  /* --- calendario ------------------------------------------- */
  var TIPOS_SESION = ["Entrenamiento", "Partido", "Amistoso", "Torneo"];
  var CONDICIONES = ["Local", "Visitante", "Neutral"];

  /* --- partido ----------------------------------------------

     No todas las categorías juegan 2 x 45: fútbol 7 son 2 x 25, sala
     2 x 20 y en formación se juega a cuartos. La duración viaja con
     cada partido y de ella salen los nombres de los periodos y el
     minuto en el que arranca cada uno.

     Después de las partes van siempre dos prórrogas y la tanda de
     penaltis, que ocupa un hueco de periodo aunque no tenga reloj. */
  var DUR_DEF = { partes: 2, min: 45, desc: 15, prorroga: 15 };

  var FORMATOS = [
    { label: "Fútbol 11",  partes: 2, min: 45, desc: 15, prorroga: 15 },
    { label: "Fútbol 8/7", partes: 2, min: 25, desc: 10, prorroga: 10 },
    { label: "Fútbol sala", partes: 2, min: 20, desc: 10, prorroga: 5 },
    { label: "Cuatro cuartos", partes: 4, min: 15, desc: 10, prorroga: 5 }
  ];

  function normDur(d) {
    d = d || {};
    return {
      partes: clampNum(d.partes, 1, 6, DUR_DEF.partes),
      min: clampNum(d.min, 1, 60, DUR_DEF.min),
      desc: clampNum(d.desc, 0, 30, DUR_DEF.desc),
      prorroga: clampNum(d.prorroga, 0, 30, DUR_DEF.prorroga)
    };
  }
  function clampNum(v, lo, hi, def) {
    v = parseInt(v, 10);
    if (isNaN(v)) return def;
    return Math.min(hi, Math.max(lo, v));
  }

  var ORD = ["1ª", "2ª", "3ª", "4ª", "5ª", "6ª"];
  var ORD_M = ["1er", "2º", "3er", "4º", "5º", "6º"];

  /* Nombres de los periodos: partes, dos prórrogas y la tanda. */
  function periodos(dur) {
    var d = normDur(dur), a = [], i;
    for (i = 0; i < d.partes; i++) {
      if (d.partes === 2) a.push(ORD[i] + " parte");
      else if (d.partes === 4) a.push(ORD_M[i] + " cuarto");
      else a.push(ORD_M[i] + " periodo");
    }
    a.push("Prórroga 1", "Prórroga 2", "Penaltis");
    return a;
  }

  /* Segundo en el que empieza cada periodo, para que el reloj siga
     contando hacia arriba en vez de volver a cero en cada parte. */
  function periodoBase(dur) {
    var d = normDur(dur), a = [], i, t = 0;
    for (i = 0; i < d.partes; i++) { a.push(t); t += d.min * 60; }
    a.push(t); t += d.prorroga * 60;   // prórroga 1
    a.push(t); t += d.prorroga * 60;   // prórroga 2
    a.push(t);                         // penaltis
    return a;
  }

  function penIndex(dur) { return normDur(dur).partes + 2; }

  /* Descanso de este cambio de parte: el largo es el del intermedio;
     entre cuartos solo se cambia de campo. */
  function descansoSeg(dur, perQueAcaba) {
    var d = normDur(dur);
    var medio = Math.floor(d.partes / 2) - 1;
    if (perQueAcaba === medio) return d.desc * 60;
    return Math.min(d.desc, 5) * 60;
  }

  function durTexto(dur) {
    var d = normDur(dur);
    return d.partes + " × " + d.min + " min";
  }

  var TIPOS_GOL = ["Jugada", "Penalti", "Falta directa", "Corner", "En propia del rival"];
  var TIPOS_GOL_RIVAL = ["Jugada", "Penalti", "Falta directa", "Corner", "En propia puerta"];

  /* --- pizarra ---------------------------------------------- */
  var COLS = {
    Azul: "#4C8DFF", Rojo: "#EF4444", Amarillo: "#F5B942", Verde: "#32D583",
    Naranja: "#FF8C42", Blanco: "#F5F7FA", Negro: "#161A21"
  };

  /* Cada herramienta declara qué pieza crea y si admite rotación. */
  var TOOLS = [
    { id: "Mover",        label: "Mover",     icon: "t_player", select: true },
    { id: "Jugador",      label: "Jugador",   icon: "t_player" },
    { id: "Rival",        label: "Rival",     icon: "t_player" },
    { id: "Portero",      label: "Portero",   icon: "t_player" },
    { id: "Balon",        label: "Balón",     icon: "t_ball" },
    { id: "Cono",         label: "Cono",      icon: "t_cone" },
    { id: "Pica",         label: "Pica",      icon: "t_pole" },
    { id: "Aro",          label: "Aro",       icon: "t_hoop" },
    { id: "Valla",        label: "Valla",     icon: "t_hurdle" },
    { id: "Escalera",     label: "Escalera",  icon: "t_ladder" },
    { id: "Maniqui",      label: "Maniquí",   icon: "t_dummy" },
    { id: "Porteria",     label: "Portería",  icon: "t_goal" },
    { id: "Miniporteria", label: "Mini",      icon: "t_minigoal" },
    { id: "Flecha",       label: "Flecha",    icon: "t_arrow" },
    { id: "Pase",         label: "Pase",      icon: "t_line" },
    { id: "Conduccion",   label: "Conducción", icon: "t_arrow" },
    { id: "Linea",        label: "Línea",     icon: "t_line" },
    { id: "Zona",         label: "Zona",      icon: "t_zone" },
    { id: "Texto",        label: "Texto",     icon: "t_text" }
  ];

  /* Piezas de dos extremos: se orientan arrastrando, no rotando. */
  var DOS_PUNTAS = ["Flecha", "Zona"];
  function esDosPuntas(it) { return DOS_PUNTAS.indexOf(it.tipo) >= 0; }

  var MODOS_CAMPO = [
    { id: "Completo", label: "Campo entero" },
    { id: "Medio", label: "Medio campo" },
    { id: "Pizarra", label: "En blanco" }
  ];

  var CATEGORIAS = ["Posesión", "Finalización", "Salida de balón", "Presión",
                    "Transiciones", "Balón parado", "Físico", "Técnica", "Calentamiento", "Partido"];

  /* Fábrica de piezas: todo lo que necesita el motor de escena. */
  function makeItem(tool, nx, ny, color, contexto) {
    var it = {
      id: U.uid(),
      tipo: tool,
      x: nx, y: ny,
      x2: nx + 0.09, y2: ny,
      rot: 0,
      scale: 1,
      color: color || "Azul",
      txt: "",
      estilo: ""
    };
    var items = (contexto && contexto.items) || [];

    if (tool === "Rival") {
      it.tipo = "Jugador"; it.color = "Rojo";
      it.txt = String(items.filter(function (i) {
        return i.tipo === "Jugador" && i.color === "Rojo";
      }).length + 1);
    } else if (tool === "Jugador") {
      it.txt = String(items.filter(function (i) {
        return i.tipo === "Jugador" && i.color !== "Rojo";
      }).length + 1);
    } else if (tool === "Portero") {
      it.txt = "P"; it.color = "Amarillo";
    } else if (tool === "Flecha" || tool === "Pase" || tool === "Conduccion" || tool === "Linea") {
      it.tipo = "Flecha";
      it.estilo = tool === "Flecha" ? "Desplazamiento" : tool;
    } else if (tool === "Zona") {
      it.x2 = nx + 0.14; it.y2 = ny + 0.14;
    }
    return it;
  }

  /* --- formaciones (coordenadas normalizadas, ataque a la derecha) --- */
  var FORMS = {
    "4-4-2":      [[.055,.5],[.2,.16],[.19,.38],[.19,.62],[.2,.84],[.33,.14],[.31,.39],[.31,.61],[.33,.86],[.44,.4],[.44,.6]],
    "4-3-3":      [[.055,.5],[.2,.16],[.19,.38],[.19,.62],[.2,.84],[.3,.3],[.28,.5],[.3,.7],[.44,.16],[.46,.5],[.44,.84]],
    "4-2-3-1":    [[.055,.5],[.2,.16],[.19,.38],[.19,.62],[.2,.84],[.27,.38],[.27,.62],[.38,.16],[.37,.5],[.38,.84],[.46,.5]],
    "4-1-4-1":    [[.055,.5],[.2,.16],[.19,.38],[.19,.62],[.2,.84],[.26,.5],[.35,.14],[.34,.39],[.34,.61],[.35,.86],[.46,.5]],
    "3-5-2":      [[.055,.5],[.19,.28],[.18,.5],[.19,.72],[.3,.1],[.31,.32],[.29,.5],[.31,.68],[.3,.9],[.44,.4],[.44,.6]],
    "3-4-3":      [[.055,.5],[.19,.28],[.18,.5],[.19,.72],[.31,.13],[.3,.39],[.3,.61],[.31,.87],[.44,.18],[.46,.5],[.44,.82]],
    "5-3-2":      [[.055,.5],[.19,.1],[.18,.3],[.17,.5],[.18,.7],[.19,.9],[.31,.3],[.3,.5],[.31,.7],[.44,.4],[.44,.6]],
    "4-4-2 rombo":[[.055,.5],[.2,.16],[.19,.38],[.19,.62],[.2,.84],[.27,.5],[.33,.24],[.33,.76],[.39,.5],[.46,.4],[.46,.6]]
  };

  window.CB.models = {
    POS: POS, POS_LARGO: POS_LARGO, PIES: PIES, ESTADOS: ESTADOS,
    ATT_STATES: ATT_STATES, ATT_GLYPH: ATT_GLYPH,
    TIPOS_SESION: TIPOS_SESION, CONDICIONES: CONDICIONES,
    DUR_DEF: DUR_DEF, FORMATOS: FORMATOS, normDur: normDur,
    periodos: periodos, periodoBase: periodoBase, penIndex: penIndex,
    descansoSeg: descansoSeg, durTexto: durTexto,
    TIPOS_GOL: TIPOS_GOL, TIPOS_GOL_RIVAL: TIPOS_GOL_RIVAL,
    COLS: COLS, TOOLS: TOOLS, MODOS_CAMPO: MODOS_CAMPO, CATEGORIAS: CATEGORIAS,
    esDosPuntas: esDosPuntas, makeItem: makeItem, FORMS: FORMS
  };

<script>
/* ===== js/core/pitch.js ===== */
/* =============================================================
   CoachBoard · core/pitch.js
   Motor de dibujo: campo, fichas y piezas de la pizarra.
   Todo se dibuja en coordenadas de mundo (píxeles lógicos del
   lienzo); el zoom y el desplazamiento los aplica scene.js.
   ============================================================= */
(function () {
  "use strict";
  var M = window.CB.models;

  var BG = "#0F1115";
  var TURF = "#17452C";
  var TURF2 = "#1A4F32";
  var CHALK = "#E8F0EA";
  var SEL = "#F5B942";

  /* ------------------------------------------------------------
     Campo

     El campo se estira para llenar el lienzo, y no lo hace igual a lo
     ancho que a lo alto. Por eso los 9,15 m del círculo central y de
     la media luna del área no son un radio, sino dos: uno por eje.
     Dibujarlos como una circunferencia hacía que la media luna se
     metiera dentro del área en cuanto la pantalla no tenía la
     proporción de un campo real.

     Medidas reales de un campo de 105 x 68 m, en tanto por uno:
       9,15 / 105 = 0,0871      9,15 / 68 = 0,1346
     ------------------------------------------------------------ */
  var R_X = 9.15 / 105, R_Y = 9.15 / 68;

  /* Arco de elipse trazado punto a punto. No se usa scale() porque
     deformaría también el grosor de la línea, ni ellipse() porque no
     está en los WebView más antiguos. */
  function arcoElipse(g, cx, cy, rx, ry, t0, t1) {
    var n = Math.max(12, Math.round(Math.abs(t1 - t0) / (Math.PI / 60)));
    g.beginPath();
    for (var i = 0; i <= n; i++) {
      var t = t0 + (t1 - t0) * i / n;
      var x = cx + rx * Math.cos(t), y = cy + ry * Math.sin(t);
      if (i === 0) g.moveTo(x, y); else g.lineTo(x, y);
    }
    g.stroke();
  }

  /* Geometría del campo, aparte del dibujo para poder comprobarla.
     `medio` es el semiángulo de la media luna: el punto en el que la
     elipse de 9,15 m cruza la línea del área, sea cual sea la
     resolución. Si el área es tan profunda que la elipse no llega a
     salir, no hay media luna que dibujar. */
  function pitchGeom(pw, ph) {
    var g = {
      aW: pw * 0.157, aH: ph * 0.578,      // área grande
      gW: pw * 0.055, gH: ph * 0.265,      // área pequeña
      sp: pw * 0.105,                       // punto de penalti
      rx: pw * R_X, ry: ph * R_Y            // 9,15 m en cada eje
    };
    var d = g.aW - g.sp;                    // del penalti a la línea del área
    g.medio = d < g.rx ? Math.acos(d / g.rx) : 0;
    /* Dónde acaba el arco: tiene que caer justo sobre la línea. */
    g.finX = g.sp + g.rx * Math.cos(g.medio);
    return g;
  }

  function drawPitch(g, W, H, modo) {
    var m = Math.max(7, W * 0.012), vw = W - 2 * m, vh = H - 2 * m;
    g.fillStyle = BG;
    g.fillRect(0, 0, W, H);
    if (vw < 40 || vh < 40) return;

    if (modo === "Pizarra") {
      g.fillStyle = "#F7F9FB";
      g.fillRect(m, m, vw, vh);
      g.strokeStyle = "#DFE5EC";
      g.lineWidth = 1;
      var step = Math.max(24, vw / 16);
      for (var x = m; x < m + vw; x += step) { g.beginPath(); g.moveTo(x, m); g.lineTo(x, m + vh); g.stroke(); }
      for (var y = m; y < m + vh; y += step) { g.beginPath(); g.moveTo(m, y); g.lineTo(m + vw, y); g.stroke(); }
      g.strokeStyle = "#B7C0CC"; g.lineWidth = 2; g.strokeRect(m, m, vw, vh);
      return;
    }

    if (modo === "Medio") { medioCampo(g, W, m, vw, vh); return; }

    g.fillStyle = TURF;
    g.fillRect(m, m, vw, vh);
    g.fillStyle = TURF2;
    var bw = vw / 10;
    for (var i = 0; i < 10; i += 2) g.fillRect(m + i * bw, m, bw, vh);

    var px = m, py = m, pw = vw, ph = vh;

    var cx = px + pw / 2, cy = py + ph / 2;
    var G = pitchGeom(pw, ph);
    g.strokeStyle = CHALK; g.fillStyle = CHALK;
    g.lineWidth = Math.max(1.5, W / 500);
    g.strokeRect(px, py, pw, ph);
    g.beginPath(); g.moveTo(cx, py); g.lineTo(cx, py + ph); g.stroke();
    /* El círculo central se deja redondo, como estaba: es el aspecto
       de siempre de una pizarra y nadie se ha quejado de él. Lo que
       no encajaba era la media luna, y esa sí va como elipse. */
    g.beginPath(); g.arc(cx, cy, ph * 0.13, 0, 7); g.stroke();
    g.beginPath(); g.arc(cx, cy, Math.max(2, W / 300), 0, 7); g.fill();

    var aW = G.aW, aH = G.aH, gW = G.gW, gH = G.gH, sp = G.sp;
    g.strokeRect(px, cy - aH / 2, aW, aH);
    g.strokeRect(px + pw - aW, cy - aH / 2, aW, aH);
    g.strokeRect(px, cy - gH / 2, gW, gH);
    g.strokeRect(px + pw - gW, cy - gH / 2, gW, gH);
    [px + sp, px + pw - sp].forEach(function (sx) {
      g.beginPath(); g.arc(sx, cy, Math.max(2, W / 300), 0, 7); g.fill();
    });
    if (G.medio > 0.01) {
      arcoElipse(g, px + sp, cy, G.rx, G.ry, -G.medio, G.medio);
      arcoElipse(g, px + pw - sp, cy, G.rx, G.ry, Math.PI - G.medio, Math.PI + G.medio);
    }

    var gd = Math.max(4, pw * 0.012);
    g.strokeRect(px - gd, cy - ph * 0.09, gd, ph * 0.18);
    g.strokeRect(px + pw, cy - ph * 0.09, gd, ph * 0.18);

    var cr = Math.max(5, W / 120);
    [[px, py, 0], [px + pw, py, Math.PI / 2], [px + pw, py + ph, Math.PI], [px, py + ph, Math.PI * 1.5]]
      .forEach(function (c) { g.beginPath(); g.arc(c[0], c[1], cr, c[2], c[2] + Math.PI / 2); g.stroke(); });

  }

  /* ------------------------------------------------------------
     Media cancha

     Con la portería a un lado habría que ensanchar el campo más del
     doble para llenar un lienzo apaisado, y el área salía enorme y
     cortada contra el borde. Media cancha mide 68 x 52,5 m: puesta
     con la portería arriba cabe casi entera sin deformar nada.

     Aquí la escala es la misma en los dos ejes, así que todo se
     dibuja en metros y los círculos son círculos de verdad.
     ------------------------------------------------------------ */
  function medioCampo(g, W, m, vw, vh) {
    /* Se reserva sitio alrededor en metros: 1 m a cada lado y, arriba,
       los 1,5 m que la portería sobresale de la línea de fondo. Sin
       esa holgura la portería y el medio campo salen cortados contra
       el borde del lienzo. */
    var u = Math.min(vw / 70, vh / 57);         // píxeles por metro
    var ancho = 68 * u, largo = 52.5 * u;
    var x0 = m + (vw - ancho) / 2, x1 = x0 + ancho;
    var y0 = m + (vh - 57 * u) / 2 + 2.5 * u;         // línea de fondo
    var y1 = y0 + largo;                               // medio campo
    var cx = x0 + ancho / 2;

    /* Césped en todo el visor: lo que rodea al campo es banda, no
       hueco vacío. Las franjas van cruzadas porque el campo está
       girado. */
    g.fillStyle = TURF;
    g.fillRect(m, m, vw, vh);
    g.fillStyle = TURF2;
    var bh = largo / 5;
    for (var i = 0; i < 5; i += 2) g.fillRect(m, y0 + i * bh, vw, bh);

    g.strokeStyle = CHALK; g.fillStyle = CHALK;
    g.lineWidth = Math.max(1.5, W / 500);
    var punto = Math.max(2, W / 300);

    /* Perímetro visible: bandas, línea de fondo y medio campo. */
    g.beginPath();
    g.moveTo(x0, y1); g.lineTo(x0, y0); g.lineTo(x1, y0); g.lineTo(x1, y1);
    g.stroke();
    g.beginPath(); g.moveTo(x0, y1); g.lineTo(x1, y1); g.stroke();

    /* Círculo central: solo asoma la mitad por encima de la línea. */
    g.beginPath(); g.arc(cx, y1, 9.15 * u, Math.PI, 2 * Math.PI); g.stroke();
    g.beginPath(); g.arc(cx, y1, punto, 0, 7); g.fill();

    /* Áreas, punto de penalti y su media luna. */
    g.strokeRect(cx - 20.16 * u, y0, 40.32 * u, 16.5 * u);
    g.strokeRect(cx - 9.16 * u, y0, 18.32 * u, 5.5 * u);
    var pen = y0 + 11 * u;
    g.beginPath(); g.arc(cx, pen, punto, 0, 7); g.fill();
    /* Arranca donde el círculo de 9,15 m cruza la línea del área. */
    var medio = Math.acos(5.5 / 9.15);
    g.beginPath();
    g.arc(cx, pen, 9.15 * u, Math.PI / 2 - medio, Math.PI / 2 + medio);
    g.stroke();

    /* Portería, por fuera de la línea de fondo. */
    var gd = Math.max(4, 1.5 * u);
    g.strokeRect(cx - 3.66 * u, y0 - gd, 7.32 * u, gd);

    /* Córners. */
    var cr = Math.max(5, 1 * u);
    g.beginPath(); g.arc(x0, y0, cr, 0, Math.PI / 2); g.stroke();
    g.beginPath(); g.arc(x1, y0, cr, Math.PI / 2, Math.PI); g.stroke();
  }

  /* Balón. Lo usan la pizarra de entrenamientos y la táctica, así que
     vive aquí y no duplicado en cada una. */
  function ball(g, x, y, r, sel) {
    if (sel) {
      g.beginPath(); g.arc(x, y, r + Math.max(3, r * 0.45), 0, 7);
      g.strokeStyle = SEL; g.lineWidth = 2.5; g.stroke();
    }
    g.beginPath(); g.arc(x, y, r, 0, 7);
    g.fillStyle = "#fff"; g.fill();
    g.strokeStyle = "#161A21"; g.lineWidth = Math.max(1.2, r * 0.16); g.stroke();
    g.fillStyle = "#161A21";
    g.beginPath(); g.arc(x, y, r * 0.36, 0, 7); g.fill();
  }

  /* ------------------------------------------------------------
     Ficha de jugador
     ------------------------------------------------------------ */
  function token(g, x, y, r, col, dorsal, nombre, sel) {
    g.beginPath(); g.arc(x + 1, y + 2, r, 0, 7);
    g.fillStyle = "rgba(0,0,0,.35)"; g.fill();
    g.beginPath(); g.arc(x, y, r, 0, 7);
    g.fillStyle = col; g.fill();
    g.lineWidth = Math.max(1.5, r / 8);
    g.strokeStyle = "#F2F7FC"; g.stroke();

    if (dorsal) {
      g.fillStyle = "#fff";
      g.font = "700 " + Math.round(r * 0.95) + "px system-ui, sans-serif";
      g.textAlign = "center"; g.textBaseline = "middle";
      g.fillText(String(dorsal), x, y + 1);
    }
    if (nombre) {
      g.font = "700 " + Math.round(r * 0.62) + "px system-ui, sans-serif";
      g.textAlign = "center"; g.textBaseline = "top";
      var w = g.measureText(nombre).width + 8, h = r * 0.95;
      g.fillStyle = "rgba(10,13,18,.78)";
      g.fillRect(x - w / 2, y + r + 3, w, h);
      g.fillStyle = "#EEF3F8";
      g.fillText(nombre, x, y + r + 4);
    }
    if (sel) {
      g.beginPath(); g.arc(x, y, r + 5, 0, 7);
      g.strokeStyle = SEL; g.lineWidth = 2;
      g.setLineDash([4, 4]); g.stroke(); g.setLineDash([]);
    }
  }

  function arrowHead(g, x1, y1, x2, y2, len) {
    var a = Math.atan2(y2 - y1, x2 - x1);
    g.beginPath();
    g.moveTo(x2, y2);
    g.lineTo(x2 + len * Math.cos(a + 2.6), y2 + len * Math.sin(a + 2.6));
    g.lineTo(x2 + len * Math.cos(a - 2.6), y2 + len * Math.sin(a - 2.6));
    g.closePath();
    g.fill();
  }

  /* ------------------------------------------------------------
     Piezas de la pizarra
     ------------------------------------------------------------ */
  function drawItem(g, it, W, H, S) {
    var x = it.x * W, y = it.y * H;
    var col = M.COLS[it.color] || M.COLS.Azul;
    var s = S * (it.scale || 1);
    var dosPuntas = M.esDosPuntas(it);
    var rot = (it.rot || 0) * Math.PI / 180;

    g.save();
    /* La rotación gira alrededor del propio centro de la pieza, así
       que mover y girar son operaciones totalmente independientes. */
    if (rot && !dosPuntas) {
      g.translate(x, y); g.rotate(rot); g.translate(-x, -y);
    }
    g.strokeStyle = col; g.fillStyle = col;
    g.lineWidth = Math.max(2, s * 0.22);
    g.textAlign = "center"; g.textBaseline = "middle";

    switch (it.tipo) {
      case "Jugador":
        token(g, x, y, s, col, it.txt, "", false);
        break;

      case "Portero":
        token(g, x, y, s, M.COLS.Amarillo, it.txt || "P", "", false);
        break;

      case "Cono":
        g.beginPath();
        g.moveTo(x, y - s * 0.85);
        g.lineTo(x - s * 0.7, y + s * 0.6);
        g.lineTo(x + s * 0.7, y + s * 0.6);
        g.closePath(); g.fill();
        break;

      case "Balon":
        ball(g, x, y, s * 0.5);
        break;

      case "Porteria":
        g.strokeStyle = CHALK;
        g.strokeRect(x - s * 1.6, y - s * 0.55, s * 3.2, s * 1.1);
        g.lineWidth = 1;
        for (var i = -s * 1.3; i <= s * 1.3; i += s * 0.45) {
          g.beginPath(); g.moveTo(x + i, y - s * 0.55); g.lineTo(x + i, y + s * 0.55); g.stroke();
        }
        break;

      case "Miniporteria":
        g.strokeStyle = CHALK;
        g.strokeRect(x - s, y - s * 0.35, s * 2, s * 0.7);
        break;

      case "Escalera":
        g.strokeStyle = CHALK;
        g.strokeRect(x - s * 2.4, y - s * 0.8, s * 4.8, s * 1.6);
        for (var k = -s * 1.6; k <= s * 1.6; k += s * 0.8) {
          g.beginPath(); g.moveTo(x + k, y - s * 0.8); g.lineTo(x + k, y + s * 0.8); g.stroke();
        }
        break;

      case "Valla":
        g.strokeStyle = M.COLS.Amarillo;
        g.beginPath();
        g.moveTo(x - s, y - s * 0.45); g.lineTo(x + s, y - s * 0.45);
        g.moveTo(x - s, y - s * 0.45); g.lineTo(x - s, y + s * 0.5);
        g.moveTo(x + s, y - s * 0.45); g.lineTo(x + s, y + s * 0.5);
        g.stroke();
        break;

      case "Pica":
        g.beginPath(); g.moveTo(x, y - s); g.lineTo(x, y + s * 0.7); g.stroke();
        g.beginPath(); g.ellipse(x, y + s * 0.7, s * 0.45, s * 0.2, 0, 0, 7); g.fill();
        break;

      case "Aro":
        g.beginPath(); g.ellipse(x, y, s * 0.95, s * 0.65, 0, 0, 7); g.stroke();
        break;

      case "Maniqui":
        g.beginPath(); g.arc(x, y - s * 0.8, s * 0.42, 0, 7); g.fill();
        g.fillRect(x - s * 0.45, y - s * 0.3, s * 0.9, s * 1.3);
        break;

      case "Texto": {
        var etiqueta = it.txt || "Texto";
        g.font = "700 " + Math.round(s * 1.1) + "px system-ui, sans-serif";
        var tw = g.measureText(etiqueta).width + 12;
        g.fillStyle = "rgba(10,13,18,.78)";
        g.fillRect(x - tw / 2, y - s * 0.85, tw, s * 1.7);
        g.fillStyle = col;
        g.fillText(etiqueta, x, y);
        break;
      }

      case "Zona": {
        var zx2 = it.x2 * W, zy2 = it.y2 * H;
        var rx = Math.min(x, zx2), ry = Math.min(y, zy2);
        var rw = Math.abs(zx2 - x), rh = Math.abs(zy2 - y);
        g.fillStyle = hexA(col, .22);
        g.fillRect(rx, ry, rw, rh);
        g.strokeStyle = col; g.lineWidth = 2;
        g.setLineDash([6, 5]); g.strokeRect(rx, ry, rw, rh); g.setLineDash([]);
        break;
      }

      case "Flecha": {
        var ax2 = it.x2 * W, ay2 = it.y2 * H;
        if (it.estilo === "Pase") g.setLineDash([9, 6]);
        if (it.estilo === "Conduccion") {
          wavy(g, x, y, ax2, ay2, s);
        } else {
          g.beginPath(); g.moveTo(x, y); g.lineTo(ax2, ay2); g.stroke();
        }
        g.setLineDash([]);
        if (it.estilo !== "Linea") arrowHead(g, x, y, ax2, ay2, s * 0.9);
        break;
      }

      default:
        token(g, x, y, s, col, it.txt, "", false);
    }
    g.restore();
  }

  /* Conducción: la onda se apaga en los extremos y el último tramo
     es recto, así la punta cae justo en el destino. */
  function wavy(g, x1, y1, x2, y2, s) {
    var dx = x2 - x1, dy = y2 - y1;
    var L = Math.hypot(dx, dy) || 1;
    var ux = dx / L, uy = dy / L;
    var cola = Math.min(L * 0.35, s * 1.4);
    var Lw = Math.max(1, L - cola);
    var amp = s * 0.35;
    var pasos = Math.max(8, Math.round(Lw / 2.5));
    g.beginPath();
    g.moveTo(x1, y1);
    for (var k = 1; k <= pasos; k++) {
      var d = Lw * k / pasos, t = d / Lw;
      var o = Math.sin(d / 9) * amp * Math.sin(Math.PI * t);
      g.lineTo(x1 + ux * d - uy * o, y1 + uy * d + ux * o);
    }
    g.lineTo(x2, y2);
    g.stroke();
  }

  function hexA(hex, a) {
    var h = hex.replace("#", "");
    if (h.length === 3) h = h[0] + h[0] + h[1] + h[1] + h[2] + h[2];
    var n = parseInt(h, 16);
    return "rgba(" + ((n >> 16) & 255) + "," + ((n >> 8) & 255) + "," + (n & 255) + "," + a + ")";
  }

  /* ------------------------------------------------------------
     Geometría de selección (la comparte el motor de escena)
     ------------------------------------------------------------ */
  function itemRadius(it, S) {
    var s = S * (it.scale || 1);
    switch (it.tipo) {
      case "Escalera": return s * 2.6;
      case "Porteria": return s * 1.8;
      case "Texto": return s * 1.6;
      case "Miniporteria": return s * 1.3;
      default: return s * 1.25;
    }
  }

  /* El tirador de giro cuelga por encima de la pieza y acompaña su
     rotación, de modo que siempre cae donde el ojo lo espera. */
  function handlePos(it, W, H, S) {
    var off = itemRadius(it, S) + S * 1.5;
    var a = (it.rot || 0) * Math.PI / 180;
    return {
      x: it.x * W + Math.sin(a) * off,
      y: it.y * H - Math.cos(a) * off
    };
  }

  function drawSelection(g, it, W, H, S) {
    var x = it.x * W, y = it.y * H;
    g.save();
    if (M.esDosPuntas(it)) {
      var x2 = it.x2 * W, y2 = it.y2 * H;
      g.strokeStyle = SEL; g.lineWidth = 1.4;
      g.setLineDash([4, 4]);
      g.strokeRect(Math.min(x, x2) - 8, Math.min(y, y2) - 8,
                   Math.abs(x2 - x) + 16, Math.abs(y2 - y) + 16);
      g.setLineDash([]);
      [[x, y], [x2, y2]].forEach(function (p) {
        g.beginPath(); g.arc(p[0], p[1], S * 0.5, 0, 7);
        g.fillStyle = SEL; g.fill();
        g.strokeStyle = "#0F1115"; g.lineWidth = 1.5; g.stroke();
      });
      g.restore();
      return;
    }

    var r = itemRadius(it, S);
    g.strokeStyle = SEL; g.lineWidth = 1.6;
    g.setLineDash([5, 4]);
    g.beginPath(); g.arc(x, y, r, 0, 7); g.stroke();
    g.setLineDash([]);

    var hp = handlePos(it, W, H, S);
    g.beginPath(); g.moveTo(x, y); g.lineTo(hp.x, hp.y);
    g.strokeStyle = "rgba(245,185,66,.55)"; g.lineWidth = 1.4; g.stroke();

    g.beginPath(); g.arc(hp.x, hp.y, S * 0.62, 0, 7);
    g.fillStyle = SEL; g.fill();
    g.strokeStyle = "#0F1115"; g.lineWidth = 1.6; g.stroke();

    /* flechita dentro del tirador para que se lea "girar" */
    g.strokeStyle = "#2A1D02"; g.lineWidth = 1.4;
    g.beginPath(); g.arc(hp.x, hp.y, S * 0.3, -0.6, 3.4); g.stroke();
    g.restore();
  }

  function baseSize(W) { return Math.max(9, Math.min(22, W / 40)); }

  function drawScene(g, W, H, modo, items, selId) {
    g.lineJoin = "round";
    g.lineCap = "round";
    var S = baseSize(W);
    drawPitch(g, W, H, modo);
    items.forEach(function (it) { drawItem(g, it, W, H, S); });
    if (selId) {
      var sel = items.filter(function (i) { return i.id === selId; })[0];
      if (sel) drawSelection(g, sel, W, H, S);
    }
  }

  window.CB.pitch = {
    drawPitch: drawPitch, token: token, ball: ball, arrowHead: arrowHead,
    drawItem: drawItem, drawScene: drawScene, drawSelection: drawSelection,
    itemRadius: itemRadius, handlePos: handlePos, baseSize: baseSize,
    pitchGeom: pitchGeom
  };
})();

</script>
<script>
/* ===== js/core/stats.js ===== */
/* =============================================================
   CoachBoard · core/stats.js
   Cálculo de estadísticas. Sin DOM: solo números.
   ============================================================= */
(function () {
  "use strict";
  var S = window.CB.store;
  var M = window.CB.models;

  /* Resumen de un jugador a partir de las actas cerradas. */
  function player(id) {
    var j = S.jug(id) || {};
    var min = 0, g = 0, a = 0, ta = 0, tr = 0, fal = 0, pj = 0, tit = 0, conv = 0;
    var tipos = {}, partidos = [];

    window.DB.partidos.slice()
      .sort(function (x, y) { return String(y.fecha).localeCompare(String(x.fecha)); })
      .forEach(function (p) {
        var f = (p.jug || []).filter(function (x) { return x.j === id; })[0];
        if (!f) return;
        conv++;
        var esTit = (p.titulares || []).indexOf(id) >= 0;
        if (esTit) tit++;
        if ((f.min || 0) > 0) pj++;
        min += f.min || 0; g += f.gol || 0; a += f.asi || 0;
        ta += f.ta || 0; tr += f.tr || 0; fal += f.fal || 0;
        (p.goles || []).forEach(function (x) {
          if (x.j === id) {
            var t = x.tipo || "Jugada";
            tipos[t] = (tipos[t] || 0) + 1;
          }
        });
        partidos.push({
          fecha: p.fecha, rival: p.rival, res: p.gf + "-" + p.gc,
          rol: esTit ? "Titular" : "Suplente",
          min: f.min || 0, gol: f.gol || 0, asi: f.asi || 0,
          fal: f.fal || 0, ta: f.ta || 0, tr: f.tr || 0
        });
      });

    var att = S.attPct(id);
    return {
      j: j, id: id, conv: conv, pj: pj, tit: tit, min: min,
      g: g, a: a, ta: ta, tr: tr, fal: fal,
      tipos: tipos, partidos: partidos, att: att,
      media: pj ? Math.round(min / pj) : 0,
      minGol: g ? Math.round(min / g) : null,
      minAsi: a ? Math.round(min / a) : null,
      minPart: (g + a) ? Math.round(min / (g + a)) : null,
      minFal: fal ? Math.round(min / fal) : null,
      falPart: pj ? (fal / pj).toFixed(1) : "0",
      favorito: (function () {
        var o = Object.keys(tipos).sort(function (x, y) { return tipos[y] - tipos[x]; });
        return (o.length && tipos[o[0]] >= 2 && (o.length === 1 || tipos[o[0]] > tipos[o[1]])) ? o[0] : null;
      })()
    };
  }

  /* Orden de tipos de gol estable para las tablas. */
  function tiposOrdenados(tipos) {
    var extra = Object.keys(tipos).filter(function (t) { return M.TIPOS_GOL.indexOf(t) < 0; });
    return M.TIPOS_GOL.concat(extra).filter(function (t) { return tipos[t]; });
  }

  window.CB.stats = { player: player, tiposOrdenados: tiposOrdenados };
})();

</script>
<script>
/* ===== js/core/scene.js ===== */
/* =============================================================
   CoachBoard · core/scene.js
   Motor de la pizarra: selección, arrastre, rotación, duplicado,
   borrado, historial, zoom y desplazamiento.

   Regla de oro del diseño: cada gesto entra en UN solo modo.
   Si el dedo baja sobre el tirador de giro, el gesto es "rotate" y
   jamás escribe en x/y. Si baja sobre el cuerpo, es "move" y jamás
   escribe en rot. Por eso girar no puede desplazar la pieza.
   ============================================================= */
(function () {
  "use strict";
  var U = window.CB.util;
  var M = window.CB.models;
  var P = window.CB.pitch;
