  var UMBRAL_ARRASTRE = 4;   // px de holgura antes de mover: un toque no empuja
  var SNAP_GRADOS = 15;
  var SNAP_TOLERANCIA = 4;
  var ZOOM_MAX = 4;
  var HISTORIAL_MAX = 40;

  function create(opts) {
    var canvas = opts.canvas;
    var stage = opts.stage;
    var ctxbar = opts.ctxbar || null;
    var pill = opts.pill || null;
    var g = canvas.getContext("2d");

    var st = {
      items: [],
      sel: null,
      tool: "Mover",
      color: "Azul",
      modo: "Completo",
      view: { k: 1, tx: 0, ty: 0 },
      historial: []
    };

    var punteros = new Map();
    var gesto = null;        // { modo, it, ... }
    var pellizco = null;
    var pendiente = null;    // instantánea previa a un arrastre

    /* ---------------------------------------------------------
       Medidas del lienzo
       --------------------------------------------------------- */
    function dpr() { return Math.min(window.devicePixelRatio || 1, 2); }
    function W() { return canvas.width / dpr(); }
    function H() { return canvas.height / dpr(); }

    function fit() {
      var w = canvas.parentElement.clientWidth;
      if (!w) return;
      var apaisado = window.innerWidth > window.innerHeight;
      var h = Math.round(apaisado
        ? Math.min(w * 0.62, Math.max(220, window.innerHeight - 190))
        : w * 0.66);
      var d = dpr();
      canvas.width = w * d;
      canvas.height = h * d;
      canvas.style.height = h + "px";
      clampView();
      paint();
    }

    /* ---------------------------------------------------------
       Conversión pantalla ↔ mundo
       --------------------------------------------------------- */
    function toWorld(sx, sy) {
      return { x: (sx - st.view.tx) / st.view.k, y: (sy - st.view.ty) / st.view.k };
    }
    function toScreen(wx, wy) {
      return { x: wx * st.view.k + st.view.tx, y: wy * st.view.k + st.view.ty };
    }
    function localPos(e) {
      var r = canvas.getBoundingClientRect();
      return { x: e.clientX - r.left, y: e.clientY - r.top };
    }
    function clampView() {
      var v = st.view;
      v.k = U.clamp(v.k, 1, ZOOM_MAX);
      var w = W(), h = H();
      v.tx = U.clamp(v.tx, w * (1 - v.k), 0);
      v.ty = U.clamp(v.ty, h * (1 - v.k), 0);
    }

    /* ---------------------------------------------------------
       Pintado
       --------------------------------------------------------- */
    function paint() {
      var d = dpr(), w = W(), h = H();
      g.setTransform(d, 0, 0, d, 0, 0);
      g.fillStyle = "#0F1115";
      g.fillRect(0, 0, w, h);
      g.save();
      g.translate(st.view.tx, st.view.ty);
      g.scale(st.view.k, st.view.k);
      P.drawScene(g, w, h, st.modo, st.items, st.sel);
      g.restore();
      placeCtxBar();
    }

    /* ---------------------------------------------------------
       Barra contextual flotante
       --------------------------------------------------------- */
    /* Distancia que hay que dejar libre alrededor del centro para no
       tapar ni la pieza ni su tirador de giro: el tirador puede estar
       en cualquier punto de esa circunferencia según el ángulo. */
    function despeje(it, S) {
      if (M.esDosPuntas(it)) return S * 1.6;
      return P.itemRadius(it, S) + S * 1.5 + S * 0.62 + 10;
    }

    function placeCtxBar() {
      if (!ctxbar) return;
      var it = selected();
      if (!it || gesto) {                  // se esconde mientras se manipula
        ctxbar.classList.add("hidden");
        return;
      }
      var S = P.baseSize(W());
      var cx = it.x * W(), cy = it.y * H();
      if (M.esDosPuntas(it)) {
        cx = (it.x + it.x2) / 2 * W();
        cy = Math.min(it.y, it.y2) * H();
      }
      var d = despeje(it, S);
      var ALTO = 24;                       // media altura de la barra
      var arriba = toScreen(cx, cy - d).y - ALTO;
      var abajo = toScreen(cx, cy + d).y + ALTO;

      var y = arriba;
      if (arriba < ALTO + 6) {             // no cabe encima: se pone debajo
        y = abajo;
        if (y > canvas.clientHeight - ALTO - 6) y = canvas.clientHeight - ALTO - 6;
      }
      y = U.clamp(y, ALTO + 6, canvas.clientHeight - ALTO - 6);

      var x = U.clamp(toScreen(cx, cy).x, 100, Math.max(100, canvas.clientWidth - 100));
      ctxbar.style.left = x + "px";
      ctxbar.style.top = y + "px";
      ctxbar.classList.remove("hidden");
    }

    function showPill(txt, wx, wy) {
      if (!pill) return;
      var p = toScreen(wx, wy);
      pill.textContent = txt;
      pill.style.left = U.clamp(p.x, 40, canvas.clientWidth - 40) + "px";
      pill.style.top = U.clamp(p.y - 46, 20, canvas.clientHeight - 20) + "px";
      pill.classList.remove("hidden");
    }
    function hidePill() { if (pill) pill.classList.add("hidden"); }

    /* ---------------------------------------------------------
       Historial
       --------------------------------------------------------- */
    function instantanea() { return JSON.stringify(st.items); }
    function apuntar() {
      st.historial.push(instantanea());
      if (st.historial.length > HISTORIAL_MAX) st.historial.shift();
      notify();
    }
    function abrirPendiente() { pendiente = instantanea(); }
    function cerrarPendiente() {
      if (pendiente !== null && pendiente !== instantanea()) {
        st.historial.push(pendiente);
        if (st.historial.length > HISTORIAL_MAX) st.historial.shift();
        notify();
      }
      pendiente = null;
    }
    function undo() {
      if (!st.historial.length) { U.toast("No hay nada que deshacer"); return; }
      st.items = JSON.parse(st.historial.pop());
      st.sel = null;
      paint(); notify();
    }
    function puedeDeshacer() { return st.historial.length > 0; }

    function notify() { if (opts.onChange) opts.onChange(st); }

    /* ---------------------------------------------------------
       Localización de la pieza bajo el dedo
       --------------------------------------------------------- */
    function selected() {
      return st.items.filter(function (i) { return i.id === st.sel; })[0] || null;
    }

    function hitTest(wx, wy) {
      var S = P.baseSize(W()), w = W(), h = H();

      /* 1) El tirador de giro de la pieza seleccionada tiene prioridad
            absoluta: si el dedo cae ahí, el gesto será girar. */
      var sel = selected();
      if (sel && !M.esDosPuntas(sel)) {
        var hp = P.handlePos(sel, w, h, S);
        if (Math.hypot(wx - hp.x, wy - hp.y) < S * 1.5) {
          return { it: sel, modo: "rotate" };
        }
      }

      /* 2) Extremos de flechas y zonas. */
      for (var i = st.items.length - 1; i >= 0; i--) {
        var it = st.items[i];
        if (!M.esDosPuntas(it)) continue;
        var x = it.x * w, y = it.y * h, x2 = it.x2 * w, y2 = it.y2 * h;
        if (Math.hypot(wx - x, wy - y) < S * 1.3) return { it: it, modo: "p1" };
        if (Math.hypot(wx - x2, wy - y2) < S * 1.3) return { it: it, modo: "p2" };
        if (Math.hypot(wx - (x + x2) / 2, wy - (y + y2) / 2) < S * 1.5) return { it: it, modo: "move" };
      }

      /* 3) Cuerpo de las demás piezas, de arriba abajo. */
      for (var k = st.items.length - 1; k >= 0; k--) {
        var p = st.items[k];
        if (M.esDosPuntas(p)) continue;
        if (Math.hypot(wx - p.x * w, wy - p.y * h) < P.itemRadius(p, S) + S * 0.35) {
          return { it: p, modo: "move" };
        }
      }
      return null;
    }

    /* ---------------------------------------------------------
       Gestos
       --------------------------------------------------------- */
    function onDown(e) {
      canvas.setPointerCapture(e.pointerId);
      punteros.set(e.pointerId, localPos(e));

      if (punteros.size === 2) {         // dos dedos: zoom y desplazamiento
        gesto = null;
        hidePill();
        var p = [].concat(Array.from(punteros.values()));
        pellizco = {
          d: Math.hypot(p[0].x - p[1].x, p[0].y - p[1].y) || 1,
          cx: (p[0].x + p[1].x) / 2,
          cy: (p[0].y + p[1].y) / 2,
          k: st.view.k, tx: st.view.tx, ty: st.view.ty
        };
        return;
      }
      if (punteros.size > 2) return;

      var loc = localPos(e);
      var wpt = toWorld(loc.x, loc.y);

      if (st.tool === "Mover") {
        var h = hitTest(wpt.x, wpt.y);
        if (!h) { st.sel = null; paint(); notify(); return; }
        st.sel = h.it.id;
        abrirPendiente();
        gesto = {
          modo: h.modo,
          it: h.it,
          inicio: loc,
          movido: false,
          offx: wpt.x / W() - h.it.x,
          offy: wpt.y / H() - h.it.y,
          rot0: h.it.rot || 0,
          ang0: Math.atan2(wpt.y - h.it.y * H(), wpt.x - h.it.x * W())
        };
        paint();
        return;
      }

      /* Herramienta de creación: la pieza nace donde toca el dedo. */
      crear(st.tool, wpt.x / W(), wpt.y / H(), loc);
    }

    function crear(tool, nx, ny, loc) {
      apuntar();
      var it = M.makeItem(tool, U.clamp(nx, .02, .98), U.clamp(ny, .02, .98), st.color, { items: st.items });
      st.items.push(it);
      st.sel = it.id;

      if (M.esDosPuntas(it)) {
        /* Flechas y zonas se dibujan estirando el segundo extremo. */
        gesto = { modo: "p2", it: it, inicio: loc, movido: true, offx: 0, offy: 0 };
      } else {
        gesto = null;
      }
      paint(); notify();

      if (it.tipo === "Texto" && opts.onEditText) {
        setTimeout(function () { opts.onEditText(it); }, 30);
      }
    }

    function onMove(e) {
      if (punteros.has(e.pointerId)) punteros.set(e.pointerId, localPos(e));

      if (pellizco && punteros.size >= 2) {
        var p = Array.from(punteros.values());
        var d = Math.hypot(p[0].x - p[1].x, p[0].y - p[1].y) || 1;
        var cx = (p[0].x + p[1].x) / 2, cy = (p[0].y + p[1].y) / 2;
        var k = U.clamp(pellizco.k * (d / pellizco.d), 1, ZOOM_MAX);
        /* El punto entre los dos dedos se queda quieto bajo ellos. */
        st.view.k = k;
        st.view.tx = cx - (pellizco.cx - pellizco.tx) * (k / pellizco.k);
        st.view.ty = cy - (pellizco.cy - pellizco.ty) * (k / pellizco.k);
        clampView();
        paint();
        return;
      }

      if (!gesto) return;
      var loc = localPos(e);

      /* Holgura: hasta que no se recorren unos píxeles no se mueve nada,
         de modo que seleccionar con el dedo no desplaza la pieza. */
      if (!gesto.movido) {
        if (Math.hypot(loc.x - gesto.inicio.x, loc.y - gesto.inicio.y) < UMBRAL_ARRASTRE) return;
        gesto.movido = true;
      }

      var wpt = toWorld(loc.x, loc.y);
      var it = gesto.it;
      var w = W(), h = H();

      if (gesto.modo === "rotate") {
        /* SOLO ángulo. Ni x ni y se tocan en esta rama. */
        var ang = Math.atan2(wpt.y - it.y * h, wpt.x - it.x * w);
        var grados = (ang - gesto.ang0) * 180 / Math.PI + gesto.rot0;
        grados = ((grados % 360) + 360) % 360;
        var cerca = Math.round(grados / SNAP_GRADOS) * SNAP_GRADOS;
        if (Math.abs(grados - cerca) < SNAP_TOLERANCIA) grados = (cerca + 360) % 360;
        it.rot = Math.round(grados);
        showPill(it.rot + "°", it.x * w, it.y * h);
        paint();
        return;
      }

      var nx = U.clamp(wpt.x / w, .01, .99);
      var ny = U.clamp(wpt.y / h, .01, .99);

      if (gesto.modo === "p1") { it.x = nx; it.y = ny; }
      else if (gesto.modo === "p2") { it.x2 = nx; it.y2 = ny; }
      else if (M.esDosPuntas(it)) {
        var dx = nx - gesto.offx - it.x, dy = ny - gesto.offy - it.y;
        it.x += dx; it.y += dy; it.x2 += dx; it.y2 += dy;
      } else {
        /* SOLO posición. La rotación se conserva intacta. */
        it.x = U.clamp(nx - gesto.offx, .01, .99);
        it.y = U.clamp(ny - gesto.offy, .01, .99);
      }
      paint();
    }

    function onUp(e) {
      punteros.delete(e.pointerId);
      if (punteros.size < 2) pellizco = null;
      if (gesto) {
        cerrarPendiente();
        gesto = null;
        hidePill();
        paint();
        notify();
      }
    }

    /* ---------------------------------------------------------
       Operaciones sobre la selección
       --------------------------------------------------------- */
    function rotar(delta) {
      var it = selected();
      if (!it) { U.toast("Toca antes una pieza"); return; }
      if (M.esDosPuntas(it)) { U.toast("Las flechas se orientan arrastrando su punta"); return; }
      apuntar();
      it.rot = ((((it.rot || 0) + delta) % 360) + 360) % 360;
      paint();
      U.toast(it.rot + "°");
    }

    function enderezar() {
      var it = selected();
      if (!it || M.esDosPuntas(it)) return;
      apuntar();
      it.rot = 0;
      paint();
    }

    function duplicar() {
      var it = selected();
      if (!it) { U.toast("Toca antes una pieza"); return; }
      apuntar();
      var copia = JSON.parse(JSON.stringify(it));
      copia.id = U.uid();
      copia.x = U.clamp(copia.x + 0.04, .02, .98);
      copia.y = U.clamp(copia.y + 0.04, .02, .98);
      if (M.esDosPuntas(copia)) {
        copia.x2 = U.clamp(copia.x2 + 0.04, .02, .98);
        copia.y2 = U.clamp(copia.y2 + 0.04, .02, .98);
      }
      st.items.push(copia);
      st.sel = copia.id;
      paint(); notify();
    }

    function borrar() {
      var it = selected();
      if (!it) { U.toast("Toca antes una pieza"); return; }
      apuntar();
      st.items = st.items.filter(function (i) { return i.id !== it.id; });
      st.sel = null;
      paint(); notify();
    }

    function vaciar() {
      if (!st.items.length) return;
      apuntar();
      st.items = [];
      st.sel = null;
      paint(); notify();
    }

    function cargar(items, modo) {
      st.items = (items || []).map(function (i) {
        return window.CB.store.fixItem(JSON.parse(JSON.stringify(i)));
      });
      if (modo) st.modo = modo;
      st.sel = null;
      st.historial = [];
      resetView();
      paint(); notify();
    }

    function resetView() { st.view = { k: 1, tx: 0, ty: 0 }; }

    function zoom(factor) {
      var w = W(), h = H();
      var cx = w / 2, cy = h / 2;
      var k0 = st.view.k;
      st.view.k = U.clamp(k0 * factor, 1, ZOOM_MAX);
      st.view.tx = cx - (cx - st.view.tx) * (st.view.k / k0);
      st.view.ty = cy - (cy - st.view.ty) * (st.view.k / k0);
      clampView();
      paint();
    }

    canvas.addEventListener("pointerdown", onDown);
    canvas.addEventListener("pointermove", onMove);
    canvas.addEventListener("pointerup", onUp);
    canvas.addEventListener("pointercancel", onUp);
    canvas.addEventListener("contextmenu", function (e) { e.preventDefault(); });

    return {
      state: st,
      fit: fit,
      paint: paint,
      setTool: function (t) { st.tool = t; if (t !== "Mover") { st.sel = null; paint(); } },
      setColor: function (c) { st.color = c; },
      setMode: function (m) { st.modo = m; paint(); },
      getMode: function () { return st.modo; },
      getItems: function () { return st.items; },
      selected: selected,
      rotar: rotar, enderezar: enderezar, duplicar: duplicar,
      borrar: borrar, vaciar: vaciar, undo: undo, puedeDeshacer: puedeDeshacer,
      cargar: cargar, zoom: zoom, resetView: resetView,
      repaintSel: function () { paint(); }
    };
  }

  window.CB.scene = { create: create };
})();

</script>
<script>
/* ===== js/ui/shell.js ===== */
/* =============================================================
   CoachBoard · ui/shell.js
   Navegación, hojas modales y armazón de pantallas.
   ============================================================= */
(function () {
  "use strict";
  var U = window.CB.util;

  /* Orden de las pantallas. `nav` marca las que van en la barra
     inferior del teléfono; el resto vive dentro de "Más". */
  var VIEWS = [
    { id: "home",   label: "Inicio",    title: "CoachBoard",   icon: "home",       nav: true },
    { id: "squad",  label: "Plantilla", title: "Plantilla",    icon: "squad",      nav: true },
    { id: "match",  label: "Partido",   title: "Partido",      icon: "match",      nav: true },
    { id: "board",  label: "Entrenos",  title: "Entrenamientos", icon: "drills",   nav: true },
    { id: "agenda", label: "Calendario", title: "Calendario",  icon: "calendar" },
    { id: "att",    label: "Asistencia", title: "Asistencia",  icon: "attendance" },
    { id: "tac",    label: "Tácticas",  title: "Tácticas",     icon: "tactics" }
  ];

  var hooks = {};
  var actual = "home";

  function view(id) {
    return VIEWS.filter(function (v) { return v.id === id; })[0];
  }

  function onEnter(id, fn) {
    hooks[id] = (hooks[id] || []).concat(fn);
  }

  /* ---------------------------------------------------------
     Navegación
     --------------------------------------------------------- */
  function buildNav() {
    var nav = U.$("nav");
    var items = VIEWS.filter(function (v) { return v.nav; });
    nav.innerHTML = items.map(function (v) {
      return '<button data-v="' + v.id + '" aria-label="' + v.label + '">' +
        U.svg(v.icon) + v.label + '<span class="pip"></span></button>';
    }).join("") +
      '<button data-v="__more" aria-label="Más">' + U.svg("more") + 'Más<span class="pip"></span></button>';

    nav.querySelectorAll("button").forEach(function (b) {
      b.onclick = function () {
        if (b.dataset.v === "__more") openMore();
        else go(b.dataset.v);
      };
    });

    var rail = U.$("rail");
    rail.innerHTML = '<div class="logo">' + U.svg("drills") + '</div>' +
      VIEWS.map(function (v) {
        return '<button data-v="' + v.id + '" aria-label="' + v.label + '">' +
          U.svg(v.icon) + v.label + '</button>';
      }).join("") +
      '<div class="spacer"></div>' +
      '<button data-v="__settings" aria-label="Ajustes">' + U.svg("settings") + 'Ajustes</button>';

    rail.querySelectorAll("button").forEach(function (b) {
      b.onclick = function () {
        if (b.dataset.v === "__settings") window.CB.settings.open();
        else go(b.dataset.v);
      };
    });
  }

  function markNav(id) {
    var enBarra = VIEWS.filter(function (v) { return v.nav; })
      .some(function (v) { return v.id === id; });
    document.querySelectorAll("#nav button").forEach(function (b) {
      b.classList.toggle("on", b.dataset.v === id || (!enBarra && b.dataset.v === "__more"));
    });
    document.querySelectorAll("#rail button").forEach(function (b) {
      b.classList.toggle("on", b.dataset.v === id);
    });
  }

  function go(id) {
    var v = view(id);
    if (!v) return;
    actual = id;
    VIEWS.forEach(function (x) {
      var el = U.$("v-" + x.id);
      if (el) el.classList.toggle("on", x.id === id);
    });
    markNav(id);
    U.txt("topTitle", v.title);
    U.txt("topSub", id === "home" ? (window.CB.store.club()) : (window.CB.store.club()));
    window.scrollTo(0, 0);
    (hooks[id] || []).forEach(function (fn) { fn(); });
  }

  function openMore() {
    var extra = VIEWS.filter(function (v) { return !v.nav; });
    var html = '<div class="plist">' + extra.map(function (v) {
      return '<button class="prow" style="width:100%;text-align:left" onclick="CB.shell.goFromSheet(\'' + v.id + '\')">' +
        '<span class="num-badge">' + U.svg(v.icon) + '</span>' +
        '<span class="pmain"><span class="nm">' + v.label + '</span></span>' +
        '<span class="pend">' + U.svg("chev") + '</span></button>';
    }).join("") +
      '<button class="prow" style="width:100%;text-align:left" onclick="CB.shell.closeSheet();CB.settings.open()">' +
      '<span class="num-badge">' + U.svg("settings") + '</span>' +
      '<span class="pmain"><span class="nm">Ajustes</span>' +
      '<span class="sub">Equipo, copias de seguridad y ayuda</span></span>' +
      '<span class="pend">' + U.svg("chev") + '</span></button></div>';
    openSheet("Más", html, [{ text: "Cerrar", cls: "ghost", fn: closeSheet }]);
  }

  function goFromSheet(id) { closeSheet(); go(id); }

  /* ---------------------------------------------------------
     Hoja modal
     --------------------------------------------------------- */
  function openSheet(title, bodyHtml, buttons) {
    U.txt("sheetTitle", title);
    U.set("sheetBody", bodyHtml);
    var f = U.$("sheetFoot");
    f.innerHTML = "";
    (buttons || []).forEach(function (b) {
      var el = document.createElement("button");
      el.className = "btn " + (b.cls || "");
      el.textContent = b.text;
      el.onclick = b.fn;
      f.appendChild(el);
    });
    U.$("sheet").classList.remove("hidden");
  }

  function closeSheet() {
    U.$("sheet").classList.add("hidden");
  }

  /* Confirmación con el diálogo nativo que aporta el contenedor. */
  function confirmar(msg) { return window.confirm(msg); }

  function init() {
    buildNav();
    U.$("sheet").addEventListener("click", function (e) {
      if (e.target.id === "sheet") closeSheet();
    });
    U.$("btnSettings").onclick = function () { window.CB.settings.open(); };
    go("home");
  }

  window.CB.shell = {
    VIEWS: VIEWS, init: init, go: go, goFromSheet: goFromSheet,
    openSheet: openSheet, closeSheet: closeSheet, onEnter: onEnter,
    confirmar: confirmar, current: function () { return actual; }
  };

  window.openSheet = openSheet;
  window.closeSheet = closeSheet;
})();

</script>
<script>
/* ===== js/ui/wheel.js ===== */
/* =============================================================
   CoachBoard · ui/wheel.js
   Ruedas de selección como las del cronómetro del móvil: columnas
   que se arrastran con el dedo y encajan en el valor del centro.

   No lleva lógica de arrastre propia: es un contenedor con scroll
   vertical y `scroll-snap-type`, así que el desplazamiento y su
   inercia los pone el propio navegador. Eso es lo que hace que se
   sienta nativo en el móvil y que funcione igual con el ratón.
   ============================================================= */
(function () {
  "use strict";
  var U = window.CB.util;
  var M = window.CB.models;

  var ALTO = 38;          // alto de cada opción, en píxeles
  var VISIBLES = 5;       // opciones a la vista (impar: hay una centrada)
  var estado = null;      // { cols: {clave: [valores]}, onOk: fn }

  function rango(desde, hasta, paso) {
    var a = [];
    for (var v = desde; v <= hasta; v += (paso || 1)) a.push(v);
    return a;
  }

  /* Una columna. El relleno de arriba y abajo permite que la primera
     y la última opción lleguen al centro. */
  function columna(clave, valores, actual, titulo, sufijo) {
    var pad = ((VISIBLES - 1) / 2) * ALTO;
    var i = valores.indexOf(actual);
    if (i < 0) i = 0;
    return '<div class="wcol">' +
      '<div class="wlab">' + U.esc(titulo) + '</div>' +
      '<div class="wbox">' +
        '<div class="wsel"></div>' +
        '<div class="wheel" id="w-' + clave + '" data-clave="' + clave + '" data-i="' + i + '">' +
          '<div class="wpad" style="height:' + pad + 'px"></div>' +
          valores.map(function (v, k) {
            return '<div class="wop' + (k === i ? " on" : "") + '" data-k="' + k + '">' +
              v + (sufijo ? '<small>' + U.esc(sufijo) + '</small>' : "") + '</div>';
          }).join("") +
          '<div class="wpad" style="height:' + pad + 'px"></div>' +
        '</div>' +
      '</div></div>';
  }

  function conectar() {
    Object.keys(estado.cols).forEach(function (clave) {
      var el = U.$("w-" + clave);
      if (!el) return;
      el.scrollTop = parseInt(el.getAttribute("data-i"), 10) * ALTO;
      marcar(el);
      el.addEventListener("scroll", function () {
        clearTimeout(el._t);
        marcar(el);
        el._t = setTimeout(function () { marcar(el); }, 80);
      });
      /* Tocar una opción también la elige: más rápido que arrastrar
         cuando el valor está a la vista. */
      el.addEventListener("click", function (ev) {
        var op = ev.target.closest ? ev.target.closest(".wop") : null;
        if (!op) return;
        el.scrollTo({ top: parseInt(op.getAttribute("data-k"), 10) * ALTO, behavior: "smooth" });
      });
    });
  }

  function indice(el) {
    var i = Math.round(el.scrollTop / ALTO);
    var n = el.querySelectorAll(".wop").length;
    return Math.min(n - 1, Math.max(0, i));
  }

  function marcar(el) {
    var i = indice(el);
    if (String(i) === el.getAttribute("data-i")) return;
    el.setAttribute("data-i", i);
    var ops = el.querySelectorAll(".wop");
    for (var k = 0; k < ops.length; k++) ops[k].className = "wop" + (k === i ? " on" : "");
  }

  function leer() {
    var out = {};
    Object.keys(estado.cols).forEach(function (clave) {
      var el = U.$("w-" + clave);
      out[clave] = el ? estado.cols[clave][indice(el)] : estado.cols[clave][0];
    });
    return out;
  }

  /* ---------------------------------------------------------
     Duración de un partido
     --------------------------------------------------------- */
  function pedirDuracion(dur, onOk) {
    var d = M.normDur(dur);
    estado = {
      cols: { partes: rango(1, 6), min: rango(1, 60), desc: rango(0, 30) },
      onOk: onOk
    };

    var atajos = '<div class="chiprow mb2">' + M.FORMATOS.map(function (f, i) {
      return '<button class="chip" onclick="CB.wheel.formato(' + i + ')">' +
        U.esc(f.label) + '</button>';
    }).join("") + '</div>';

    var cuerpo = atajos +
      '<div class="wrow">' +
        columna("partes", estado.cols.partes, d.partes, "Partes", "") +
        columna("min", estado.cols.min, d.min, "Minutos", "min") +
        columna("desc", estado.cols.desc, d.desc, "Descanso", "min") +
      '</div>' +
      '<p class="hint mt2">Las prórrogas duran ' + d.prorroga + ' min cada una. ' +
        'El reloj cuenta seguido: la 2ª parte arranca en el minuto que le toque, no en cero.</p>';

    estado.prorroga = d.prorroga;

    window.CB.shell.openSheet("Duración del partido", cuerpo, [
      { text: "Cancelar", cls: "ghost", fn: function () { estado = null; window.CB.shell.closeSheet(); } },
      { text: "Aceptar", cls: "pri", fn: aceptar }
    ]);
    conectar();
  }

  /* Un atajo mueve las ruedas; no cierra la hoja, para poder retocar. */
  function formato(i) {
    var f = M.FORMATOS[i];
    if (!f || !estado) return;
    estado.prorroga = f.prorroga;
    [["partes", f.partes], ["min", f.min], ["desc", f.desc]].forEach(function (par) {
      var el = U.$("w-" + par[0]);
      if (!el) return;
      var k = estado.cols[par[0]].indexOf(par[1]);
      if (k < 0) return;
      el.scrollTo({ top: k * ALTO, behavior: "smooth" });
      setTimeout(function () { marcar(el); }, 260);
    });
    U.toast(f.label);
  }

  function aceptar() {
    var v = leer();
    var fn = estado ? estado.onOk : null;
    var pro = estado ? estado.prorroga : M.DUR_DEF.prorroga;
    estado = null;
    window.CB.shell.closeSheet();
    if (fn) fn(M.normDur({ partes: v.partes, min: v.min, desc: v.desc, prorroga: pro }));
  }

  window.CB.wheel = { pedirDuracion: pedirDuracion, formato: formato };
})();

</script>
<script>
/* ===== js/features/dashboard.js ===== */
/* =============================================================
   CoachBoard · features/dashboard.js
   Pantalla de inicio: lo que el entrenador tiene por delante.
   ============================================================= */
(function () {
  "use strict";
  var U = window.CB.util;
  var S = window.CB.store;

  function proximoPartido() {
    return S.nextEvents(function (e) { return S.isMatch(e); })[0] || null;
  }
  function proximaSesion() {
    return S.nextEvents(function (e) { return e.tipo === "Entrenamiento"; })[0] || null;
  }

  function render() {
    var db = window.DB;
    var club = S.club();
    var pm = proximoPartido();
    var ps = proximaSesion();
    var entrenos = S.nextEvents(function (e) { return e.tipo === "Entrenamiento"; }).length;
    var partidos = S.nextEvents(function (e) { return S.isMatch(e); }).length;
    var asis = S.squadAttendance();
    var lesionados = db.jugadores.filter(function (j) { return j.estado === "Lesionado"; }).length;

    var h = "";

    /* --- próximo partido --- */
    h += '<div class="section"><span class="eyebrow">Próximo partido</span>' +
         (pm ? '<button class="link" onclick="CB.shell.go(\'agenda\')">Calendario</button>' : "") +
         '</div>';

    if (pm) {
      var local = pm.cond !== "Visitante";
      var izq = local ? club : (pm.rival || "Rival");
      var der = local ? (pm.rival || "Rival") : club;
      h += '<div class="hero">' +
        '<div class="when"><span class="badge ok"><span class="dot"></span>' +
          U.esc(pm.comp || pm.tipo) + '</span>' +
          '<span class="eyebrow">' + U.esc(pm.cond || "") + '</span></div>' +
        '<div class="versus">' +
          '<div class="team a">' + U.esc(izq) + '</div>' +
          '<div class="vs">VS</div>' +
          '<div class="team">' + U.esc(der) + '</div>' +
        '</div>' +
        '<div class="meta">' +
          '<div>Cuándo<b>' + U.esc(U.dayLabel(pm.fecha)) + ' · ' + U.esc(pm.hora || "") + '</b></div>' +
          (pm.lugar ? '<div>Dónde<b>' + U.esc(pm.lugar) + '</b></div>' : "") +
        '</div>' +
        '<button class="btn pri wide mt3" onclick="CB.dashboard.prepararPartido(\'' + pm.id + '\')">' +
          U.svg("whistle") + 'Preparar partido</button>' +
        '</div>';
    } else {
      h += '<div class="empty"><b>Sin partidos programados</b>' +
        'Añade el próximo encuentro y lo tendrás aquí.' +
        '<div class="mt3"><button class="btn sm pri" onclick="CB.agenda.editar(null,\'Partido\')">' +
        U.svg("plus") + 'Programar partido</button></div></div>';
    }

    /* --- indicadores --- */
    h += '<div class="section"><span class="eyebrow">De un vistazo</span></div>';
    h += '<div class="grid-4r stagger">' +
      kpi(db.jugadores.length, "Jugadores", "") +
      kpi(asis === null ? "—" : asis + "%", "Asistencia", asis !== null && asis >= 85 ? "accent" : "") +
      kpi(entrenos, "Entrenos", "") +
      kpi(partidos, "Partidos", "") +
      '</div>';

    if (lesionados) {
      h += '<div class="card mt1" style="border-color:rgba(245,185,66,.3)">' +
        '<div class="row-x"><span class="badge warn">' + lesionados + '</span>' +
        '<span style="font-size:13.5px">' +
        (lesionados === 1 ? "Un jugador lesionado" : lesionados + " jugadores lesionados") +
        '</span><span class="spacer"></span>' +
        '<button class="btn sm ghost" onclick="CB.shell.go(\'squad\')">Ver</button></div></div>';
    }

    /* --- próxima sesión --- */
    h += '<div class="section"><span class="eyebrow">Próxima sesión</span></div>';
    if (ps) {
      h += '<div class="card lead">' +
        '<div class="row-x"><div class="pmain">' +
          '<div class="nm" style="font-size:15.5px">' + U.esc(ps.tipo) + '</div>' +
          '<div class="sub">' + U.esc(U.dayLabel(ps.fecha)) + ' · ' + U.esc(ps.hora || "") +
            (ps.lugar ? " · " + U.esc(ps.lugar) : "") + '</div>' +
        '</div></div>' +
        (ps.notas ? '<p class="hint" style="margin-top:10px">' + U.esc(ps.notas) + '</p>' : "") +
        '<div class="grid-2 mt2">' +
          '<button class="btn sm" onclick="CB.dashboard.verSesion(\'' + ps.id + '\')">Ver sesión</button>' +
          '<button class="btn sm pri" onclick="CB.attendance.abrir(\'' + ps.id + '\')">Pasar lista</button>' +
        '</div></div>';
    } else {
      h += '<div class="empty"><b>Sin entrenamientos previstos</b>' +
        'Programa la semana para tenerla controlada.' +
        '<div class="mt3"><button class="btn sm" onclick="CB.agenda.editar(null,\'Entrenamiento\')">' +
        U.svg("plus") + 'Programar entrenamiento</button></div></div>';
    }

    /* --- accesos --- */
    h += '<div class="section"><span class="eyebrow">Atajos</span></div>';
    h += '<div class="grid-2">' +
      '<button class="btn" onclick="CB.shell.go(\'board\')">' + U.svg("drills") + 'Pizarra</button>' +
      '<button class="btn" onclick="CB.shell.go(\'tac\')">' + U.svg("tactics") + 'Tácticas</button>' +
      '</div>';

    if (!db.jugadores.length) {
      h += '<div class="empty mt3"><b>Empieza por la plantilla</b>' +
        'Sin jugadores no hay convocatorias ni estadísticas.' +
        '<div class="mt3 grid-2">' +
        '<button class="btn sm pri" onclick="CB.squad.editar(null)">Fichar jugador</button>' +
        '<button class="btn sm" onclick="CB.squad.demo()">Plantilla de ejemplo</button>' +
        '</div></div>';
    }

    U.set("homeBody", h);
  }

  function kpi(v, k, cls) {
    return '<div class="kpi ' + (cls || "") + '"><div class="v">' + v + '</div><div class="k">' + k + '</div></div>';
  }

  function prepararPartido(evId) {
    window.CB.shell.go("match");
    window.CB.match.seleccionar(evId);
  }

  function verSesion(id) {
    var e = S.ev(id);
    if (!e) return;
    var body = '<div class="dl"><span>Tipo</span><b>' + U.esc(e.tipo) + '</b></div>' +
      '<div class="dl"><span>Fecha</span><b>' + U.esc(U.fmtDateLong(e.fecha)) + '</b></div>' +
      '<div class="dl"><span>Hora</span><b>' + U.esc(e.hora || "—") + '</b></div>' +
      (e.lugar ? '<div class="dl"><span>Lugar</span><b>' + U.esc(e.lugar) + '</b></div>' : "") +
      (e.lat ? '<button class="btn sm wide mt2" onclick="CB.agenda.mapaDe(\'' + e.id + '\')">' +
        U.svg("pin") + 'Cómo llegar</button>' : "") +
      (e.notas ? '<p class="hint mt2">' + U.esc(e.notas) + '</p>' : "");
    window.CB.shell.openSheet(U.esc(e.tipo), body, [
      { text: "Editar", cls: "ghost", fn: function () { window.CB.shell.closeSheet(); window.CB.agenda.editar(id); } },
      { text: "Pasar lista", cls: "pri", fn: function () { window.CB.attendance.abrir(id); } }
    ]);
  }

  window.CB.dashboard = { render: render, prepararPartido: prepararPartido, verSesion: verSesion };
})();

</script>
<script>
/* ===== js/features/squad.js ===== */
/* =============================================================
   CoachBoard · features/squad.js
   Plantilla: tarjetas de jugador, ficha y alta/edición.
   ============================================================= */
(function () {
  "use strict";
  var U = window.CB.util;
  var S = window.CB.store;
  var M = window.CB.models;

  var orden = "dorsal";
  var filtro = "todos";

  function badgeEstado(j) {
    if (j.estado === "Lesionado") return '<span class="badge bad">Lesionado</span>';
    if (j.estado === "Sancionado") return '<span class="badge warn">Sancionado</span>';
    if (j.estado === "Baja") return '<span class="badge">Baja</span>';
    return '<span class="badge ok">Disponible</span>';
  }

  function lista() {
    var arr = window.DB.jugadores.slice();
    if (filtro === "disponibles") arr = arr.filter(function (j) { return j.estado === "Disponible"; });
    if (filtro === "lesionados") arr = arr.filter(function (j) { return j.estado === "Lesionado"; });
    arr.sort(function (a, b) {
      if (orden === "nombre") return String(a.nombre).localeCompare(String(b.nombre));
      if (orden === "asistencia") {
        var pa = S.attPct(a.id), pb = S.attPct(b.id);
        return (pb ? pb.pct : -1) - (pa ? pa.pct : -1);
      }
      return (a.dorsal || 99) - (b.dorsal || 99);
    });
    return arr;
  }

  function render() {
    var db = window.DB;
    var arr = lista();
    var asis = S.squadAttendance();

    var head = '<div class="grid-3 stagger">' +
      '<div class="kpi"><div class="v">' + db.jugadores.length + '</div><div class="k">Jugadores</div></div>' +
      '<div class="kpi ' + (asis !== null && asis >= 85 ? "accent" : "") + '"><div class="v">' +
        (asis === null ? "—" : asis + "%") + '</div><div class="k">Asistencia</div></div>' +
      '<div class="kpi ' + (db.jugadores.filter(function (j) { return j.estado !== "Disponible"; }).length ? "warnv" : "") +
        '"><div class="v">' + db.jugadores.filter(function (j) { return j.estado !== "Disponible"; }).length +
        '</div><div class="k">Bajas</div></div></div>';

    var chips = '<div class="chiprow mt2">' +
      chip("todos", "Todos") + chip("disponibles", "Disponibles") + chip("lesionados", "Lesionados") +
      '<button class="chip fin" onclick="CB.squad.ordenar()">' + U.svg("sort") +
        '<span>' + etiquetaOrden() + '</span></button>' +
      '</div>';

    var cuerpo;
    if (!db.jugadores.length) {
      cuerpo = '<div class="empty mt3"><b>Todavía no hay jugadores</b>' +
        'Da de alta a tu plantilla o carga una de ejemplo para probar.' +
        '<div class="mt3 grid-2">' +
        '<button class="btn sm pri" onclick="CB.squad.editar(null)">Fichar jugador</button>' +
        '<button class="btn sm" onclick="CB.squad.demo()">Cargar ejemplo</button></div></div>';
    } else if (!arr.length) {
      cuerpo = '<div class="empty mt3"><b>Nadie en este filtro</b>Prueba con "Todos".</div>';
    } else {
      cuerpo = '<div class="plist mt2 stagger">' + arr.map(fila).join("") + '</div>';
    }

    U.set("squadBody", head + chips + cuerpo);
  }

  function chip(id, label) {
    return '<button class="chip ' + (filtro === id ? "on" : "") +
      '" onclick="CB.squad.filtrar(\'' + id + '\')">' + label + '</button>';
  }
  function etiquetaOrden() {
    return orden === "dorsal" ? "Dorsal" : orden === "nombre" ? "Nombre" : "Asistencia";
  }

  function fila(j) {
    var a = S.attPct(j.id);
    var st = window.CB.stats.player(j.id);
    var sub = (M.POS_LARGO[j.pos] || j.pos || "") + " · " + (j.pie || "");
    return '<div class="prow tap" onclick="CB.squad.abrir(\'' + j.id + '\')">' +
      '<span class="num-badge">' + (j.dorsal || "–") + '</span>' +
      '<div class="pmain">' +
        '<div class="nm">' + U.esc(j.nombre) + '</div>' +
        '<div class="sub">' + U.esc(sub) + '</div>' +
      '</div>' +
      '<div class="pend">' +
        '<div class="big">' + (a ? a.pct + "%" : "—") + '</div>' +
        '<div class="small">' + (st.pj ? st.g + "G " + st.a + "A" : "asistencia") + '</div>' +
      '</div></div>';
  }

  function filtrar(f) { filtro = f; render(); }
  function ordenar() {
    orden = orden === "dorsal" ? "nombre" : orden === "nombre" ? "asistencia" : "dorsal";
    render();
    U.toast("Ordenado por " + etiquetaOrden().toLowerCase());
  }

  /* ---------------------------------------------------------
     Ficha del jugador
     --------------------------------------------------------- */
  function abrir(id) {
    var s = window.CB.stats.player(id);
    var j = s.j;

    var barras = window.CB.stats.tiposOrdenados(s.tipos).map(function (t) {
      var n = s.tipos[t], pct = Math.round(100 * n / s.g);
      return '<div class="mt2"><div class="row-x" style="justify-content:space-between;font-size:12.5px">' +
        '<span>' + U.esc(t) + '</span><b class="num">' + n + '</b></div>' +
        '<div class="bar"><i style="width:' + pct + '%"></i></div></div>';
    }).join("") || '<p class="hint">Todavía no ha marcado.</p>';

    var ultimos = s.partidos.slice(0, 6).map(function (p) {
      return '<div class="prow" style="padding:8px 10px">' +
        '<div class="pmain"><div class="nm" style="font-size:13.5px">' +
          U.esc(p.rival || "Partido") + ' · ' + p.res + '</div>' +
        '<div class="sub">' + U.esc(U.fmtDate(p.fecha)) + ' · ' + p.rol + '</div></div>' +
        '<div class="pend"><div class="big">' + p.min + "'" + '</div>' +
        '<div class="small">' + p.gol + "G " + p.asi + "A" + '</div></div></div>';
    }).join("") || '<p class="hint">Sin partidos con acta cerrada.</p>';

    var body =
      '<div class="row-x" style="gap:12px;margin-bottom:12px">' +
        '<span class="num-badge" style="width:48px;height:48px;font-size:18px">' + (j.dorsal || "–") + '</span>' +
        '<div class="pmain"><div class="nm" style="font-size:17px">' + U.esc(j.nombre) + '</div>' +
        '<div class="sub">' + U.esc(M.POS_LARGO[j.pos] || j.pos || "") + ' · ' + U.esc(j.pie || "") + '</div></div>' +
        badgeEstado(j) +
      '</div>' +
      '<div class="grid-4r">' +
        tile(s.pj, "Partidos") + tile(s.min + "'", "Minutos") +
        tile(s.g, "Goles") + tile(s.a, "Asist.") +
      '</div>' +
      '<div class="section"><span class="eyebrow">Rendimiento</span></div>' +
      dl("Convocatorias", s.conv) +
      dl("Titular / suplente", s.tit + " / " + (s.conv - s.tit)) +
      dl("Media por partido", s.media + "'") +
      dl("Marca un gol cada", s.minGol ? s.minGol + "'" : "—") +
      dl("Gol o asistencia cada", s.minPart ? s.minPart + "'" : "—") +
      dl("Faltas cometidas", s.fal + " (" + s.falPart + " por partido)") +
      dl("Una falta cada", s.minFal ? s.minFal + "'" : "—") +
      dl("Amarillas / rojas", s.ta + " / " + s.tr) +
      dl("Asistencia a entrenos", s.att ? s.att.pct + "% (" + s.att.p + "/" + s.att.t + ")" : "—") +
      '<div class="section"><span class="eyebrow">De dónde vienen sus goles</span></div>' + barras +
      '<div class="section"><span class="eyebrow">Últimos partidos</span></div>' +
      '<div class="plist">' + ultimos + '</div>' +
      (j.notas ? '<div class="section"><span class="eyebrow">Notas del entrenador</span></div>' +
        '<p class="hint" style="color:var(--text)">' + U.esc(j.notas) + '</p>' : "") +
      (j.tel ? dl("Contacto", U.esc(j.tel)) : "");

    window.CB.shell.openSheet("Ficha del jugador", body, [
      { text: "Editar", cls: "ghost", fn: function () { window.CB.shell.closeSheet(); editar(id); } },
      { text: "Ficha PDF", cls: "pri", fn: function () { window.CB.reports.fichaPdf(id); } }
    ]);
  }

  function tile(v, k) {
    return '<div class="kpi flat"><div class="v">' + v + '</div><div class="k">' + k + '</div></div>';
  }
  function dl(k, v) {
    return '<div class="dl"><span>' + k + '</span><b>' + v + '</b></div>';
  }

  /* ---------------------------------------------------------
     Alta y edición
     --------------------------------------------------------- */
  function editar(id) {
    var j = id ? S.jug(id) : {
      dorsal: "", nombre: "", pos: "MC", pie: "Diestro",
      estado: "Disponible", tel: "", notas: "", fechaNac: ""
    };
    if (!j) return;

    var body =
      '<div class="grid-2">' +
        '<div><label class="f">Dorsal</label><input id="pDor" inputmode="numeric" value="' + U.esc(j.dorsal) + '"></div>' +
        '<div><label class="f">Posición</label><select id="pPos">' +
          M.POS.map(function (p) {
            return '<option ' + (p === j.pos ? "selected" : "") + ' value="' + p + '">' + p + ' · ' + M.POS_LARGO[p] + '</option>';
          }).join("") + '</select></div>' +
      '</div>' +
      '<label class="f">Nombre</label><input id="pNom" value="' + U.esc(j.nombre) + '" placeholder="Nombre y apellidos">' +
      '<div class="grid-2">' +
        '<div><label class="f">Pie</label><select id="pPie">' +
          M.PIES.map(function (p) { return '<option ' + (p === j.pie ? "selected" : "") + '>' + p + '</option>'; }).join("") +
        '</select></div>' +
        '<div><label class="f">Disponibilidad</label><select id="pEst">' +
          M.ESTADOS.map(function (p) { return '<option ' + (p === j.estado ? "selected" : "") + '>' + p + '</option>'; }).join("") +
        '</select></div>' +
      '</div>' +
      '<div class="grid-2">' +
        '<div><label class="f">Nacimiento</label><input type="date" id="pNac" value="' + U.esc(j.fechaNac || "") + '"></div>' +
        '<div><label class="f">Contacto</label><input id="pTel" value="' + U.esc(j.tel) + '" placeholder="Teléfono"></div>' +
      '</div>' +
      '<label class="f">Notas del entrenador</label><textarea id="pNot">' + U.esc(j.notas) + '</textarea>';

    var botones = [];
    if (id) {
      botones.push({
        text: "Dar de baja", cls: "ghost", fn: function () {
          if (!window.CB.shell.confirmar("¿Borrar la ficha de " + j.nombre + "?")) return;
          window.DB.jugadores = window.DB.jugadores.filter(function (x) { return x.id !== id; });
          S.save();
          window.CB.shell.closeSheet();
          window.CB.app.renderAll();
          U.toast("Jugador dado de baja");
        }
      });
    } else {
      botones.push({ text: "Cancelar", cls: "ghost", fn: window.CB.shell.closeSheet });
    }
    botones.push({
      text: "Guardar", cls: "pri", fn: function () {
        var n = U.val("pNom").trim();
        if (!n) { U.toast("Escribe el nombre"); return; }
        var o = {
          id: id || U.uid(),
          dorsal: parseInt(U.val("pDor"), 10) || 0,
          nombre: n,
          pos: U.val("pPos"),
          pie: U.val("pPie"),
          estado: U.val("pEst"),
          fechaNac: U.val("pNac"),
          tel: U.val("pTel").trim(),
          notas: U.val("pNot")
        };
        if (id) {
          window.DB.jugadores = window.DB.jugadores.map(function (x) { return x.id === id ? o : x; });
        } else {
          window.DB.jugadores.push(o);
        }
        S.save();
        window.CB.shell.closeSheet();
        window.CB.app.renderAll();
        U.toast(id ? "Ficha actualizada" : "Jugador fichado");
      }
    });

    window.CB.shell.openSheet(id ? "Editar ficha" : "Nuevo jugador", body, botones);
  }

  function demo() {
    var datos = [
      [1, "Álvaro Ruiz", "POR"], [13, "Nico Serra", "POR"], [2, "Hugo Marín", "LTD"],
      [3, "Pablo Cuesta", "LTI"], [4, "Iván Solano", "DFC"], [5, "Marc Delgado", "DFC"],
      [12, "Adrià Bosch", "DFC"], [15, "Leo Ferrer", "LTI"], [6, "Dani Arana", "MCD"],
      [8, "Sergio Pinto", "MC"], [14, "Aitor Vega", "MC"], [10, "Bruno Salas", "MCO"],
      [16, "Jon Etxeberria", "MCD"], [7, "Erik Navas", "ED"], [11, "Samuel Lago", "EI"],
      [17, "Diego Peral", "EI"], [9, "Tomás Quiroga", "DC"], [19, "Raúl Méndez", "DC"]
    ];
    datos.forEach(function (d) {
      window.DB.jugadores.push({
        id: U.uid(), dorsal: d[0], nombre: d[1], pos: d[2],
        pie: "Diestro", estado: "Disponible", tel: "", notas: "", fechaNac: ""
      });
    });
    S.save();
    window.CB.app.renderAll();
    U.toast("18 jugadores cargados");
  }

  window.CB.squad = {
    render: render, abrir: abrir, editar: editar, demo: demo,
    filtrar: filtrar, ordenar: ordenar, badgeEstado: badgeEstado
  };
})();

</script>
<script>
/* ===== js/features/lugares.js ===== */
/* =============================================================
   CoachBoard · features/lugares.js
   Buscador de campos e instalaciones.

   Usa Nominatim, el buscador de OpenStreetMap: no hace falta clave ni
   cuenta de nadie. A cambio hay que ser buen vecino con su servicio,
   así que solo se consulta cuando el entrenador pulsa Buscar, nunca
   tecla a tecla, y los resultados llevan su atribución.

   Es lo único de toda la aplicación que necesita internet. Si no hay
   red, se avisa y se puede escribir el nombre a mano como siempre.
   ============================================================= */
(function () {
  "use strict";
  var U = window.CB.util;

  var API = "https://nominatim.openstreetmap.org/search";
  var ESPERA = 10000;                 // corta la consulta si tarda demasiado
  var destino = null;                 // { valor, onOk } de la edición en curso
  var ultimos = [];

  function url(texto) {
    return API + "?format=jsonv2&limit=8&addressdetails=1&accept-language=es" +
      "&q=" + encodeURIComponent(texto);
  }

  /* Nominatim devuelve el nombre en `name` y la dirección desglosada.
     Se arma algo que un entrenador reconozca: el campo y el pueblo. */
  function limpiar(r) {
    var a = r.address || {};
    var nombre = r.name || (r.display_name || "").split(",")[0] || "Sin nombre";
    var pueblo = a.city || a.town || a.village || a.municipality || a.county || "";
    var resto = (r.display_name || "").split(",").slice(1).join(",").trim();
    return {
      lugar: nombre,
      dir: resto || pueblo,
      pueblo: pueblo,
      lat: String(r.lat || ""),
      lon: String(r.lon || "")
    };
  }

  function elegir(actual, onOk) {
    destino = { valor: actual || {}, onOk: onOk };
    ultimos = [];
    pintar(actual && actual.lugar ? actual.lugar : "", null);
  }

  function pintar(texto, estado) {
    var v = destino ? destino.valor : {};
    var cuerpo =
      '<div class="row-x" style="gap:8px">' +
        '<input id="lqBusca" placeholder="Campo Municipal, polideportivo…" ' +
          'value="' + U.esc(texto || "") + '" style="flex:1" ' +
          'onkeydown="if(event.key===\'Enter\'){event.preventDefault();CB.lugares.buscar();}">' +
        '<button class="btn" onclick="CB.lugares.buscar()">' + U.svg("search") + '</button>' +
      '</div>';

    if (estado === "buscando") {
      cuerpo += '<p class="hint mt2">Buscando…</p>';
    } else if (estado === "sinred") {
      cuerpo += '<div class="empty mt2"><b>Sin conexión</b>' +
        'No se ha podido consultar el buscador. Escribe el nombre a mano y guarda: ' +
        'podrás añadir la ubicación más adelante.</div>';
    } else if (estado === "vacio") {
      cuerpo += '<div class="empty mt2"><b>Ningún resultado</b>' +
        'Prueba con el nombre del pueblo detrás, por ejemplo "Campo Municipal, Telde".</div>';
    } else if (ultimos.length) {
      cuerpo += '<div class="plist mt2">' + ultimos.map(function (r, i) {
        return '<div class="prow tap" onclick="CB.lugares.tomar(' + i + ')">' +
          '<span class="num-badge sm">' + U.svg("pin") + '</span>' +
          '<div class="pmain"><div class="nm">' + U.esc(r.lugar) + '</div>' +
          '<div class="sub">' + U.esc(r.dir) + '</div></div></div>';
      }).join("") + '</div>' +
      '<p class="hint mt1">Resultados de OpenStreetMap.</p>';
    } else {
      cuerpo += '<p class="hint mt2">Escribe el nombre del campo y pulsa buscar. ' +
        'Al elegirlo se guarda su ubicación y podrás abrirla en el mapa del móvil.</p>';
    }

    if (v.lugar) {
      cuerpo += '<div class="section mt3"><span class="eyebrow">Guardado ahora</span></div>' +
        '<div class="prow"><span class="num-badge sm">' + U.svg("pin") + '</span>' +
        '<div class="pmain"><div class="nm">' + U.esc(v.lugar) + '</div>' +
        '<div class="sub">' + U.esc(v.dir || (v.lat ? "con ubicación" : "sin ubicación")) + '</div></div></div>';
    }

    window.CB.shell.openSheet("Campo o instalación", cuerpo, [
      { text: "Cancelar", cls: "ghost", fn: function () { destino = null; window.CB.shell.closeSheet(); } },
      { text: "Usar lo escrito", cls: "", fn: aMano }
    ]);
    var i = U.$("lqBusca");
    if (i) i.focus();
  }

  /* Escribirlo a mano sigue valiendo: hay campos que no están en
     ningún mapa, y sin red esto es lo único que funciona. */
  function aMano() {
    var t = (U.val("lqBusca") || "").trim();
    if (!t) { U.toast("Escribe un nombre"); return; }
    entregar({ lugar: t, dir: "", lat: "", lon: "" });
  }

  function buscar() {
    var t = (U.val("lqBusca") || "").trim();
    if (t.length < 3) { U.toast("Escribe al menos tres letras"); return; }
    pintar(t, "buscando");

    var corta = null, ctrl = null;
    try {
      ctrl = new AbortController();
      corta = setTimeout(function () { ctrl.abort(); }, ESPERA);
    } catch (e) { ctrl = null; }

    fetch(url(t), ctrl ? { signal: ctrl.signal } : {})
      .then(function (r) {
        if (!r.ok) throw new Error("HTTP " + r.status);
        return r.json();
      })
      .then(function (lista) {
        if (corta) clearTimeout(corta);
        if (!destino) return;                      // se cerró mientras tanto
        ultimos = (lista || []).map(limpiar);
        pintar(t, ultimos.length ? null : "vacio");
      })
      .catch(function () {
        if (corta) clearTimeout(corta);
        if (!destino) return;
        ultimos = [];
        pintar(t, "sinred");
      });
  }

  function tomar(i) {
    var r = ultimos[i];
    if (r) entregar(r);
  }

  function entregar(v) {
    var fn = destino ? destino.onOk : null;
    destino = null;
    window.CB.shell.closeSheet();
    if (fn) fn(v);
  }

  /* ---------------------------------------------------------
     Abrir en el mapa del dispositivo
     --------------------------------------------------------- */
  function abrir(lat, lon, nombre) {
    if (!lat || !lon) { U.toast("Este sitio no tiene ubicación guardada"); return; }
    if (typeof window.abrirMapa === "function") {
      window.abrirMapa(String(lat), String(lon), String(nombre || ""));
      return;
    }
    /* En el navegador del PC no hay app de mapas: se abre la web. */
    window.open("https://www.openstreetmap.org/?mlat=" + encodeURIComponent(lat) +
      "&mlon=" + encodeURIComponent(lon) + "#map=17/" + lat + "/" + lon, "_blank");
  }

  window.CB.lugares = {
    elegir: elegir, buscar: buscar, tomar: tomar, abrir: abrir, limpiar: limpiar
  };
})();

</script>
<script>
/* ===== js/features/agenda.js ===== */
/* =============================================================
   CoachBoard · features/agenda.js
   Calendario de partidos y entrenamientos.
   ============================================================= */
(function () {
  "use strict";
  var U = window.CB.util;
  var S = window.CB.store;
  var M = window.CB.models;

  function render() {
    var ahora = new Date(); ahora.setHours(0, 0, 0, 0);
    var todos = S.evSorted();
    var prox = todos.filter(function (e) { return S.evDate(e) >= ahora; });
    var pasados = todos.filter(function (e) { return S.evDate(e) < ahora; }).reverse();

    var h = '<div class="section"><span class="eyebrow">Próximas</span>' +
      '<span class="link">' + prox.length + '</span></div>';
    h += prox.length
      ? '<div class="plist stagger">' + prox.map(fila).join("") + '</div>'
      : '<div class="empty"><b>Nada programado</b>Añade el próximo entrenamiento o partido.</div>';

    h += '<div class="section"><span class="eyebrow">Ya disputadas</span></div>';
    h += pasados.length
      ? '<div class="plist">' + pasados.slice(0, 40).map(fila).join("") + '</div>'
      : '<div class="empty">Todavía no hay sesiones pasadas.</div>';

    U.set("agendaBody", h);
  }

  function fila(e) {
    var lista = window.DB.asistencia.some(function (a) { return a.ev === e.id; });
    var acta = window.DB.partidos.some(function (p) { return p.ev === e.id; });
    var esPartido = S.isMatch(e);
    var marca = "";
    if (acta) marca = '<span class="badge ok">acta</span>';
    else if (lista) marca = '<span class="badge info">lista</span>';

    return '<div class="prow tap" onclick="CB.agenda.editar(\'' + e.id + '\')">' +
      '<span class="num-badge" style="font-size:9.5px;letter-spacing:.04em">' +
        (esPartido ? "PAR" : "ENT") + '</span>' +
      '<div class="pmain">' +
        '<div class="nm">' + U.esc(S.evTitle(e)) + '</div>' +
        '<div class="sub">' + U.esc(U.fmtDate(e.fecha)) + ' · ' + U.esc(e.hora || "") +
          (e.lugar ? " · " + U.esc(e.lugar) : "") + '</div>' +
      '</div>' + marca + '</div>';
  }

  function editar(id, tipoDefecto) {
    var e = id ? S.ev(id) : {
      tipo: tipoDefecto || "Entrenamiento",
      fecha: U.today(), hora: "19:00",
      rival: "", cond: "Local", lugar: "", comp: "", notas: "",
      /* La duración del último partido programado sirve de punto de
         partida: casi siempre se repite dentro de una misma categoría. */
      dur: M.normDur(window.DB.durDef)
    };
    if (!e) return;
    abrir(e, id);
  }

  /* El formulario se vuelve a pintar con lo escrito cuando se va y se
     vuelve del selector de duración, que ocupa la misma hoja. */
  var editandoId = null;

  function borrador() {
    return {
      tipo: U.val("eTipo"), fecha: U.val("eFec"), hora: U.val("eHor"),
      rival: U.val("eRiv").trim(), cond: U.val("eCon"),
      comp: U.val("eCom").trim(), notas: U.val("eNot"),
      dur: durActual,
      lugar: sitio.lugar, dir: sitio.dir, lat: sitio.lat, lon: sitio.lon
    };
  }
  var durActual = null;
  var sitio = { lugar: "", dir: "", lat: "", lon: "" };

  function duracion() {
    var b = borrador();
    window.CB.wheel.pedirDuracion(b.dur, function (nueva) {
      b.dur = nueva;
      abrir(b, editandoId);
    });
  }

  function lugar() {
    var b = borrador();
    window.CB.lugares.elegir(sitio, function (nuevo) {
      b.lugar = nuevo.lugar; b.dir = nuevo.dir;
      b.lat = nuevo.lat; b.lon = nuevo.lon;
      abrir(b, editandoId);
    });
  }

  function abrir(e, id) {
    editandoId = id || null;
    durActual = M.normDur(e.dur);
    sitio = {
      lugar: e.lugar || "", dir: e.dir || "",
      lat: e.lat || "", lon: e.lon || ""
    };

    var body =
      '<label class="f">Tipo de sesión</label>' +
      '<select id="eTipo">' + M.TIPOS_SESION.map(function (t) {
        return '<option ' + (t === e.tipo ? "selected" : "") + '>' + t + '</option>';
      }).join("") + '</select>' +
      '<div class="grid-2">' +
        '<div><label class="f">Fecha</label><input type="date" id="eFec" value="' + U.esc(e.fecha) + '"></div>' +
        '<div><label class="f">Hora</label><input type="time" id="eHor" value="' + U.esc(e.hora) + '"></div>' +
      '</div>' +
      '<label class="f">Rival</label>' +
      '<input id="eRiv" value="' + U.esc(e.rival) + '" placeholder="Solo si es partido">' +
      '<div class="grid-2">' +
        '<div><label class="f">Condición</label><select id="eCon">' +
          M.CONDICIONES.map(function (t) { return '<option ' + (t === e.cond ? "selected" : "") + '>' + t + '</option>'; }).join("") +
        '</select></div>' +
        '<div><label class="f">Competición</label><input id="eCom" value="' + U.esc(e.comp) + '"></div>' +
      '</div>' +
      '<label class="f">Lugar</label>' +
      '<button class="btn wide outline" onclick="CB.agenda.lugar()">' + U.svg("pin") +
        '<span class="lbl">' + U.esc(sitio.lugar || "Buscar el campo") + '</span></button>' +
      (sitio.lat
        ? '<button class="btn sm ghost wide mt1" onclick="CB.agenda.verMapa()">' +
            U.svg("pin") + 'Abrir en el mapa</button>'
        : sitio.lugar
          ? '<p class="hint">Sin ubicación guardada: solo el nombre.</p>'
          : "") +
      '<label class="f">Duración del partido</label>' +
      '<button class="btn wide outline" onclick="CB.agenda.duracion()">' + U.svg("clock") +
        '<span class="lbl">' + M.durTexto(durActual) +
        (durActual.desc ? " · descanso " + durActual.desc + " min" : "") + '</span></button>' +
      '<label class="f">Objetivo de la sesión</label><textarea id="eNot">' + U.esc(e.notas) + '</textarea>';

    var botones = [];
    if (id) {
      botones.push({
        text: "Eliminar", cls: "ghost", fn: function () {
          if (!window.CB.shell.confirmar("¿Eliminar la sesión y su lista de asistencia?")) return;
          window.DB.eventos = window.DB.eventos.filter(function (x) { return x.id !== id; });
          window.DB.asistencia = window.DB.asistencia.filter(function (a) { return a.ev !== id; });
          S.save();
          window.CB.shell.closeSheet();
          window.CB.app.renderAll();
          U.toast("Sesión eliminada");
        }
      });
    } else {
      botones.push({ text: "Cancelar", cls: "ghost", fn: window.CB.shell.closeSheet });
    }
    botones.push({
      text: "Guardar", cls: "pri", fn: function () {
        var o = {
          id: id || U.uid(),
          tipo: U.val("eTipo"), fecha: U.val("eFec"), hora: U.val("eHor"),
          rival: U.val("eRiv").trim(), cond: U.val("eCon"),
          comp: U.val("eCom").trim(), notas: U.val("eNot"),
          dur: M.normDur(durActual),
          lugar: sitio.lugar, dir: sitio.dir, lat: sitio.lat, lon: sitio.lon
        };
        if (!o.fecha) { U.toast("Elige la fecha"); return; }
        if (S.isMatch(o)) window.DB.durDef = o.dur;   // se recuerda para el siguiente
        if (id) window.DB.eventos = window.DB.eventos.map(function (x) { return x.id === id ? o : x; });
        else window.DB.eventos.push(o);
        S.save();
        window.CB.shell.closeSheet();
        window.CB.app.renderAll();
        U.toast(id ? "Sesión actualizada" : "Sesión programada");
      }
    });

    window.CB.shell.openSheet(id ? "Editar sesión" : "Nueva sesión", body, botones);
  }

  function verMapa() {
    window.CB.lugares.abrir(sitio.lat, sitio.lon, sitio.lugar);
  }

  /* Desde la ficha de la sesión, sin pasar por el formulario. */
  function mapaDe(id) {
    var e = S.ev(id);
    if (e) window.CB.lugares.abrir(e.lat, e.lon, e.lugar);
  }

  window.CB.agenda = {
    render: render, editar: editar, duracion: duracion,
    lugar: lugar, verMapa: verMapa, mapaDe: mapaDe
  };
})();

</script>
<script>
/* ===== js/features/attendance.js ===== */
/* =============================================================
   CoachBoard · features/attendance.js
   Pasar lista en pocos segundos: un toque por jugador.
   ============================================================= */
(function () {
  "use strict";
  var U = window.CB.util;
  var S = window.CB.store;
  var M = window.CB.models;

  var evId = null;
  var estado = {};          // jugadorId -> estado

  function sesiones() {
    return S.evSorted().reverse();
  }

  function elegirSesionPorDefecto() {
    var lista = sesiones();
    if (!lista.length) { evId = null; return; }
    if (evId && lista.some(function (e) { return e.id === evId; })) return;
    /* La sesión más cercana a hoy es casi siempre la que se quiere. */
    var hoy = new Date(); hoy.setHours(0, 0, 0, 0);
    var futura = lista.slice().reverse().filter(function (e) { return S.evDate(e) >= hoy; })[0];
    evId = (futura || lista[0]).id;
  }

  function cargarEstado() {
    estado = {};
    var guardada = window.DB.asistencia.filter(function (a) { return a.ev === evId; })[0];
    window.DB.jugadores.forEach(function (j) {
      var r = guardada && guardada.regs.filter(function (x) { return x.j === j.id; })[0];
      if (r) estado[j.id] = r.e;
      else estado[j.id] = j.estado === "Lesionado" ? "Justificado" : "Pendiente";
    });
  }

  function guardar() {
    if (!evId) return;
    window.DB.asistencia = window.DB.asistencia.filter(function (a) { return a.ev !== evId; });
    window.DB.asistencia.push({
      ev: evId,
      regs: Object.keys(estado).map(function (j) { return { j: j, e: estado[j] }; })
    });
    S.save();
  }

  function cuenta(e) {
    return Object.keys(estado).filter(function (k) { return estado[k] === e; }).length;
  }

  function render() {
    elegirSesionPorDefecto();
    cargarEstado();

    var e = evId ? S.ev(evId) : null;
    var arr = window.DB.jugadores.slice().sort(function (a, b) { return (a.dorsal || 99) - (b.dorsal || 99); });
    var total = arr.length;
    var presentes = cuenta("Presente");

    var h = "";

    h += '<label class="f">Sesión</label>' +
      '<select id="attSel" onchange="CB.attendance.cambiarSesion(this.value)">' +
      (sesiones().length
        ? sesiones().map(function (x) {
            return '<option value="' + x.id + '" ' + (x.id === evId ? "selected" : "") + '>' +
              U.fmtDate(x.fecha) + " · " + U.esc(S.evTitle(x)) + '</option>';
          }).join("")
        : '<option value="">Programa antes una sesión</option>') +
      '</select>';

    if (!e) {
      U.set("attBody", h + '<div class="empty mt3"><b>Sin sesiones</b>' +
        'Programa un entrenamiento en el calendario.' +
        '<div class="mt3"><button class="btn sm pri" onclick="CB.agenda.editar(null,\'Entrenamiento\')">Programar</button></div></div>');
      return;
    }

    h += '<div class="card mt2">' +
      '<div class="row-x"><div class="pmain">' +
        '<div class="nm" style="font-size:15.5px">' + U.esc(e.tipo) + '</div>' +
        '<div class="sub">' + U.esc(U.fmtDateLong(e.fecha)) + ' · ' + U.esc(e.hora || "") + '</div>' +
      '</div>' +
      '<div class="pend"><div class="big" style="font-size:19px">' + presentes + ' / ' + total + '</div>' +
      '<div class="small">confirmados</div></div></div></div>';

    h += '<div class="attsum">' +
      res("ok", cuenta("Presente"), "Presentes") +
      res("bad", cuenta("Ausente"), "Ausentes") +
      res("info", cuenta("Justificado"), "Justif.") +
      res("warn", cuenta("Pendiente"), "Pendientes") +
      '</div>';

    h += '<div class="grid-2">' +
      '<button class="btn sm" onclick="CB.attendance.todos(\'Presente\')">' + U.svg("check") + 'Todos presentes</button>' +
      '<button class="btn sm ghost" onclick="CB.attendance.todos(\'Pendiente\')">Reiniciar</button>' +
      '</div>';

    if (!total) {
      h += '<div class="empty mt3"><b>No hay jugadores</b>Da de alta la plantilla primero.</div>';
    } else {
      h += '<div class="plist mt2">' + arr.map(filaJugador).join("") + '</div>';
      h += '<div class="section"><span class="eyebrow">Quién viene a entrenar</span></div>' + ranking();
    }

    U.set("attBody", h);
  }

  function res(cls, v, k) {
    return '<div class="s ' + cls + '"><div class="v">' + v + '</div><div class="k">' + k + '</div></div>';
  }

  function filaJugador(j) {
    var e = estado[j.id] || "Pendiente";
    return '<div class="prow" id="att-' + j.id + '" onclick="CB.attendance.ciclar(\'' + j.id + '\')">' +
      '<span class="attmark ' + e + '" id="attmk-' + j.id + '">' + M.ATT_GLYPH[e] + '</span>' +
      '<div class="pmain"><div class="nm">' + U.esc(j.nombre) + '</div>' +
      '<div class="sub" id="attlb-' + j.id + '">' + e + '</div></div>' +
      '<span class="num-badge sm">' + (j.dorsal || "–") + '</span></div>';
  }

  function ranking() {
    var arr = window.DB.jugadores.map(function (j) { return { j: j, a: S.attPct(j.id) }; })
      .filter(function (x) { return x.a; })
      .sort(function (x, y) { return y.a.pct - x.a.pct; });
    if (!arr.length) return '<div class="empty">Guarda alguna lista para ver el ranking.</div>';
    return '<div class="plist">' + arr.map(function (x) {
      var col = x.a.pct >= 85 ? "var(--accent)" : x.a.pct < 60 ? "var(--danger)" : "var(--text-dim)";
      return '<div class="prow"><span class="num-badge sm">' + (x.j.dorsal || "–") + '</span>' +
        '<div class="pmain"><div class="nm">' + U.esc(x.j.nombre) + '</div>' +
        '<div class="sub">' + x.a.p + ' de ' + x.a.t + ' sesiones</div></div>' +
        '<div class="pend"><div class="big" style="color:' + col + '">' + x.a.pct + '%</div></div></div>';
    }).join("") + '</div>';
  }

  /* Un toque recorre los estados; se guarda al instante. */
  function ciclar(id) {
    var actual = estado[id] || "Pendiente";
    var i = M.ATT_STATES.indexOf(actual);
    estado[id] = M.ATT_STATES[(i + 1) % M.ATT_STATES.length];
    guardar();

    var mk = U.$("attmk-" + id);
    if (mk) {
      mk.className = "attmark " + estado[id] + " pop";
      mk.textContent = M.ATT_GLYPH[estado[id]];
      setTimeout(function () { mk.classList.remove("pop"); }, 140);
    }
    var lb = U.$("attlb-" + id);
    if (lb) lb.textContent = estado[id];
    actualizarResumen();
  }

  function actualizarResumen() {
    var caja = U.$("attBody");
    if (!caja) return;
    var s = caja.querySelectorAll(".attsum .s .v");
    if (s.length === 4) {
      s[0].textContent = cuenta("Presente");
      s[1].textContent = cuenta("Ausente");
      s[2].textContent = cuenta("Justificado");
      s[3].textContent = cuenta("Pendiente");
    }
    var big = caja.querySelector(".card .pend .big");
    if (big) big.textContent = cuenta("Presente") + " / " + window.DB.jugadores.length;
  }

  function todos(e) {
    Object.keys(estado).forEach(function (k) { estado[k] = e; });
    guardar();
    render();
    U.toast(e === "Presente" ? "Todos presentes" : "Lista reiniciada");
  }

  function cambiarSesion(id) { evId = id; render(); }

  function abrir(id) {
    evId = id || evId;
    window.CB.shell.closeSheet();
    window.CB.shell.go("att");
  }

  window.CB.attendance = {
    render: render, ciclar: ciclar, todos: todos,
    cambiarSesion: cambiarSesion, abrir: abrir
  };
})();

</script>
<script>
/* ===== js/features/match.js ===== */
/* =============================================================
   CoachBoard · features/match.js
   Partido en directo. Pensado para usarse de pie, en el banquillo:
   primero se pulsa la acción y después se elige el jugador.
   ============================================================= */
(function () {
  "use strict";
  var U = window.CB.util;
  var S = window.CB.store;
  var M = window.CB.models;

  var evId = null;
  var timer = null;
  var panelActivo = "directo";   // directo | plantilla
  var golPendiente = null;       // goleador a la espera de asistencia

  function m() { return window.DB.match; }
  function partidos() { return S.evSorted().filter(S.isMatch).reverse(); }

  function seleccionar(id) {
    evId = id;
    render();
  }

  function elegirPartidoPorDefecto() {
    var lista = partidos();
    if (!lista.length) { evId = null; return; }
    if (m() && lista.some(function (e) { return e.id === m().ev; })) { evId = m().ev; return; }
    if (evId && lista.some(function (e) { return e.id === evId; })) return;
    var hoy = new Date(); hoy.setHours(0, 0, 0, 0);
    var futuro = lista.slice().reverse().filter(function (e) { return S.evDate(e) >= hoy; })[0];
    evId = (futuro || lista[0]).id;
  }

  /* ---------------------------------------------------------
     Reloj
     --------------------------------------------------------- */
  /* La duración viaja con el partido, así que los tiempos base y los
     nombres de los periodos se calculan; no son una constante. */
  function dur() { var mt = m(); return M.normDur(mt && mt.dur); }
  function bases() { return M.periodoBase(dur()); }
  function etiquetaPeriodo(i) {
    var p = M.periodos(dur());
    return p[i] || p[p.length - 1];
  }
  function relojSeg() {
    var mt = m();
    return mt ? bases()[mt.per] + mt.seg : 0;
  }
  function minuto() { return m() ? Math.floor(relojSeg() / 60) + 1 : 0; }

  function arrancar() {
    var mt = m();
    mt.run = true;
    clearInterval(timer);
    timer = setInterval(function () {
      var x = m();
      if (!x) { clearInterval(timer); return; }
      x.seg++;
      x.campo.forEach(function (id) { x.t[id] = (x.t[id] || 0) + 1; });
      var c = U.$("mClock");
      if (c) c.textContent = U.mmss(relojSeg());
      if (x.seg % 10 === 0 && panelActivo === "plantilla") pintarPlantilla();
      if (x.seg % 15 === 0) S.save();
    }, 1000);
  }
  function parar() {
    clearInterval(timer);
    timer = null;
    if (m()) m().run = false;
  }

  /* ---------------------------------------------------------
     Descanso

     Antes, al pasar de parte el reloj se quedaba en pausa sin decir
     nada: si el entrenador no le daba a "Reanudar", la segunda parte
     no contaba y el acta se cerraba en 45:00. Ahora el descanso
     arranca solo y el botón grande pasa a "Empezar la 2ª parte", así
     que no queda ningún estado muerto.
     --------------------------------------------------------- */
  function enDescanso() { var mt = m(); return !!(mt && mt.br); }

  function descansoRestante() {
    var mt = m();
    if (!mt || !mt.br) return 0;
    return (mt.br.total || 0) - mt.br.seg;
  }
  function textoDescanso() {
    var r = descansoRestante();
    return (r < 0 ? "+" : "") + U.mmss(Math.abs(r));
  }

  function arrancarDescanso(total) {
    var mt = m();
    mt.br = { seg: 0, total: total, run: true };
    clearInterval(timer);
    timer = setInterval(function () {
      var x = m();
      if (!x || !x.br || !x.br.run) { clearInterval(timer); timer = null; return; }
      x.br.seg++;
      var c = U.$("mClock");
      if (c) c.textContent = textoDescanso();
      if (x.br.seg % 15 === 0) S.save();
    }, 1000);
  }

  /* Cierra el descanso y arranca de verdad la parte que toca. */
  function empezarParte() {
    var mt = m();
    if (!mt) return;
    var gastado = mt.br ? mt.br.seg : 0;
    mt.br = null;
    clearInterval(timer);
    log("Comienza " + conArticulo(mt.per), "periodo",
      "a", gastado ? "Descanso de " + U.mmss(gastado) : "");
    arrancar();
    S.save();
    render();
  }

  function alternarReloj() {
    var mt = m();
    if (!mt) { U.toast("Convoca primero"); return; }
    if (enPenaltis()) { U.toast("La tanda no lleva reloj"); penaltis(); return; }
    if (enDescanso()) { empezarParte(); return; }
    if (mt.run) {
      parar();
      log("Reloj parado", "periodo");
    } else {
      if (!mt.started) {
        if (mt.campo.length < 11 &&
            !window.CB.shell.confirmar("Solo hay " + mt.campo.length + " jugadores en el campo. ¿Empezar igualmente?")) return;
        mt.started = true;
        mt.titulares = mt.campo.slice();
        log("Comienza el partido", "periodo");
      } else {
        log("Se reanuda el juego", "periodo");
      }
      arrancar();
    }
    S.save();
    render();
  }
  function enPenaltis() { var mt = m(); return !!mt && mt.per === M.penIndex(dur()); }

  /* Cambiar la duración con el partido ya convocado: si al programarlo
     se quedó en 2 x 45 por descuido, se arregla aquí sin perder nada. */
  function cambiarDuracion() {
    var mt = m();
    if (!mt) { U.toast("Convoca primero"); return; }
    window.CB.wheel.pedirDuracion(mt.dur, function (nueva) {
      mt.dur = nueva;
      var e = S.ev(mt.ev);
      if (e) e.dur = nueva;
      S.save();
      render();
      U.toast("Duración: " + M.durTexto(nueva));
    });
  }

  /* "la 2ª parte" / "el 3er cuarto": el artículo depende del formato. */
  function femenino(i) { return /parte|[Pp]rórroga/.test(etiquetaPeriodo(i)); }
  function conArticulo(i) {
    return (femenino(i) ? "la " : "el ") + etiquetaPeriodo(i);
  }
  /* Con la contracción: "Fin de la 2ª parte", pero "Fin del 4º cuarto". */
  function finDe(i) {
    return "Fin " + (femenino(i) ? "de la " : "del ") + etiquetaPeriodo(i);
  }

  /* Fin de parte. No es un "siguiente" a ciegas: al acabar el tiempo
     reglamentario y la prórroga hay que decidir, y lo normal es que el
     partido termine ahí. Por eso pregunta en vez de encadenar
     prórrogas él solo. Los índices salen del formato, que puede ser de
     dos partes o de cuatro cuartos. */
  function siguientePeriodo() {
    var mt = m();
    if (!mt) return;
    if (enPenaltis()) { penaltis(); return; }

    var d = dur();
    var ultima = d.partes - 1;     // última parte del tiempo reglamentario
    var pro1 = d.partes;
    var pro2 = d.partes + 1;

    /* Entre partes, y de la prórroga 1 a la 2, no hay nada que decidir. */
    if (mt.per < ultima) { avanzarA(mt.per + 1); return; }
    if (mt.per === pro1) { avanzarA(pro2); return; }

    var empate = mt.gf === mt.gc;
    var marcador = mt.gf + " – " + mt.gc;
    var titulo = finDe(mt.per);

    if (mt.per === ultima) {
      if (empate) {
        elegirOpcion(titulo, "Empate a " + mt.gf + ". ¿Cómo sigue?",
          ["Jugar la prórroga", "Ir directo a los penaltis", "Terminar en empate"],
          function (op) {
            if (op === "Jugar la prórroga") avanzarA(pro1);
            else if (op === "Ir directo a los penaltis") irAPenaltis();
            else terminar();
          });
      } else {
        elegirOpcion(titulo, "Vas " + marcador + ": el partido está decidido.",
          ["Finalizar el partido", "Jugar la prórroga igualmente"],
          function (op) {
            if (op === "Finalizar el partido") terminar();
            else avanzarA(pro1);
          });
      }
      return;
    }

    /* mt.per === pro2: se acaba la prórroga. */
    if (empate) {
      elegirOpcion(titulo, "Seguís empatados a " + mt.gf + ".",
        ["Ir a los penaltis", "Terminar en empate"],
        function (op) { if (op === "Ir a los penaltis") irAPenaltis(); else terminar(); });
    } else {
      elegirOpcion(titulo, "Vas " + marcador + ": el partido está decidido.",
        ["Finalizar el partido", "Ir a los penaltis"],
        function (op) { if (op === "Finalizar el partido") terminar(); else irAPenaltis(); });
    }
  }

  function avanzarA(per) {
    var mt = m();
    var acaba = mt.per;
    parar();
    /* Se anota el tiempo real al que se cerró la parte: si hubo
       añadido, ese minuto no se pierde aunque el reloj de la parte
       siguiente arranque en su minuto de siempre. */
    log(finDe(acaba) + " (" + U.mmss(relojSeg()) + ")", "periodo");
    mt.per = per;
    mt.seg = 0;
    arrancarDescanso(M.descansoSeg(dur(), acaba));
    S.save();
    render();
  }

  /* El botón de la hoja ya es la confirmación: no se pregunta dos veces. */
  function terminar() { finalizar(true); }

  function etiquetaFinParte() {
    var mt = m();
    if (!mt) return "Siguiente parte";
    if (enPenaltis()) return "Tanda de penaltis";
    return finDe(mt.per);
  }

  /* ---------------------------------------------------------
     Crónica
     --------------------------------------------------------- */
  function log(txt, kind, side, sub) {
    var mt = m();
    if (!mt) return;
    mt.log.unshift({ m: minuto(), t: txt, k: kind || "nota", s: side || "a", sub: sub || "" });
  }
  function nombre(id) {
    var j = S.jug(id);
    return j ? (j.dorsal + " " + j.nombre) : "?";
  }
  function rivalNombre() {
    var mt = m();
    var e = mt ? S.ev(mt.ev) : null;
    return (e && e.rival) || "Rival";
  }
  function icono(k) {
    switch (k) {
      case "gol": return '<span class="ic"><i class="i-ball"></i></span>';
      case "golcon": return '<span class="ic"><i class="i-ball con"></i></span>';
      case "amarilla": return '<span class="ic"><i class="i-card y"></i></span>';
      case "doble": return '<span class="ic"><i class="i-card yr"></i></span>';
      case "roja": return '<span class="ic"><i class="i-card r"></i></span>';
      case "cambio": return '<span class="ic i-swap">&#8593;<span>&#8595;</span></span>';
      case "asis": return '<span class="ic"><i class="i-as">A</i></span>';
      case "falta": return '<span class="ic"><i class="i-foul"></i></span>';
      case "pengol": return '<span class="ic"><i class="i-ball pen"></i></span>';
      case "penfallo": return '<span class="ic"><i class="i-ball fallo"></i></span>';
      default: return '<span class="ic"><i class="i-note"></i></span>';
    }
  }

  /* ---------------------------------------------------------
     Pintado
     --------------------------------------------------------- */
  function render() {
    elegirPartidoPorDefecto();
    var e = evId ? S.ev(evId) : null;
    var mt = m();
    var hayActa = e && window.DB.partidos.some(function (p) { return p.ev === e.id; });

    var h = "";

    h += '<div class="row-x" style="gap:8px">' +
      '<select id="mSel" onchange="CB.match.cambiar(this.value)" style="flex:1">' +
      (partidos().length
        ? partidos().map(function (x) {
            return '<option value="' + x.id + '" ' + (x.id === evId ? "selected" : "") + '>' +
              U.fmtDate(x.fecha) + " · " + U.esc(x.rival || "sin rival") + '</option>';
          }).join("")
        : '<option value="">Programa antes un partido</option>') +
      '</select></div>';

    if (!e) {
      U.set("matchBody", h + '<div class="empty mt3"><b>Sin partidos</b>' +
        'Programa un encuentro en el calendario para poder dirigirlo desde aquí.' +
        '<div class="mt3"><button class="btn sm pri" onclick="CB.agenda.editar(null,\'Partido\')">Programar partido</button></div></div>');
      return;
    }

    var local = e.cond !== "Visitante";
    var nosotros = S.club();
    var rival = e.rival || "Rival";
    var izq = local ? nosotros : rival;
    var der = local ? rival : nosotros;
    var gi = mt ? (local ? mt.gf : mt.gc) : 0;
    var gd = mt ? (local ? mt.gc : mt.gf) : 0;

    /* --- marcador --- */
    h += '<div class="board mt2">' +
      '<div class="teams"><div class="tn">' + U.esc(izq) + '</div><div class="tn"></div>' +
      '<div class="tn">' + U.esc(der) + '</div></div>' +
      '<div class="score num"><span>' + gi + '</span><span class="sep">–</span><span>' + gd + '</span></div>' +
      (mt && mt.pen && mt.pen.tiros.length
        ? '<div class="penline num">' + (local ? mt.pen.a : mt.pen.b) + " – " +
